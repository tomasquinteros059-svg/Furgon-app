# Arma un APK instalable para probar, sin Expo (EAS) ni token: `expo prebuild` genera el proyecto
# Android y Gradle lo compila con el SDK que ya trae el runner de GitHub.
#
# Cómo usarlo: pestaña Actions → «APK para probar» → Run workflow. También corre al subir un commit
# cuyo mensaje contenga [apk]. Al terminar, el APK queda en Releases (para bajarlo desde el
# teléfono) y en los Artifacts de la corrida.
#
# Secretos (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF  → la app se conecta a ese proyecto
#   GOOGLE_MAPS_ANDROID_API_KEY (opcional)       → mapa dentro de la app. Debe ser una clave
#                                                  RESTRINGIDA a apps Android: queda dentro del APK.
#
# El APK va firmado con la clave de depuración de Expo: sirve para instalar y probar, no para Play.

name: APK para probar

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write # para publicar el APK en Releases

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # el número de compilación es la cantidad de commits

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Código del proyecto de Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/resolver-proyecto.mjs >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas, tipos y traducciones
        run: |
          npm test
          npx tsc --noEmit -p tsconfig.json
          (cd apps/movil && npx tsc --noEmit)
          npm run idiomas

      - name: Servidor al que se conecta la app
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            {
              echo "## Faltan secretos"
              echo
              echo "Sin \`SUPABASE_ACCESS_TOKEN\` y \`SUPABASE_PROJECT_REF\` el APK no podría iniciar sesión."
              echo "Agrégalos en **Settings → Secrets and variables → Actions** y corre primero **Publicar servidor**."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF."
            exit 1
          fi
          node scripts/claves-publicas.mjs >> "$GITHUB_ENV"
          [ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ] && echo "::warning::Sin GOOGLE_MAPS_ANDROID_API_KEY: el mapa dentro de la app se verá en blanco." || true
          echo "Conectada a https://$SUPABASE_REF_RESUELTO.supabase.co"

      - name: Numerar la compilación
        id: nombre
        run: |
          version=$(grep -m1 -oE 'version: "[^"]+"' apps/movil/app.config.ts | cut -d'"' -f2)
          codigo=$(git rev-list --count HEAD)
          echo "sufijo=$version-$codigo-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "etiqueta=apk-$version-$codigo" >> "$GITHUB_OUTPUT"
          echo "Versión $version · compilación $codigo"

      - name: Firebase (avisos con la app cerrada)
        env:
          CONTENIDO: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
        run: |
          # google-services.json de Firebase (secreto FIREBASE_GOOGLE_SERVICES: el archivo completo pegado).
          if [ -z "$CONTENIDO" ]; then
            echo "::warning::Sin FIREBASE_GOOGLE_SERVICES: el APK no recibe avisos con la app cerrada (la alarma suena solo con la app abierta)."
            exit 0
          fi
          printf '%s' "$CONTENIDO" > apps/movil/google-services.json
          if ! node -e 'const j=require("./apps/movil/google-services.json"); const ok=(j.client||[]).some(c=>c.client_info?.android_client_info?.package_name==="cl.furgonapp.movil"); process.exit(ok?0:1)'; then
            echo "::error::FIREBASE_GOOGLE_SERVICES no es un google-services.json válido para la app cl.furgonapp.movil. Revisa que en Firebase la app Android tenga ese nombre de paquete."
            exit 1
          fi
          echo "GOOGLE_SERVICES_JSON=$GITHUB_WORKSPACE/apps/movil/google-services.json" >> "$GITHUB_ENV"
          echo "Con Firebase."

      - name: Generar el proyecto Android
        working-directory: apps/movil
        run: npx expo prebuild --platform android --no-install

      - name: Compilar el APK
        working-directory: apps/movil/android
        run: |
          chmod +x gradlew
          # Solo arm64: cubre los teléfonos Android de los últimos años y compila en la mitad del tiempo.
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          mkdir -p "$GITHUB_WORKSPACE/entrega"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/entrega/FurgonEscolar-${{ steps.nombre.outputs.sufijo }}.apk"

      - name: Huella de la firma (para restringir la clave de Google a esta app)
        continue-on-error: true
        run: |
          firmador=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          huella=$("$firmador" verify --print-certs entrega/*.apk | grep -m1 "SHA-1 digest" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-f A-F || true)
          {
            echo "### Para restringir la clave de Maps a la app"
            echo
            echo "Nombre del paquete: \`cl.furgonapp.movil\` · Huella SHA-1: \`$huella\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-1: $huella"

      - uses: actions/upload-artifact@v4
        with:
          name: FurgonEscolar-${{ steps.nombre.outputs.sufijo }}
          path: entrega/*.apk

      - name: Publicar en Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETA: ${{ steps.nombre.outputs.etiqueta }}
        run: |
          gh release create "$ETIQUETA" entrega/*.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "APK de prueba ${{ steps.nombre.outputs.sufijo }}" \
            --notes "APK para instalar y probar en Android (firmado con clave de depuración, no es para Google Play)."
          # Enlace fijo que siempre tiene la última: .../releases/tag/ultimo-apk
          gh release delete ultimo-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo-apk entrega/*.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Última APK de prueba (${{ steps.nombre.outputs.sufijo }})" \
            --notes "Siempre la versión más reciente. Toca el archivo .apk de abajo, en Assets, para descargarlo."

      - name: Resumen
        env:
          URL_RELEASE: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.nombre.outputs.etiqueta }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## APK listo ✅"
            echo
            if [ "${{ steps.release.outcome }}" = "success" ]; then
              echo "Bájalo desde el teléfono: $URL_RELEASE"
            else
              echo "No se pudo publicar en Releases (GitHub Actions está en solo lectura: **Settings → Actions → General →"
              echo "Workflow permissions → Read and write permissions → Save**). El APK igual está en **Artifacts**, al final de $URL_RUN"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
