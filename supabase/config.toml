# Configuración mínima del proyecto Supabase (ver `supabase init` para todas las opciones).
project_id = "furgon-app"

[api]
schemas = ["public"]

[auth]
site_url = "furgonapp://"
enable_signup = true
# «Entrar con código de familia»: sesión anónima que solo crea perfil con un código válido.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# Para el prototipo no se exige confirmar el correo. Actívalo en producción.
enable_confirmations = false

# Twilio llama a este webhook sin JWT: se protege validando X-Twilio-Signature.
[functions.twilio-webhook]
verify_jwt = false

# Pensada para pg_cron / un scheduler externo: se protege con CRON_SECRET.
[functions.procesar-llamadas]
verify_jwt = false

# Diaria, desde pg_cron: avisa vencimientos de licencias. Se protege con CRON_SECRET.
[functions.avisos-licencias]
verify_jwt = false
