<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furgón Escolar · Tía del furgón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* App de la conductora ("tía del furgón"): una sola columna móvil, barra de pestañas inferior, botones grandes para usar detenida. */
:root {
  --bg: #E7EBEF; --app: #F4F6F8; --surface: #FFFFFF; --surface-2: #EEF1F4;
  --ink: #15202B; --muted: #5A6573; --line: #D3D9E0; --road: #C4CBD3;
  --bus: #F5B700; --bus-ink: #2A2100; --bus-soft: #FFF4CC;
  --navy: #16324F; --navy-ink: #FFFFFF;
  --ok: #1D7F45; --ok-soft: #E4F3EA; --alert: #C4281C; --alert-soft: #FCE9E7;
  --mapa-fondo: #E9EEF2; --mapa-manzana: #F6F8FA; --mapa-calle: #FFFFFF; --mapa-avenida: #FFE9A8; --mapa-parque: #D5EBCF; --mapa-agua: #BFDDF0;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
    --line: #2B3743; --road: #3A4754; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
    --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
    --mapa-fondo: #1A232C; --mapa-manzana: #212C36; --mapa-calle: #2D3A46; --mapa-avenida: #4A4220; --mapa-parque: #1F3324; --mapa-agua: #1C3446;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
  --line: #2B3743; --road: #3A4754; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
  --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
  --mapa-fondo: #1A232C; --mapa-manzana: #212C36; --mapa-calle: #2D3A46; --mapa-avenida: #4A4220; --mapa-parque: #1F3324; --mapa-agua: #1C3446;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.telefono { width: min(410px, 100%); height: min(860px, calc(100vh - 60px)); min-height: 620px; background: var(--app); border: 10px solid var(--ink); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 520px) {
  body { padding: 0; gap: 0; }
  .rotulo { display: none; }
  .telefono { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; }
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.estado-sis { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.vista { flex: 1; overflow-y: auto; padding: 6px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; padding: 9px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabs button span { font-size: 20px; line-height: 1; }
.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] span { filter: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fila > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.alerta { background: var(--alert-soft); color: var(--alert); }
.chip.bus { background: var(--bus-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 16px; background: var(--navy); color: var(--navy-ink); }
.btn.bus { background: var(--bus); color: var(--bus-ink); }
.btn.sec { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.peligro { background: var(--alert); color: #fff; }
.btn.xl { min-height: 64px; font-size: 19px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.grandes { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.grandes button { border: 0; border-radius: 14px; min-height: 72px; font-weight: 700; font-size: 20px; color: #fff; }
.grandes .ok { background: var(--ok); }
.grandes .no { background: var(--alert); font-size: 17px; }
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-weight: 700; font-size: 14px; }
.campo input { border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
.nota { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.mapa { position: relative; }
.mapa > svg { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--mapa-fondo); }
.gmap-host, .gmap { width: 100%; height: 320px; border-radius: 14px; overflow: hidden; }
.sello { position: absolute; left: 8px; bottom: 8px; background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: inline-flex; gap: 5px; align-items: center; }
.sello .g { color: #1A73E8; }
.nota-mapa { font-size: 12px; color: var(--muted); margin-top: 4px; }
.btn-nav { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 48px; border-radius: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn-nav b { color: #1A73E8; }
@media (prefers-reduced-motion: no-preference) { .halo { animation: halo 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes halo { from { opacity: .55; transform: scale(.6); } to { opacity: 0; transform: scale(1.6); } }
.lista-ev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-ev li { display: grid; grid-template-columns: 46px 20px minmax(0, 1fr); gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lista-ev li:last-child { border-bottom: 0; }
.lista-ev .h { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.parada { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.parada.actual { border: 2px solid var(--bus); }
.parada .num { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.parada .nom { font-weight: 700; font-size: 19px; }
.parada.hecha { opacity: .65; padding: 9px 12px; }
.manejo { display: flex; gap: 10px; align-items: center; background: var(--navy); color: var(--navy-ink); border-radius: 14px; padding: 12px; }
.manejo b { display: block; font-size: 16px; }
.manejo span { font-size: 26px; }
.demo { border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.vista > .seg { flex-shrink: 0; align-self: flex-start; }
.vista > .seg button { padding: 8px 14px; font-size: 15px; }
.seg button { border: 0; background: transparent; padding: 4px 9px; font-size: 13px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--app); }
.chk { display: inline-flex; gap: 6px; align-items: center; }
.chk input { width: 17px; height: 17px; accent-color: var(--navy); }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--bus); color: var(--bus-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; flex: none; }
.dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dato:last-child { border-bottom: 0; }
.dato span:first-child { color: var(--muted); }
.dato span:last-child { text-align: right; font-weight: 700; }
.cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cifra { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.cifra b { display: block; font-family: var(--font-mono); font-size: 20px; }
.cifra span { font-size: 12px; color: var(--muted); }
.hoja-fondo { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; }
.hoja { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.toast { position: absolute; left: 10px; right: 10px; top: 34px; z-index: 9; background: var(--surface); border: 2px solid var(--ok); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: baja .3s ease-out; } }
@keyframes baja { from { transform: translateY(-130%); } to { transform: none; } }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
details.hist summary { cursor: pointer; list-style: none; }
details.hist summary::-webkit-details-marker { display: none; }
table.det { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.det th, table.det td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.det td.mono { font-size: 12px; }
.volver-adm { border: 0; background: transparent; font-weight: 700; color: var(--navy); padding: 2px 0; align-self: flex-start; cursor: pointer; }
.rec { border: 2px solid var(--bus); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bus-soft); }
.rec-lista { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 2px; }
.ejemplo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
</style>
</head>
<body>
<span class="rotulo">Perfil · Tía del furgón (conductora)</span>
<div class="telefono" id="tel"></div>

<script>
(() => {
  // ---------- Datos de la demo ----------
  const TIA = { nombre: "Marcela Fuentes", corto: "Marcela", email: "marcela@furgonesdemo.cl", tel: "+56 9 5555 1234", licencia: "Clase A1 · vence 03/2027" };
  const FURGON = { patente: "DEMO-11", modelo: "Hyundai H1 blanca", capacidad: 12, empresa: "Furgones Demo" };
  const COLEGIO = { lat: -33.4565, lng: -70.5978, nombre: "Colegio (Plaza Ñuñoa)" };
  const BASE = { lat: -33.4705, lng: -70.6130, nombre: "Base" };
  const ALUMNOS = [
    { id: "sofia", nombre: "Sofía Pérez", curso: "3° Básico", apoderado: "Ana (mamá)", direccion: "Av. Ossa 1200, La Reina", indic: "Portón verde", lat: -33.4495, lng: -70.5560, respuesta: "app" },
    { id: "matias", nombre: "Matías Soto", curso: "5° Básico", apoderado: "Luis (papá)", direccion: "Av. Tomás Moro 300, Las Condes", indic: "Depto 302, conserjería", lat: -33.4180, lng: -70.5540, respuesta: "sininternet" },
    { id: "isidora", nombre: "Isidora Rojas", curso: "1° Básico", apoderado: "Ana (mamá)", direccion: "Av. Pedro de Valdivia 900, Providencia", indic: "Casa esquina", lat: -33.4260, lng: -70.6100, respuesta: "recibido" },
    { id: "benjamin", nombre: "Benjamín Muñoz", curso: "2° Básico", apoderado: "Carla (mamá)", direccion: "Irarrázaval 3500, Ñuñoa", indic: "Reja negra", lat: -33.4560, lng: -70.5900, respuesta: "app" },
    { id: "florencia", nombre: "Florencia Díaz", curso: "4° Básico", apoderado: "Pedro (papá)", direccion: "Simón Bolívar 4200, Ñuñoa", indic: "Casa con palmera", lat: -33.4420, lng: -70.5750, respuesta: "recibido" },
  ];
  ALUMNOS.forEach((a) => { a.activo = true; a.familiaApp = true; a.mensualidad = a.id === "matias" ? 65000 : 60000; });
  const alumnosDeRuta = (r) => r.orden.map((id) => ALUMNOS.find((a) => a.id === id)).filter((a) => a && a.activo);
  // Los que sí van hoy: la ruta del día se salta a quienes tienen «hoy no va».
  const alumnosQueVan = (r) => alumnosDeRuta(r).filter((a) => !r.noViaja.includes(a.id));
  // Benjamín y Florencia se agregaron hace poco al final de las rutas: prueba «Recomendar ruta».
  const RUTAS = [
    { id: "ida", nombre: "Ida mañana", tipo: "ida", hora: "07:00", inicio: 7 * 3600, noViaja: ["matias"], porTia: [], orden: ["isidora", "matias", "sofia", "benjamin", "florencia"] },
    { id: "vuelta", nombre: "Vuelta tarde", tipo: "vuelta", hora: "16:30", inicio: 16 * 3600 + 30 * 60, noViaja: [], porTia: [], orden: ["sofia", "matias", "isidora", "benjamin", "florencia"] },
  ];
  const HISTORIAL = [
    { fecha: "Lun 6 oct", ruta: "Vuelta tarde", inicio: "16:31", fin: "17:02", km: 14.4, ejemplo: true,
      det: [["Sofía Pérez", "16:34", "16:40", "Llamada app (gratis)"], ["Matías Soto", "16:42", "16:48", "Recibido en app"], ["Isidora Rojas", "16:55", "17:01", "Teléfono (con costo)"]] },
    { fecha: "Lun 6 oct", ruta: "Ida mañana", inicio: "07:00", fin: "07:34", km: 15.1, ejemplo: true,
      det: [["Isidora Rojas", "07:01", "07:06", "Recibido en app"], ["Matías Soto", "07:10", "07:17", "Teléfono (con costo)"], ["Sofía Pérez", "07:20", "07:26", "Llamada app (gratis)"]] },
    { fecha: "Vie 3 oct", ruta: "Vuelta tarde", inicio: "16:30", fin: "16:58", km: 14.4, ejemplo: true,
      det: [["Sofía Pérez", "16:33", "16:39", "Llamada app (gratis)"], ["Matías Soto", "—", "—", "No viajó"], ["Isidora Rojas", "16:50", "16:57", "Llamada app (gratis)"]] },
  ];
  const CFG = { kmh: 30, margen: 30, parada: 60, proximidad: 300, gps: 10, acuseApp: 15 };

  // ---------- Geometría ----------
  const rad = (g) => g * Math.PI / 180;
  const dist = (a, b) => { const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2; return 12742000 * Math.asin(Math.min(1, Math.sqrt(h))); };
  const trazar = (p) => { const r = []; p.forEach((x, i) => { if (i) r.push({ lat: p[i - 1].lat, lng: x.lng }); r.push(x); }); return r; };
  const mLng = 111195 * Math.cos(rad(-33.445)), mLat = 111195;
  const lngMin = -70.6185, lngMax = -70.5480, latMin = -33.4745, latMax = -33.4130;
  const W = 360, H = 250, k = Math.min((W - 20) / ((lngMax - lngMin) * mLng), (H - 20) / ((latMax - latMin) * mLat));
  const ox = (W - (lngMax - lngMin) * mLng * k) / 2, oy = (H - (latMax - latMin) * mLat * k) / 2;
  const px = (p) => ({ x: ox + (p.lng - lngMin) * mLng * k, y: oy + (latMax - p.lat) * mLat * k });

  // ---------- Furgón escolar y pines (SVG) ----------
  // Furgón escolar chileno visto de lado: amarillo, franja negra y letrero "ESCOLAR".
  function furgonSVG(izq, ancho = 56) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${ancho}" height="${Math.round(ancho * 54 / 64)}" viewBox="0 0 64 54">
      <ellipse cx="32" cy="50" rx="24" ry="3.5" fill="#000" opacity=".18"/>
      <g ${izq ? 'transform="translate(64 0) scale(-1 1)"' : ""}>
        <path d="M7 12 H43 Q51 12 55 19 L59 26 Q60.5 28.5 60.5 31.5 V36 Q60.5 41 56 41 H8 Q3.5 41 3.5 36.5 V16.5 Q3.5 12 7 12 Z" fill="#F5B700" stroke="#2A2100" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="8" y="16.5" width="9" height="8" rx="1.6" fill="#BFE3F5" stroke="#2A2100"/>
        <rect x="20" y="16.5" width="9" height="8" rx="1.6" fill="#BFE3F5" stroke="#2A2100"/>
        <rect x="32" y="16.5" width="9" height="8" rx="1.6" fill="#BFE3F5" stroke="#2A2100"/>
        <path d="M44 16.5 H48.5 Q51.5 16.5 53.5 21 L55 24.5 H44 Z" fill="#BFE3F5" stroke="#2A2100" stroke-linejoin="round"/>
        <rect x="4" y="30" width="56" height="3.6" fill="#15202B"/>
        <rect x="56.5" y="34.5" width="3" height="2.6" rx=".8" fill="#FFF3B0"/>
        <circle cx="16" cy="41" r="6.6" fill="#15202B"/><circle cx="16" cy="41" r="2.6" fill="#C4CBD3"/>
        <circle cx="47" cy="41" r="6.6" fill="#15202B"/><circle cx="47" cy="41" r="2.6" fill="#C4CBD3"/>
      </g>
      <rect x="19" y="2" width="26" height="9" rx="2" fill="#15202B"/>
      <text x="32" y="8.8" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.2" font-weight="900" fill="#F5B700" letter-spacing=".3">ESCOLAR</text>
    </svg>`;
  }
  function pinSVG(texto, color, ancho = 30) {
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${ancho}" height="${Math.round(ancho * 40 / 30)}" viewBox="0 0 30 40">
      <path d="M15 39 C15 39 2.5 24 2.5 14.5 a12.5 12.5 0 1 1 25 0 C27.5 24 15 39 15 39 Z" fill="${color}" stroke="#fff" stroke-width="2.5"/>
      <text x="15" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="800" fill="#fff">${texto}</text>
    </svg>`;
  }
  const colorCasa = (p) => p.estado === "entregado" ? "#1D7F45" : p.estado === "pendiente" ? (p.avisoT !== null ? "#C4281C" : "#16324F") : "#8A95A1";
  const urlNavegar = (p) => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving&dir_action=navigate`;

  // ---------- Google Maps (lo conecta la empresa; sin conexión se usa el mapa dibujado) ----------
  const ESTILO_GOOGLE = [
    { featureType: "poi", stylers: [{ visibility: "off" }] },
    { featureType: "poi.school", stylers: [{ visibility: "on" }] },
    { featureType: "transit", stylers: [{ visibility: "off" }] },
    { featureType: "road", elementType: "labels.icon", stylers: [{ visibility: "off" }] },
    { featureType: "landscape", stylers: [{ color: "#F1F3F5" }] },
    { featureType: "water", stylers: [{ color: "#C9E3F2" }] },
  ];
  const GM = { estado: "sin_clave", error: null, avisoRuta: null, mapa: null, div: null, rutas: {}, claves: {}, objetos: null, rid: null, seguir: true, ultimo: 0, izq: false, prev: null };
  const ll = (p) => ({ lat: p.lat, lng: p.lng });
  function claveGoogle() {
    // La clave la configura la empresa al publicar la app (variable de entorno); aquí, por la URL.
    try { return new URLSearchParams(location.search).get("gmaps") || ""; } catch { return ""; }
  }
  function cargarGoogle() {
    const k = claveGoogle();
    if (!k) { GM.estado = "sin_clave"; return; }

  // Misma lógica que supabase/functions/_shared/core/recomendar-ruta.ts: la ida termina en el
  // colegio y la vuelta parte de él. Hasta 9 casas se prueban todas las combinaciones; con más,
  // se mejora el orden actual invirtiendo tramos (2-opt). Con Google conectado, el servidor
  // además lo afina por calles reales.
  const FACTOR_CALLES = 1.3;
  function recomendarRuta(r) {
    const casas = alumnosDeRuta(r), n = casas.length;

    const d = casas.map((a) => casas.map((b) => dist(a, b)));
    const ini = casas.map((p) => (ext.inicio ? dist(ext.inicio, p) : 0)), fin = casas.map((p) => (ext.fin ? dist(p, ext.fin) : 0));
    const costo = (o) => (o.length ? ini[o[0]] + fin[o[o.length - 1]] + o.slice(1).reduce((t, v, i) => t + d[o[i]][v], 0) : 0);
    const actual = casas.map((_, i) => i);
    let mejor = actual, mejorC = costo(actual);
    if (n >= 2 && n <= 9) {
      const camino = [], usado = Array(n).fill(false);
      const buscar = (acum) => {
        if (acum >= mejorC - 1e-6) return;
        if (camino.length === n) { const t = acum + fin[camino[n - 1]]; if (t < mejorC - 1e-6) { mejorC = t; mejor = [...camino]; } return; }
        for (let i = 0; i < n; i++) {
          if (usado[i]) continue;
          const paso = camino.length ? d[camino[camino.length - 1]][i] : ini[i];
          usado[i] = true; camino.push(i); buscar(acum + paso); camino.pop(); usado[i] = false;

      };

    if ((costo(actual) - mejorC) * FACTOR_CALLES < 50) { mejor = actual; mejorC = costo(actual); }
    return {
      orden: mejor.map((i) => casas[i].id), metros: mejorC * FACTOR_CALLES, metrosActual: costo(actual) * FACTOR_CALLES,

        return `<div class="vista">${volver}<h1>Precios</h1>${pesta}${msg}
          <div class="cifras"><div class="cifra"><b>${pesosTxt(esperado)}</b><span>Ingreso mensual esperado</span></div><div class="cifra"><b>${activos.length}</b><span>Alumnos activos</span></div></div>
          <span class="muted" style="font-size:14px">El precio mensual de cada alumno. Al guardarlo también se actualiza su cobro pendiente de ${mesTxt}.</span>
          ${activos.map((a) => `<div class="card"><div class="fila"><b>${esc(a.nombre)}</b><b class="mono">${pesosTxt(a.mensualidad)}</b></div>
            <div class="campo"><label for="adm-p_${a.id}">Precio mensual (CLP)</label>
              <div style="display:flex;gap:8px"><input id="adm-p_${a.id}" data-f="p_${a.id}" inputmode="numeric" value="${esc(f["p_" + a.id] ?? a.mensualidad)}" style="flex:1;min-width:0"><button class="btn sec" style="min-height:44px" data-a="guardarPrecio" data-id="${a.id}">Guardar</button></div></div>
          </div>`).join("")}</div>`;
      }
      return `<div class="vista">${volver}<h1>Cobros de ${mesTxt}</h1>${pesta}${msg}
        <div class="cifras"><div class="cifra"><b>${pesosTxt(total("pagado"))}</b><span>Cobrado</span></div><div class="cifra"><b>${pesosTxt(total("pendiente"))}</b><span>Por cobrar</span></div></div>
        ${lista.map((c) => `<div class="card"><div class="fila"><b>${esc(nombreDe(c.alumno))}</b><b class="mono">${pesosTxt(c.monto)}</b></div>
          ${c.estado === "pagado" ? `<span class="chip ok">✓ Pagado · ${c.medio}</span>` : ADM.editMonto === c.id ? `
            <div class="campo"><label for="adm-m_${c.id}">Monto de ${mesTxt} (CLP)</label><input id="adm-m_${c.id}" data-f="m_${c.id}" inputmode="numeric" value="${esc(f["m_" + c.id] ?? c.monto)}"></div>
            <div class="grandes" style="grid-template-columns:1fr 1fr"><button class="ok" style="min-height:52px;font-size:16px" data-a="guardarMonto" data-id="${c.id}">Guardar monto</button><button class="no" style="min-height:52px;font-size:16px" data-a="editarMonto" data-id="">Cancelar</button></div>`
          : `<span class="chip ${c.vencido ? "alerta" : "bus"}">${c.vencido ? "Vencido" : "Pendiente"}${c.nota ? ` · ${esc(c.nota)}` : ""}</span>
          <div class="grandes" style="grid-template-columns:1fr 1fr"><button class="ok" style="min-height:52px;font-size:16px" data-a="pagarAdm" data-id="${c.id}" data-m="efectivo">Pagó en efectivo</button><button class="ok" style="min-height:52px;font-size:16px;background:var(--navy);color:var(--navy-ink)" data-a="pagarAdm" data-id="${c.id}" data-m="transferencia">Transferencia</button></div>
          <button class="volver-adm" data-a="editarMonto" data-id="${c.id}">✏️ Cambiar monto de este mes</button>`}
        </div>`).join("")}</div>`;
    }
    if (ADM.vista === "solicitud") {
      const sol = ADM.solicitudes.find((x) => x.id === ADM.solSel);
      return `<div class="vista"><button class="volver-adm" data-a="adm" data-v="solicitudes">‹ Solicitudes</button><h1>${esc(sol.asunto)}</h1>
        <span class="muted">${esc(sol.autor)} · ${esc(nombreDe(sol.alumno))}</span>${msg}
        ${sol.mensajes.map((m) => `<div class="card" style="${m.yo ? "align-self:flex-end;background:var(--bus-soft)" : "align-self:flex-start"};max-width:85%;padding:10px">${esc(m.txt)}</div>`).join("")}
        ${sol.estado === "cerrada" ? `<p class="nota">Cerrada${sol.resolucion ? ` · cancelación ${sol.resolucion}` : ""}.</p>` : `
          <div class="campo"><label for="adm-resp">Respuesta</label><input id="adm-resp" data-f="resp" placeholder="Escribe tu respuesta" value="${esc(ADM.form?.resp ?? "")}"></div>
          ${sol.tipo === "cancelacion_servicio" ? `<button class="btn peligro" data-a="resolverAdm" data-v="si">Aprobar cancelación y dar de baja</button><button class="btn sec" data-a="resolverAdm" data-v="no">Rechazar</button>`
            : `<button class="btn" data-a="responderAdm">Responder</button>`}`}</div>`;
    }
    if (ADM.vista === "solicitudes") {
      const abiertas = ADM.solicitudes.filter((x) => x.estado !== "cerrada");
      return `<div class="vista">${volver}<h1>Solicitudes</h1>${msg}
        ${abiertas.length ? abiertas.map((x) => `<button class="card" style="text-align:left;cursor:pointer;${x.estado === "abierta" ? "border:2px solid var(--alert)" : ""}" data-a="verSol" data-id="${x.id}">
          <span class="muted" style="font-size:13px">${x.tipo === "cancelacion_servicio" ? "Cancelación" : "Pregunta"} · ${x.estado === "abierta" ? "Sin responder" : "Respondida"}</span>
          <b>${esc(x.asunto)}</b><span class="muted" style="font-size:13px">${esc(x.autor)} · ${esc(nombreDe(x.alumno))}</span></button>`).join("") : '<p class="nota">No hay solicitudes por atender. 🎉</p>'}</div>`;
    }
    const porCobrar = ADM.cobros.filter((c) => c.estado === "pendiente").reduce((t, c) => t + c.monto, 0);
    const sinResp = ADM.solicitudes.filter((x) => x.estado === "abierta").length;
    const sinApp = activos.filter((a) => !a.familiaApp).length;
    const opcion = (v, t, d, alerta) => `<button class="card" style="text-align:left;cursor:pointer;${alerta ? "border:2px solid var(--alert)" : ""}" data-a="adm" data-v="${v}"><h3>${t}</h3><span class="muted" style="font-size:14px">${d}</span></button>`;
    return `<div class="vista"><h1>Administrar</h1>
      <span class="muted" style="font-size:14px">Eres la dueña del furgón: tú agregas a tus alumnos, ordenas la ruta y llevas los pagos. Se bloquea mientras manejas.</span>
      ${opcion("alumnos", "👧 Mis alumnos", `${activos.length} activos${sinApp ? ` · ${sinApp} familia(s) sin la app` : ""}`, false)}
      ${opcion("rutas", "🗺️ Rutas", "Ruta recomendada, orden y «hoy no va»", false)}
      ${opcion("cobros", "💳 Cobros y precios", `${pesosTxt(porCobrar)} por cobrar en ${mesTxt}`, ADM.cobros.some((c) => c.estado === "pendiente" && c.vencido))}
      ${opcion("solicitudes", "💬 Solicitudes de las familias", sinResp ? `${sinResp} sin responder` : "Todo respondido", sinResp > 0)}
      <p class="nota">También puedes entrar al panel web de administración con esta misma cuenta.</p></div>`;
  }

  // ---------- Estado de la app ----------
  const app = { vista: "login", tab: "hoy", hoja: null, toast: null, vel: 20, senal: true, terminados: [] };
  let R = null; // recorrido activo

  function iniciarRecorrido(rutaId) {
    const ruta = RUTAS.find((r) => r.id === rutaId);
    const orden = alumnosQueVan(ruta);
    const noVan = alumnosDeRuta(ruta).filter((a) => ruta.noViaja.includes(a.id));
    // Con Google Maps conectado, el furgón recorre la ruta real por calles.
    const vigente = GM.claves[ruta.tipo] === orden.map((a) => a.id).join();
    const puntos = (vigente && GM.rutas[ruta.tipo]) || trazar(ruta.tipo === "ida" ? [BASE, ...orden, COLEGIO] : [COLEGIO, ...orden]);
    const acum = [0];
    for (let i = 1; i < puntos.length; i++) acum.push(acum[i - 1] + dist(puntos[i - 1], puntos[i]));
    // Cada casa queda en el punto de la ruta más cercano, avanzando en orden.
    let desde = 0;
    const enRuta = orden.map((a) => {
      let mejor = desde, menor = Infinity;
      for (let i = desde; i < puntos.length; i++) { const dd = dist(puntos[i], a); if (dd < menor) { menor = dd; mejor = i; } }
      desde = mejor;
      return acum[mejor];
    });
    R = {
      ruta, puntos, acum, largo: acum.at(-1), t: 0, d: 0, cola: 0, enviadas: 0, detenido: null, fin: false,
      paradas: [...orden.map((a, j) => ({ ...a, dRuta: enRuta[j], estado: "pendiente" })), ...noVan.map((a) => ({ ...a, dRuta: Infinity, estado: "no_viaja" }))]
        .map((p) => ({ ...p, eta: null, avisoT: null, confT: null, confPor: null, marcaT: null })),
      llamadas: [], ev: [], gratis: 0, pagadas: 0,
    };
    evento("▶️", `Recorrido iniciado. Compartiendo ubicación cada ${CFG.gps} s.`);
    R.paradas.filter((p) => p.estado === "no_viaja").forEach((p) => evento("📅", `${p.nombre} no va hoy (${ruta.porTia.includes(p.id) ? "lo marcaste tú" : "lo marcó su apoderado"}): la ruta se salta su casa.`));
    gps();
    app.vista = "recorrido";
  }

  const hora = (t) => { const s = Math.floor(R.ruta.inicio + t); return `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`; };
  const evento = (i, txt, tipo = "") => R.ev.unshift({ t: R.t, i, txt, tipo });

  function dSuave() {
    if (!R || R.fin || R.detenido || app.hoja || app.vista !== "recorrido") return R ? R.d : 0;
    const obj = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
    return Math.min(obj ? obj.dRuta : R.largo, R.d + (typeof acc === "number" ? acc : 0) * CFG.kmh / 3.6);
  }

  function puntoEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1;
    if (d >= R.largo) return R.puntos.at(-1);
    const f = (d - R.acum[i - 1]) / ((R.acum[i] - R.acum[i - 1]) || 1), a = R.puntos[i - 1], b = R.puntos[i];
    return { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f };
  }

  function gps() {
    if (!app.senal) { R.cola++; return; }
    if (R.cola) evento("📶", `Señal recuperada: se enviaron ${R.cola + 1} posiciones guardadas.`);
    R.enviadas += R.cola + 1; R.cola = 0;
    const pos = puntoEn(R.d), v = CFG.kmh / 3.6;
    const pend = R.paradas.filter((p) => p.estado === "pendiente");
    pend.forEach((p, i) => { p.eta = Math.max(0, (p.dRuta - R.d) / v) + i * CFG.parada; });
    for (const p of pend) {
      if (p.avisoT !== null) continue;
      if (dist(pos, p) <= CFG.proximidad || p.eta <= 5 * 60 + CFG.margen) {
        p.avisoT = R.t;
        avisar(p);
        app.toast = { txt: `🔔 Se avisó a ${p.apoderado} que llegas en ~${Math.max(1, Math.round(p.eta / 60))} min con ${p.nombre.split(" ")[0]}.`, hasta: performance.now() + 5000 };
      }
    }
  }

  function avisar(p) {
    evento("🔔", `Aviso automático a ${p.apoderado} de ${p.nombre}: alarma en su teléfono.`, "aviso");
    evento("📲", `Llamada por la app a ${p.apoderado} (por internet, sin costo).`);
    R.llamadas.push({ p, canal: "app", desde: R.t, fase: "sonando" });
    R.gratis++;
  }

  function confirmar(p, como) {
    if (p.confT !== null) return;
    p.confT = R.t; p.confPor = como;
    R.llamadas.filter((l) => l.p === p).forEach((l) => { l.fase = "fin"; });
    evento("✅", `${p.apoderado} confirmó el aviso de ${p.nombre.split(" ")[0]} (${como}).`, "ok");
  }

  // Escalera de llamadas: primero gratis por la app; si el teléfono del apoderado no
  // acusa recibo en 15 s (sin internet), llamada telefónica normal (con costo).
  function llamadas() {
    for (const l of R.llamadas) {
      if (l.fase === "fin") continue;
      const p = l.p, t = R.t - l.desde;
      if (p.estado !== "pendiente") { l.fase = "fin"; continue; }
      if (p.respuesta === "recibido" && t >= 6) { confirmar(p, "tocó Recibido en la app"); continue; }
      if (l.canal === "app") {
        if (p.respuesta === "sininternet" && t >= CFG.acuseApp) {
          evento("📵", `El teléfono de ${p.apoderado} no tiene internet: la llamada por la app no llegó. Se llama por teléfono (con costo).`);
          Object.assign(l, { canal: "telefono", desde: R.t });
          R.pagadas++;
        } else if (p.respuesta === "app" && t >= 10) {
          confirmar(p, "contestó la llamada por la app y presionó 1 · sin costo");
        }
      } else if (t >= 12) {
        confirmar(p, "contestó la llamada telefónica y presionó 1 · con costo");
      }
    }
  }

  function paso() {
    if (!R || R.fin) return;
    R.t++;
    const v = CFG.kmh / 3.6;
    if (!R.detenido) {
      const obj = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
      const tope = obj ? obj.dRuta : R.largo;
      R.d = Math.min(tope, R.d + v);
      if (obj && R.d >= obj.dRuta) { R.detenido = obj; evento("🅿️", `Llegaste donde ${obj.nombre}. Marca la ${R.ruta.tipo === "ida" ? "subida" : "entrega"}.`); }
    }
    if (R.t % CFG.gps === 0) gps();
    llamadas();
  }

  function marcar(id, estado) {
    const p = R.paradas.find((x) => x.id === id);
    if (!p || p.estado !== "pendiente") return;
    p.estado = estado; p.marcaT = R.t;
    R.llamadas.filter((l) => l.p === p).forEach((l) => { l.fase = "fin"; });
    const txt = estado === "ausente" ? `${p.nombre} marcado ausente.` : R.ruta.tipo === "ida" ? `${p.nombre} subió al furgón.` : `${p.nombre} está en su hogar.`;
    evento(estado === "ausente" ? "🚫" : "🏠", `${txt} Se avisó a ${p.apoderado}.`, "ok");
    app.toast = { txt: `✅ ${txt} Su apoderado ya recibió la confirmación.`, hasta: performance.now() + 4000 };
    if (R.detenido === p) R.detenido = null;
  }

  function finalizar() {
    R.fin = true;
    const pend = R.paradas.filter((p) => p.estado === "pendiente").length;
    evento("🏁", "Recorrido finalizado. El GPS se detuvo.");
    const det = R.paradas.map((p) => [p.nombre, p.avisoT !== null ? hora(p.avisoT) : "—", p.marcaT !== null ? hora(p.marcaT) : "—",
      p.estado === "no_viaja" ? "No viajó" : p.estado === "ausente" ? "Ausente" : !p.confPor ? (pend ? "Pendiente" : "Sin confirmar")
      : p.confPor.includes("telefónica") ? "Teléfono (con costo)" : p.confPor.includes("llamada por la app") ? "Llamada app (gratis)" : "Recibido en app"]);
    app.terminados.unshift({ fecha: "Hoy", ruta: R.ruta.nombre, inicio: hora(0), fin: hora(R.t), km: +(R.d / 1000).toFixed(1), det, ejemplo: false });
    app.hoja = null; app.vista = "resumen";
  }

  // ---------- Vistas ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const $tel = document.getElementById("tel");
  let previo = "", presionando = false;
  addEventListener("pointerdown", () => { presionando = true; }, true);
  addEventListener("pointerup", () => setTimeout(() => { presionando = false; }, 0), true);

  function barraSis() {
    const h = R && app.vista !== "hoy" ? hora(R.t) : (app.vista === "login" ? "16:25" : "16:28");
    return `<div class="estado-sis"><span>${h}</span><span>${app.senal ? "4G ▮▮▮ · 82%" : "Sin señal · 82%"}</span></div>`;
  }

  function vLogin() {
    return `<div class="vista" style="justify-content:center">
      <div style="text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; margin-bottom: 18px;">
        <svg width="84" height="56" viewBox="0 0 84 56" aria-hidden="true"><rect x="4" y="8" width="76" height="36" rx="9" fill="var(--bus)" stroke="var(--bus-ink)" stroke-width="3"/><rect x="12" y="15" width="16" height="12" rx="2" fill="var(--bus-ink)" opacity=".75"/><rect x="34" y="15" width="16" height="12" rx="2" fill="var(--bus-ink)" opacity=".75"/><rect x="56" y="15" width="16" height="12" rx="2" fill="var(--bus-ink)" opacity=".75"/><circle cx="22" cy="46" r="7" fill="var(--ink)"/><circle cx="62" cy="46" r="7" fill="var(--ink)"/></svg>
        <h1>Furgón Escolar</h1><span class="muted">Avisos automáticos de llegada</span>
      </div>
      <div class="campo"><label for="em">Correo</label><input id="em" type="email" value="${TIA.email}" autocomplete="email"></div>
      <div class="campo"><label for="pw">Contraseña</label><input id="pw" type="password" value="demo-furgon" autocomplete="current-password"></div>
      <button class="btn xl" data-a="entrar">Ingresar</button>
      <p class="nota">Cuenta de demostración. Las cuentas de conductora las crea el dueño del furgón con un código de invitación.</p>
    </div>`;
  }

  function vHoy() {
    const rutas = RUTAS.map((r) => {
      const hecha = app.terminados.find((x) => x.ruta === r.nombre);
      const n = alumnosDeRuta(r).filter((a) => !r.noViaja.includes(a.id)).length;
      return `<div class="card">
        <div class="fila"><h2>${r.tipo === "ida" ? "🌅" : "🏠"} ${r.nombre}</h2><span class="mono muted">${r.hora}</span></div>
        <span class="muted">${r.tipo === "ida" ? "Casas → colegio" : "Colegio → casas"} · ${n} alumno${n === 1 ? "" : "s"}${r.noViaja.length ? ` · ${r.noViaja.length} no va hoy` : ""}</span>
        ${hecha ? `<span class="chip ok">✓ Terminado ${hecha.inicio}–${hecha.fin}</span>` : `<button class="btn xl bus" data-a="iniciar" data-id="${r.id}">Iniciar recorrido</button>`}
      </div>`;
    }).join("");
    return `<div class="vista">
      <div><span class="muted">Martes 7 de octubre</span><h1>Hola, tía ${TIA.corto}</h1></div>
      <div class="card" style="flex-direction:row; align-items:center; gap:12px">
        <svg width="54" height="36" viewBox="0 0 84 56" aria-hidden="true"><rect x="4" y="8" width="76" height="36" rx="9" fill="var(--bus)" stroke="var(--bus-ink)" stroke-width="3"/><circle cx="22" cy="46" r="7" fill="var(--ink)"/><circle cx="62" cy="46" r="7" fill="var(--ink)"/></svg>
        <div style="min-width:0"><b>${FURGON.modelo}</b><br><span class="mono muted">${FURGON.patente} · ${FURGON.capacidad} asientos</span></div>
      </div>
      <div class="card">
        <h3>Antes de partir</h3>
        <p class="nota" style="margin:0">📡 Tu celular es el GPS del furgón: la ubicación que ven los apoderados sale de este teléfono, solo durante el recorrido.</p>
        <div class="chips"><span class="chip ok">✓ Ubicación “Siempre”</span><span class="chip ok">✓ Notificaciones</span><span class="chip ok">✓ Batería 82%</span><span class="chip ok">✓ Ahorro de batería desactivado</span></div>
      </div>
      ${rutas}
      <p class="nota">Inicia el recorrido antes de salir. La app avisa sola a cada apoderado unos 5 minutos antes de llegar. No necesitas llamar a nadie mientras manejas.</p>
    </div>`;
  }

  // Fondo de mapa dibujado: manzanas, calles, avenidas, un parque y el río Mapocho.
  const FONDO_MAPA = (() => {
    let f = `<rect width="${W}" height="${H}" fill="var(--mapa-fondo)"/>`;
    for (let x = 6; x < W; x += 30) for (let y = 6; y < H; y += 26) f += `<rect x="${x}" y="${y}" width="24" height="20" rx="3" fill="var(--mapa-manzana)"/>`;
    f += `<rect x="186" y="58" width="54" height="46" rx="8" fill="var(--mapa-parque)"/>`;
    f += `<path d="M-10 40 C 60 18, 120 52, 190 30 S 300 6, 380 22" fill="none" stroke="var(--mapa-agua)" stroke-width="9" stroke-linecap="round"/>`;
    for (let x = 3; x < W; x += 30) f += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--mapa-calle)" stroke-width="${x % 90 === 3 ? 5 : 3}"/>`;
    for (let y = 3; y < H; y += 26) f += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--mapa-calle)" stroke-width="${y % 78 === 3 ? 5 : 3}"/>`;
    f += `<line x1="0" y1="185" x2="${W}" y2="160" stroke="var(--mapa-avenida)" stroke-width="7"/>`;
    return f;
  })();

  function mapa() {
    if (GM.estado === "listo") {
      return `<div class="mapa"><div id="gmap-host" class="gmap-host"></div><span class="sello"><span class="g">G</span> Google Maps · tráfico en vivo</span></div>
        ${GM.avisoRuta ? `<div class="nota-mapa">${esc(GM.avisoRuta)}</div>` : ""}`;
    }
    const d = dSuave();
    const pts = R.puntos.map(px), van = px(puntoEn(d));
    const i0 = R.acum.findIndex((a) => a >= d);
    const hecho = pts.slice(0, i0 === -1 ? pts.length : i0).concat([van]);
    const linea = (arr) => arr.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
    const sig = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
    const izq = sig ? px(sig).x < van.x - 1 : false;
    const casas = R.paradas.map((p, j) => {
      if (p.estado === "no_viaja") return "";
      const c = px(p);
      return `<circle cx="${c.x}" cy="${c.y}" r="${CFG.proximidad * k}" fill="var(--bus)" fill-opacity=".14"/>
        <svg x="${c.x - 12}" y="${c.y - 32}" width="24" height="32" viewBox="0 0 30 40">${pinSVG(p.estado === "entregado" ? "✓" : j + 1, colorCasa(p)).replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg>`;
    }).join("");
    const col = px(COLEGIO);
    return `<div class="mapa"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa del recorrido">
      ${FONDO_MAPA}
      <polyline points="${linea(pts)}" fill="none" stroke="var(--surface)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${linea(pts)}" fill="none" stroke="var(--muted)" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="${linea(hecho)}" fill="none" stroke="var(--navy)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <svg x="${col.x - 13}" y="${col.y - 34}" width="26" height="34" viewBox="0 0 30 40">${pinSVG("🏫", "#15202B").replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg>
      ${casas}
      <circle class="halo" cx="${van.x}" cy="${van.y - 8}" r="22" fill="var(--bus)"/>
      <svg x="${van.x - 32}" y="${van.y - 47}" width="64" height="54" viewBox="0 0 64 54">${furgonSVG(izq).replace(/^<svg[^>]*>|<\/svg>$/g, "")}</svg>
    </svg>
    <span class="sello">Mapa del recorrido</span></div>
    ${GM.estado === "error" ? `<div class="nota-mapa">${esc(GM.error)}</div>` : GM.estado === "cargando" ? `<div class="nota-mapa">Conectando con Google Maps…</div>` : ""}`;
  }

  function vRecorrido() {
    const pend = R.paradas.filter((p) => p.estado === "pendiente");
    const hechas = R.paradas.filter((p) => p.estado !== "pendiente");
    const ok = R.ruta.tipo === "ida" ? "Subió ✅" : "En su hogar ✅";
    const estadoAviso = (p) => p.confT !== null ? `<span class="chip ok">✓ ${esc(p.apoderado)} confirmó</span>`
      : p.avisoT !== null ? `<span class="chip alerta">🔔 Avisado ${hora(p.avisoT)} · esperando confirmación</span>`
      : `<span class="chip">Se avisará ~5 min antes</span>`;
    return `<div class="vista">
      <div class="fila"><h1>${R.ruta.nombre}</h1><span class="mono muted">${hora(R.t)}</span></div>
      <div class="chips">
        ${app.senal ? `<span class="chip ok"><span class="dot"></span>Compartiendo ubicación</span>` : `<span class="chip alerta"><span class="dot"></span>Sin señal · ${R.cola} posiciones guardadas</span>`}
        <span class="chip">${(R.d / 1000).toFixed(1)} de ${(R.largo / 1000).toFixed(1)} km</span>
      </div>
      ${R.detenido ? "" : `<div class="manejo"><span>🚐</span><div><b>Conduce tranquila</b>Los avisos a los apoderados se envían solos. Marca a cada alumno cuando estés detenida.</div></div>`}
      ${mapa()}
      ${pend.map((p, i) => {
        const aqui = R.detenido === p;
        return `<div class="parada ${i === 0 ? "actual" : ""}">
          <span class="num">Parada ${R.paradas.indexOf(p) + 1}${aqui ? " · estás aquí" : p.eta != null ? ` · llegada en ~${Math.max(1, Math.round(p.eta / 60))} min` : ""}</span>
          <span class="nom">${esc(p.nombre)}</span>
          <span class="muted">${esc(p.direccion)} · ${esc(p.indic)}</span>
          <div class="chips">${estadoAviso(p)}</div>
          ${i === 0 && !aqui ? `<a class="btn-nav" href="${urlNavegar(p)}" target="_blank" rel="noopener">🧭 Navegar con <b>Google Maps</b></a>` : ""}
          ${aqui || i === 0 ? `<div class="grandes"><button class="ok" data-a="marcar" data-id="${p.id}" data-e="entregado">${ok}</button><button class="no" data-a="marcar" data-id="${p.id}" data-e="ausente">Ausente</button></div>` : ""}
        </div>`;
      }).join("")}
      ${pend.length === 0 ? `<div class="card"><h3>¡Listo! No quedan alumnos.</h3><span class="muted">Finaliza el recorrido para dejar de compartir tu ubicación.</span></div>` : ""}
      ${hechas.map((p) => `<div class="parada hecha"><span>${R.paradas.indexOf(p) + 1}. ${esc(p.nombre)} · ${{ entregado: ok + " " + (p.marcaT !== null ? hora(p.marcaT) : ""), ausente: "Ausente", no_viaja: "Hoy no viaja" }[p.estado]}</span></div>`).join("")}
      <div class="card"><h3>Avisos automáticos</h3>
        <ul class="lista-ev">${R.ev.slice(0, 8).map((e) => `<li><span class="h">${hora(e.t)}</span><span>${e.i}</span><span>${esc(e.txt)}</span></li>`).join("")}</ul></div>
      <button class="btn sec" data-a="pedirFin">Finalizar recorrido</button>
      <div class="demo" aria-label="Controles de la demostración"><b>Demo</b>
        <span class="seg">${[5, 20, 40].map((v) => `<button data-a="vel" data-v="${v}" aria-pressed="${app.vel === v}">×${v}</button>`).join("")}</span>
        <label class="chk"><input type="checkbox" id="chkSenal" ${app.senal ? "" : "checked"}> Sin señal</label>
      </div>
    </div>`;
  }

  function vResumen() {
    const r = app.terminados[0];
    const entregados = R.paradas.filter((p) => p.estado === "entregado").length;
    const avisos = R.paradas.filter((p) => p.avisoT !== null).length;
    const conf = R.paradas.filter((p) => p.confT !== null).length;
    const dur = Math.round(R.t / 60);
    return `<div class="vista">
      <span class="chip ok" style="align-self:flex-start">✓ GPS detenido</span>
      <h1>Recorrido terminado</h1>
      <span class="muted">${r.ruta} · ${r.inicio} a ${r.fin}</span>
      <div class="cifras">
        <div class="cifra"><b>${dur} min</b><span>Duración</span></div>
        <div class="cifra"><b>${r.km} km</b><span>Recorridos</span></div>
        <div class="cifra"><b>${entregados}/${R.paradas.length}</b><span>${R.ruta.tipo === "ida" ? "Subieron" : "En su hogar"}</span></div>
        <div class="cifra"><b>${conf}/${avisos}</b><span>Avisos confirmados</span></div>
        <div class="cifra"><b>${R.gratis}</b><span>Llamadas por la app (sin costo)</span></div>
        <div class="cifra"><b>${R.pagadas}</b><span>Llamadas telefónicas (con costo)</span></div>
      </div>
      <div class="card"><h3>Detalle</h3>${tablaDet(r.det)}</div>
      <p class="nota">Llamadas que hiciste mientras manejabas: <b>0</b>. Todos los avisos se enviaron solos. Solo se pagó una llamada telefónica cuando el apoderado no tenía internet.</p>
      <button class="btn xl" data-a="volver">Volver al inicio</button>
    </div>`;
  }

  const tablaDet = (det) => `<table class="det"><thead><tr><th>Alumno</th><th>Aviso</th><th>${"En su hogar"}</th><th>Confirmó</th></tr></thead><tbody>
    ${det.map((d) => `<tr><td>${esc(d[0])}</td><td class="mono">${d[1]}</td><td class="mono">${d[2]}</td><td>${esc(d[3])}</td></tr>`).join("")}</tbody></table>`;

  function vHistorial() {
    const todos = [...app.terminados, ...HISTORIAL];
    return `<div class="vista">
      <h1>Historial</h1>
      <span class="muted">Hora de cada aviso y de cada llegada al hogar. Toca un recorrido para ver el detalle.</span>
      ${todos.map((h, i) => `<details class="hist" ${i === 0 ? "open" : ""}>
        <summary><div class="fila"><b>${h.fecha} · ${esc(h.ruta)}</b>${h.ejemplo ? `<span class="ejemplo">Ejemplo</span>` : `<span class="chip ok">Hoy</span>`}</div>
        <span class="muted mono" style="font-size:13px">${h.inicio}–${h.fin} · ${h.km} km</span></summary>
        ${tablaDet(h.det)}
      </details>`).join("")}
    </div>`;
  }

  function vPerfil() {
    return `<div class="vista">
      <div style="display:flex; gap:14px; align-items:center">
        <div class="avatar">MF</div>
        <div style="min-width:0"><h1>Tía ${TIA.corto}</h1><span class="muted">${TIA.nombre} · Conductora</span></div>
      </div>
      <div class="card"><h3>Mis datos</h3>
        <div class="dato"><span>Teléfono</span><span class="mono">${TIA.tel}</span></div>
        <div class="dato"><span>Correo</span><span>${TIA.email}</span></div>
        <div class="dato"><span>Licencia</span><span>${TIA.licencia}</span></div>
        <div class="dato"><span>Empresa</span><span>${FURGON.empresa}</span></div>
      </div>
      <div class="card"><h3>Furgón asignado</h3>
        <div class="dato"><span>Patente</span><span class="mono">${FURGON.patente}</span></div>
        <div class="dato"><span>Vehículo</span><span>${FURGON.modelo}</span></div>
        <div class="dato"><span>Rutas</span><span>Ida 07:00 · Vuelta 16:30</span></div>
        <div class="dato"><span>Alumnos</span><span>${ALUMNOS.filter((a) => a.activo).length}</span></div>
      </div>
      <div class="card"><h3>Permisos del teléfono</h3>
        <div class="dato"><span>Ubicación</span><span style="color:var(--ok)">Siempre ✓</span></div>
        <div class="dato"><span>Notificaciones</span><span style="color:var(--ok)">Activadas ✓</span></div>
        <div class="dato"><span>Ahorro de batería</span><span style="color:var(--ok)">Excluida ✓</span></div>
      </div>
      <p class="nota">🔒 Tu ubicación solo se comparte mientras hay un recorrido activo. Al finalizar, el GPS se apaga. Los teléfonos de los apoderados no se muestran: la app los llama por ti.</p>
      <button class="btn sec" data-a="salir">Cerrar sesión</button>
    </div>`;
  }

  function tabs() {
    const t = [["hoy", "🚐", "Hoy"], ["admin", "🧑‍💼", "Administrar"], ["historial", "🕘", "Historial"], ["perfil", "👤", "Perfil"]];
    return `<nav class="tabs" aria-label="Secciones">${t.map(([id, ic, n]) => `<button data-a="tab" data-id="${id}" aria-current="${app.tab === id ? "page" : "false"}"><span>${ic}</span>${n}</button>`).join("")}</nav>`;
  }

  function render(forzar = false) {
    const html = construirHtml();
    if (html !== previo && (forzar || !presionando)) {
      const scroll = $tel.querySelector(".vista")?.scrollTop ?? 0;
      previo = html; $tel.innerHTML = html;
      const v = $tel.querySelector(".vista"); if (v) v.scrollTop = scroll;
    }
    montarGoogle();
  }

  function construirHtml() {
    let cuerpo;
    if (app.vista === "login") cuerpo = vLogin();
    else if (app.vista === "recorrido") cuerpo = vRecorrido();
    else if (app.vista === "resumen") cuerpo = vResumen();
    else cuerpo = { hoy: vHoy, admin: vAdmin, historial: vHistorial, perfil: vPerfil }[app.tab]();
    const conTabs = app.vista === "hoy";
    const toast = app.toast && app.toast.hasta > performance.now() ? `<div class="toast" role="status">${esc(app.toast.txt)}</div>` : "";
    const hoja = app.hoja === "fin" ? `<div class="hoja-fondo" data-a="cerrarHoja"><div class="hoja" role="dialog" aria-label="Finalizar recorrido">
        <h2>¿Finalizar recorrido?</h2>
        <span class="muted">${R.paradas.filter((p) => p.estado === "pendiente").length ? `Quedan ${R.paradas.filter((p) => p.estado === "pendiente").length} alumno(s) sin marcar.` : "Todos los alumnos están marcados."} Se dejará de compartir tu ubicación.</span>
        <button class="btn peligro xl" data-a="finalizar">Finalizar</button><button class="btn sec" data-a="cerrarHoja">Seguir en el recorrido</button>
      </div></div>` : "";
    return barraSis() + cuerpo + (conTabs ? tabs() : "") + toast + hoja;
  }

  // ---------- Eventos ----------
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el) return;
    const a = el.dataset.a;
    if (a === "cerrarHoja" && el !== e.target && el.classList.contains("hoja-fondo")) return;
    if (a === "entrar") { app.vista = "hoy"; app.tab = "hoy"; }
    else if (a === "tab") { app.tab = el.dataset.id; if (el.dataset.id === "admin") { ADM.vista = "menu"; ADM.msg = null; } }
    else if (a === "adm") { ADM.vista = el.dataset.v; ADM.msg = null; ADM.form = null; ADM.agregarEn = null; ADM.rec = null; ADM.editMonto = null; }
    else if (a === "recomendar") { const r = RUTAS.find((x) => x.id === el.dataset.id); ADM.rec = { ruta: r.id, ...recomendarRuta(r) }; ADM.msg = null; }
    else if (a === "descartarRec") ADM.rec = null;
    else if (a === "aplicarRec") {
      const r = RUTAS.find((x) => x.id === ADM.rec.ruta);
      r.orden = [...ADM.rec.orden, ...r.orden.filter((x) => !ADM.rec.orden.includes(x))];
      ADM.msg = { ok: true, txt: `Listo: ${r.nombre} quedó con la ruta recomendada (${kmTxt(ADM.rec.metros)}). El próximo recorrido la usa.` };
      ADM.rec = null;
    }
    else if (a === "noVaAdm") {
      const r = RUTAS.find((x) => x.id === el.dataset.id), id = el.dataset.al, nom = nombreDe(id).split(" ")[0];
      if (r.noViaja.includes(id)) { r.noViaja = r.noViaja.filter((x) => x !== id); r.porTia = r.porTia.filter((x) => x !== id); ADM.msg = { ok: true, txt: `${nom} sí va hoy en ${r.nombre}.` }; }
      else { r.noViaja.push(id); r.porTia.push(id); ADM.msg = { ok: true, txt: `${nom} no va hoy en ${r.nombre}: la ruta de hoy se salta su casa y su familia no recibe aviso.` }; }
      app.toast = { txt: `📅 ${ADM.msg.txt}`, hasta: performance.now() + 3500 };
      ADM.rec = null;
    }
    else if (a === "subCobros") { ADM.subCobros = el.dataset.v; ADM.msg = null; ADM.form = null; ADM.editMonto = null; }
    else if (a === "editarMonto") { ADM.editMonto = el.dataset.id || null; ADM.msg = null; }
    else if (a === "guardarMonto" || a === "guardarPrecio") {
      const id = el.dataset.id, campo = (a === "guardarMonto" ? "m_" : "p_") + id;
      const txt = String(ADM.form?.[campo] ?? "").replace(/\D/g, "");
      if (ADM.form?.[campo] === undefined) ADM.msg = { ok: true, txt: "Sin cambios." };
      else if (!txt) ADM.msg = { ok: false, txt: "Escribe un monto (solo números)." };
      else if (a === "guardarMonto") {
        const c = ADM.cobros.find((x) => x.id === id); c.monto = Number(txt); ADM.editMonto = null;
        ADM.msg = { ok: true, txt: `Cobro de ${nombreDe(c.alumno)} en ${mesTxt}: ${pesosTxt(c.monto)}.` };
      } else {
        const al = ALUMNOS.find((x) => x.id === id); al.mensualidad = Number(txt);
        ADM.cobros.filter((c) => c.alumno === id && c.estado === "pendiente").forEach((c) => { c.monto = al.mensualidad; });
        ADM.msg = { ok: true, txt: `Precio de ${al.nombre}: ${pesosTxt(al.mensualidad)} al mes.` };
      }
      if (ADM.form) delete ADM.form[campo];
      if (ADM.msg.ok) app.toast = { txt: `✅ ${ADM.msg.txt}`, hasta: performance.now() + 3500 };
    }
    else if (a === "codigoFam") { const al = ALUMNOS.find((x) => x.id === el.dataset.id); al.codigo ??= nuevoCodigo(); ADM.codigo = { nombre: al.nombre, codigo: al.codigo }; ADM.vista = "codigo"; }
    else if (a === "pinAdm") {
      const r = el.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * W, y = ((e.clientY - r.top) / r.height) * H;
      ADM.form.pin = { lat: latMax - (y - oy) / (mLat * k), lng: lngMin + (x - ox) / (mLng * k) };
    }
    else if (a === "rutaAdm") { const f = ADM.form; f.rutas = f.rutas.includes(el.dataset.id) ? f.rutas.filter((x) => x !== el.dataset.id) : [...f.rutas, el.dataset.id]; }
    else if (a === "guardarAlumno") {
      const f = ADM.form, tel = f.tel.replace(/\D/g, "");
      if (!f.nombre.trim() || !f.direccion.trim()) ADM.msg = { ok: false, txt: "Falta el nombre o la dirección." };
      else if (!f.pin) ADM.msg = { ok: false, txt: "Toca el mapa para ubicar la casa: así el aviso llega a tiempo." };
      else if (tel.length < 8) ADM.msg = { ok: false, txt: "Revisa el teléfono (ej: 9 1234 5678)." };
      else if (!/^\d+$/.test(String(f.precio).replace(/\D/g, "") || "x")) ADM.msg = { ok: false, txt: "Escribe el precio mensual (solo números)." };
      else {
        const precioNuevo = Number(String(f.precio).replace(/\D/g, ""));
        const id = "a" + Date.now();
        ALUMNOS.push({ id, nombre: f.nombre.trim(), curso: f.curso.trim(), apoderado: "Apoderado/a", direccion: f.direccion.trim(), indic: "—",
          lat: f.pin.lat, lng: f.pin.lng, respuesta: "app", activo: true, familiaApp: false, mensualidad: precioNuevo, codigo: nuevoCodigo() });
        f.rutas.forEach((rid) => RUTAS.find((r) => r.id === rid).orden.push(id));
        ADM.cobros.push({ id: "k" + Date.now(), alumno: id, monto: precioNuevo, estado: "pendiente" });
        ADM.codigo = { nombre: f.nombre.trim(), codigo: ALUMNOS.at(-1).codigo, nuevo: true };
        ADM.vista = "codigo"; ADM.form = null; ADM.msg = null;
      }
    }
    else if (a === "moverAdm") {
      ADM.rec = null;
      const r = RUTAS.find((x) => x.id === el.dataset.id), vis = alumnosDeRuta(r).map((x) => x.id);
      const i = vis.indexOf(el.dataset.al), j = i + Number(el.dataset.d);
      if (j >= 0 && j < vis.length) { [vis[i], vis[j]] = [vis[j], vis[i]]; r.orden = [...vis, ...r.orden.filter((x) => !vis.includes(x))]; ADM.msg = { ok: true, txt: "Orden actualizado: el próximo recorrido lo usará." }; }
    }
    else if (a === "quitarAdm") { ADM.rec = null; const r = RUTAS.find((x) => x.id === el.dataset.id); r.orden = r.orden.filter((x) => x !== el.dataset.al); ADM.msg = { ok: true, txt: `${nombreDe(el.dataset.al)} salió de ${r.nombre}.` }; }
    else if (a === "abrirAgregar") ADM.agregarEn = el.dataset.id;
    else if (a === "agregarAdm") { ADM.rec = null; const r = RUTAS.find((x) => x.id === el.dataset.id); r.orden.push(el.dataset.al); ADM.agregarEn = null; ADM.msg = { ok: true, txt: `${nombreDe(el.dataset.al)} quedó al final de ${r.nombre}.` }; }
    else if (a === "pagarAdm") { const c = ADM.cobros.find((x) => x.id === el.dataset.id); Object.assign(c, { estado: "pagado", medio: el.dataset.m, vencido: false }); ADM.msg = { ok: true, txt: `Pago de ${nombreDe(c.alumno)} registrado.` }; }
    else if (a === "verSol") { ADM.solSel = el.dataset.id; ADM.vista = "solicitud"; ADM.form = { resp: "" }; ADM.msg = null; }
    else if (a === "responderAdm" || a === "resolverAdm") {
      const sol = ADM.solicitudes.find((x) => x.id === ADM.solSel), txt = (ADM.form?.resp ?? "").trim();
      if (txt) sol.mensajes.push({ yo: true, txt });
      if (a === "responderAdm") {
        if (!txt) ADM.msg = { ok: false, txt: "Escribe tu respuesta." }; else { sol.estado = "respondida"; ADM.msg = { ok: true, txt: "Respuesta enviada a la familia." }; }
      } else if (el.dataset.v === "si") {
        const al = ALUMNOS.find((x) => x.id === sol.alumno); al.activo = false;
        RUTAS.forEach((r) => { r.orden = r.orden.filter((x) => x !== al.id); });
        ADM.cobros.filter((c) => c.alumno === al.id && c.estado === "pendiente").forEach((c) => { c.estado = "anulado"; });
        Object.assign(sol, { estado: "cerrada", resolucion: "aprobada" });
        ADM.msg = { ok: true, txt: `${al.nombre} quedó dado de baja: salió de tus rutas y no se le cobrará más.` };
      } else { Object.assign(sol, { estado: "cerrada", resolucion: "rechazada" }); ADM.msg = { ok: true, txt: "Solicitud rechazada." }; }
      ADM.form = { resp: "" };
    }
    else if (a === "iniciar") iniciarRecorrido(el.dataset.id);
    else if (a === "marcar") marcar(el.dataset.id, el.dataset.e);
    else if (a === "pedirFin") app.hoja = "fin";
    else if (a === "cerrarHoja") app.hoja = null;
    else if (a === "finalizar") finalizar();
    else if (a === "volver") { app.vista = "hoy"; app.tab = "historial"; R = null; }
    else if (a === "vel") app.vel = Number(el.dataset.v);
    else if (a === "salir") { app.vista = "login"; }
    // Si cambió el orden o quién va hoy, Google vuelve a trazar las rutas por calles.
    if (/^(moverAdm|quitarAdm|agregarAdm|guardarAlumno|resolverAdm|aplicarRec|noVaAdm)$/.test(a) && GM.estado === "listo") prepararRutasGoogle();
    previo = ""; render(true);
  });
  document.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.f;
    if (k && ADM.form) { ADM.form[k] = e.target.value; previo = construirHtml(); }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "chkSenal") {
      app.senal = !e.target.checked;
      if (R) evento(app.senal ? "📶" : "📵", app.senal ? "Señal de vuelta." : "Sin señal: las posiciones se guardan en el teléfono.");
      previo = ""; render(true);
    }
  });

  let ult = performance.now(), acc = 0;
  function bucle(ahora) {
    const dt = Math.min(0.25, (ahora - ult) / 1000); ult = ahora;
    if (app.vista === "recorrido" && R && !R.fin && !app.hoja) { acc += dt * app.vel; while (acc >= 1) { paso(); acc--; } }
    render();
    actualizarGoogle();
    requestAnimationFrame(bucle);
  }
  cargarGoogle();
  render(); requestAnimationFrame(bucle);
})();
