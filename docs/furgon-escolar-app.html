  function dibujarMapa() {
    const svg = $tel.querySelector(&quot;#mv&quot;);
    if (!svg || !R) return;
    const h = HIJOS.find((x) => x.id === app.hijoId), p = h &amp;&amp; parDe(h);
    if (!p) return;
    const W = svg.clientWidth || 390, H = svg.clientHeight || 700;
    const hoja = $tel.querySelector(&quot;.hoja-seg&quot;), altoHoja = hoja ? hoja.offsetHeight : 300;
    const arriba = 64, abajo = H - altoHoja - 16;
    svg.setAttribute(&quot;viewBox&quot;, `0 0 ${W} ${H}`);

    const d = !app.internet &amp;&amp; R.dCongelado != null ? R.dCongelado : dSuave(), van = puntoEn(d);
    const exacta = p.estado === &quot;pendiente&quot; &amp;&amp; (p.avisoT !== null || p.aBordoT != null) &amp;&amp; !cercaDeOtraCasa(R.d);
    const casa = aMundo(p);
    const foco = p.estado === &quot;pendiente&quot; ? (exacta ? aMundo(van) : aMundo(zonaDe(van))) : casa;
    const margen = p.estado !== &quot;pendiente&quot; ? 400 : exacta ? 180 : 1050;
    const minX = Math.min(casa.x, foco.x) - margen, maxX = Math.max(casa.x, foco.x) + margen;
    const minY = Math.min(casa.y, foco.y) - margen, maxY = Math.max(casa.y, foco.y) + margen;
    const objS = Math.max(2.2, (maxX - minX) / (W - 40), (maxY - minY) / Math.max(120, abajo - arriba));
    const obj = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: objS };
    if (cam.s === null) Object.assign(cam, obj);
    else { cam.x += (obj.x - cam.x) * 0.08; cam.y += (obj.y - cam.y) * 0.08; cam.s += (obj.s - cam.s) * 0.08; }
    const cyPantalla = (arriba + abajo) / 2;
    const P = (w) => ({ x: W / 2 + (w.x - cam.x) / cam.s, y: cyPantalla + (w.y - cam.y) / cam.s });
    const PG = (g) => P(aMundo(g));

    // Calles genéricas del barrio (no revelan el recorrido).
    const paso = cam.s > 7 ? 440 : 220, x0 = cam.x - (W / 2) * cam.s, x1 = cam.x + (W / 2) * cam.s;
    const y0 = cam.y - cyPantalla * cam.s, y1 = cam.y + (H - cyPantalla) * cam.s;
    let calles = &quot;&quot;;
    for (let x = Math.floor(x0 / paso) * paso; x <= x1; x += paso) { const sx = P({ x, y: 0 }).x; calles += `<line x1=&quot;${sx}&quot; y1=&quot;0&quot; x2=&quot;${sx}&quot; y2=&quot;${H}&quot; stroke-width=&quot;${x % 1320 === 0 ? 9 : 5}&quot;/>`; }
    for (let y = Math.floor(y0 / paso) * paso; y <= y1; y += paso) { const sy = P({ x: 0, y }).y; calles += `<line x1=&quot;0&quot; y1=&quot;${sy}&quot; x2=&quot;${W}&quot; y2=&quot;${sy}&quot; stroke-width=&quot;${y % 1320 === 0 ? 9 : 5}&quot;/>`; }

    let capa = &quot;&quot;;
    if (exacta) {
      const hecho = tramo(Math.min(p.dBordo ?? Infinity, p.dAviso ?? Infinity, d), d).map(PG), falta = tramo(d, p.dRuta).map(PG);
      const linea = (pts) => pts.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(&quot; &quot;);
      capa += `<polyline points=&quot;${linea(hecho)}&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;5&quot; stroke-dasharray=&quot;2 8&quot; stroke-linecap=&quot;round&quot;/>`;
      capa += `<polyline points=&quot;${linea(falta)}&quot; fill=&quot;none&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;11&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`;
      capa += `<polyline points=&quot;${linea(falta)}&quot; fill=&quot;none&quot; stroke=&quot;var(--navy)&quot; stroke-width=&quot;6&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`;
    }
    const c = P(casa);
    capa += `<g transform=&quot;translate(${c.x} ${c.y})&quot;><path d=&quot;M0 0 C -14 -18 -17 -25 -17 -32 A 17 17 0 1 1 17 -32 C 17 -25 14 -18 0 0 Z&quot; fill=&quot;var(--navy)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;3&quot;/>
      <path d=&quot;M-8 -30 L0 -38 L8 -30 L8 -23 L-8 -23 Z&quot; fill=&quot;var(--surface)&quot;/>
      <rect x=&quot;-24&quot; y=&quot;6&quot; width=&quot;48&quot; height=&quot;20&quot; rx=&quot;10&quot; fill=&quot;var(--surface)&quot;/><text x=&quot;0&quot; y=&quot;20&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot; font-family=&quot;var(--font-body)&quot;>${tr(&quot;Casa&quot;)}</text></g>`;
    if (p.estado === &quot;pendiente&quot;) {
      if (exacta) {
        const v = PG(van), r = rumboEn(d);
        capa += `<g transform=&quot;translate(${v.x} ${v.y}) rotate(${r})&quot;>
          <circle r=&quot;26&quot; fill=&quot;var(--bus)&quot; opacity=&quot;.18&quot;/>
          <rect x=&quot;-10&quot; y=&quot;-17&quot; width=&quot;20&quot; height=&quot;34&quot; rx=&quot;6&quot; fill=&quot;var(--bus)&quot; stroke=&quot;var(--bus-ink)&quot; stroke-width=&quot;2&quot;/>
          <rect x=&quot;-7&quot; y=&quot;-13&quot; width=&quot;14&quot; height=&quot;7&quot; rx=&quot;2&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.75&quot;/>
          <rect x=&quot;-7&quot; y=&quot;6&quot; width=&quot;14&quot; height=&quot;5&quot; rx=&quot;2&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.45&quot;/></g>`;
      } else {
        const z = PG(zonaDe(van)), rz = 1000 / cam.s, ancho = 44 + tr(&quot;por aquí&quot;).length * 7.4;
        capa += `<circle class=&quot;zona&quot; cx=&quot;${z.x}&quot; cy=&quot;${z.y}&quot; r=&quot;${rz}&quot; fill=&quot;var(--bus)&quot; fill-opacity=&quot;.22&quot; stroke=&quot;var(--bus)&quot; stroke-width=&quot;2.5&quot;/>
          <rect x=&quot;${z.x - ancho / 2}&quot; y=&quot;${z.y - 13}&quot; width=&quot;${ancho}&quot; height=&quot;26&quot; rx=&quot;13&quot; fill=&quot;var(--surface)&quot;/>
          <g style=&quot;color:var(--ink)&quot;>${icoPlano(&quot;furgon&quot;, &quot;currentColor&quot;, &quot;#F5B700&quot;, 18, z.x - ancho / 2 + 8, z.y - 9)}</g>
          <text x=&quot;${z.x + 10}&quot; y=&quot;${z.y + 5}&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;700&quot; fill=&quot;var(--ink)&quot; font-family=&quot;var(--font-body)&quot;>${tr(&quot;por aquí&quot;)}</text>`;
      }

    svg.innerHTML = `<rect width=&quot;${W}&quot; height=&quot;${H}&quot; fill=&quot;var(--block)&quot;/><g stroke=&quot;var(--road)&quot;>${calles}</g>${capa}`;
  }

  function construir() {

<script>
  // Cada parte se carga recién la primera vez que se abre (así la demostración de una no corre por detrás).
  const marcos = [...document.querySelectorAll("iframe")];
  const abrir = (id) => {
    for (const m of marcos) {
      const activo = m.id === "m-" + id;
      m.hidden = !activo;
      if (activo && !m.srcdoc) m.srcdoc = m.dataset.src;
    }
    document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.id === id)));
    try { localStorage.setItem("furgon-parte", id); } catch {}
  };
  document.querySelector("nav").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) abrir(b.dataset.id); });
  let inicial = "tia";
  try { inicial = localStorage.getItem("furgon-parte") || "tia"; } catch {}
  abrir(marcos.some((m) => m.id === "m-" + inicial) ? inicial : "tia");
</script>
