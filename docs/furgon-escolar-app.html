<style>
/* App de la conductora (&quot;tía del furgón&quot;): una sola columna móvil, barra de pestañas inferior, botones grandes para usar detenida. */
:root {
  --bg: #F3F4F6; --app: #FFFFFF; --surface: #FFFFFF; --surface-2: #F3F4F6;
  --ink: #14181F; --muted: #5F6672; --line: #E3E5E8; --road: #D6D9DE;
  --bus: #F5B700; --bus-ink: #1F1A00; --bus-soft: #FFF7DB;
  --navy: #1E3A5F; --navy-ink: #FFFFFF;
  --ok: #1E8E3E; --ok-soft: #E6F4EA; --alert: #D93025; --alert-soft: #FCE8E6;
  --mapa-fondo: #EEF0F2; --mapa-manzana: #F8F9FA; --mapa-calle: #FFFFFF; --mapa-avenida: #E4E6EA; --mapa-parque: #DCEBD6; --mapa-agua: #C9E3F2;
  --font-display: &quot;Barlow Condensed&quot;, &quot;Arial Narrow&quot;, system-ui, sans-serif;
  --font-body: &quot;Atkinson Hyperlegible&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif;
  --font-mono: &quot;JetBrains Mono&quot;, ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
    --line: #2B3743; --road: #3A4754; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
    --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
    --mapa-fondo: #1A232C; --mapa-manzana: #212C36; --mapa-calle: #2D3A46; --mapa-avenida: #4A4220; --mapa-parque: #1F3324; --mapa-agua: #1C3446;
    color-scheme: dark;
  }
}
:root[data-theme=&quot;dark&quot;] {
  --bg: #07090C; --app: #0E1116; --surface: #161A21; --surface-2: #1E232B; --ink: #F3F4F6; --muted: #9AA3AE;
  --line: #2A313B; --road: #3A414C; --bus: #F7C21A; --bus-ink: #1A1500; --bus-soft: #2E2810;
  --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
  --mapa-fondo: #151A21; --mapa-manzana: #1C222A; --mapa-calle: #2A313B; --mapa-avenida: #343B45; --mapa-parque: #1D2B22; --mapa-agua: #13293A;
    color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.telefono { width: min(410px, 100%); height: min(860px, calc(100vh - 60px)); min-height: 620px; background: var(--app); border: 10px solid var(--ink); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 520px) {
  body { padding: 0; gap: 0; }
  .rotulo { display: none; }
  .telefono { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; }
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.estado-sis { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.vista { flex: 1; overflow-y: auto; padding: 6px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; padding: 9px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.tabs button span { font-size: 20px; line-height: 1; }
.tabs button[aria-current=&quot;page&quot;] { color: var(--ink); }
/* Íconos de la barra inferior: solo en grises (sin acento amarillo). La pestaña activa, en gris oscuro con relleno gris claro. */
.tabs .ico { --ico-acento: transparent; }
.tabs button[aria-current=&quot;page&quot;] .ico { --ico-acento: var(--line); }
.tabs button[aria-current=&quot;page&quot;] span { filter: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fila > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.alerta { background: var(--alert-soft); color: var(--alert); }
.chip.bus { background: var(--bus-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 16px; background: var(--bus); color: var(--bus-ink); }
.btn.bus { background: var(--bus); color: var(--bus-ink); }
.btn.sec { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.peligro { background: var(--alert); color: #fff; }
.btn.xl { min-height: 64px; font-size: 19px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.grandes { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.grandes button { border: 0; border-radius: 14px; min-height: 72px; font-weight: 700; font-size: 20px; color: #fff; }
.grandes .ok { background: var(--ok); }
.grandes .no { background: var(--alert); font-size: 17px; }
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-weight: 700; font-size: 14px; }
.campo input { border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); }
.nota { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.mapa { position: relative; }
.mapa > svg { width: 100%; height: auto; display: block; border-radius: 14px; background: var(--mapa-fondo); }
.gmap-host, .gmap { width: 100%; height: 320px; border-radius: 14px; overflow: hidden; }
.sello { position: absolute; left: 8px; bottom: 8px; background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.15); display: inline-flex; gap: 5px; align-items: center; }
.sello .g { color: #1A73E8; }
.nota-mapa { font-size: 12px; color: var(--muted); margin-top: 4px; }
.btn-nav { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; min-height: 48px; border-radius: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn-nav b { color: #1A73E8; }
.btn-nav.waze b { color: #0A9BD8; }
.navs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.foto-lic { width: 100%; aspect-ratio: 1.6; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) { .halo { animation: halo 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; } }
@keyframes halo { from { opacity: .55; transform: scale(.6); } to { opacity: 0; transform: scale(1.6); } }
.lista-ev { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista-ev li { display: grid; grid-template-columns: 46px 20px minmax(0, 1fr); gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lista-ev li:last-child { border-bottom: 0; }
.lista-ev .h { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.parada { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.parada.actual { border: 2px solid var(--bus); }
.parada .num { font-family: var(--font-display); font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.parada .nom { font-weight: 700; font-size: 19px; }
.parada.hecha { opacity: .65; padding: 9px 12px; }
.manejo { display: flex; gap: 10px; align-items: center; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.manejo b { display: block; font-size: 16px; }
.manejo span { font-size: 26px; }
.demo { border: 1px dashed var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.vista > .seg { flex-shrink: 0; align-self: flex-start; }
.vista > .seg button { padding: 8px 14px; font-size: 15px; }
.seg button { border: 0; background: transparent; padding: 4px 9px; font-size: 13px; font-weight: 700; }
.seg button[aria-pressed=&quot;true&quot;] { background: var(--ink); color: var(--app); }
.chk { display: inline-flex; gap: 6px; align-items: center; }
.chk input { width: 17px; height: 17px; accent-color: var(--navy); }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; flex: none; }
.dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dato:last-child { border-bottom: 0; }
.dato span:first-child { color: var(--muted); }
.dato span:last-child { text-align: right; font-weight: 700; }
.cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.cifra { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.cifra b { display: block; font-family: var(--font-mono); font-size: 20px; }
.cifra span { font-size: 12px; color: var(--muted); }
.hoja-fondo { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 10; display: flex; align-items: flex-end; }
.hoja { background: var(--surface); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.toast { position: absolute; left: 10px; right: 10px; top: 34px; z-index: 9; background: var(--surface); border: 2px solid var(--ok); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.2); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: baja .3s ease-out; } }
@keyframes baja { from { transform: translateY(-130%); } to { transform: none; } }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
details.hist summary { cursor: pointer; list-style: none; }
details.hist summary::-webkit-details-marker { display: none; }
table.det { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
table.det th, table.det td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
table.det td.mono { font-size: 12px; }
.volver-adm { border: 0; background: transparent; font-weight: 700; color: var(--navy); padding: 2px 0; align-self: flex-start; cursor: pointer; }
.rec { border: 2px solid var(--bus); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.rec-lista { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 2px; }
.ejemplo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.22em; flex-shrink: 0; display: inline-block; overflow: visible; }
.btn .ico, .chip.bus .ico, .btn.ok .ico, .grandes .ok .ico, .grandes .no .ico, .btn.peligro .ico { --ico-acento: rgba(255, 255, 255, .38); }
.seg.tema { display: flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: 12px; }
.seg.tema button { flex: 1; min-height: 40px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg.tema button[aria-pressed=&quot;true&quot;] { background: var(--bus); color: var(--bus-ink); }
.btn.sec .ico { --ico-acento: var(--bus); }
.enlaces { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px; font-size: 13px; color: var(--muted); }
.enlace { border: 0; background: transparent; padding: 6px 4px; font-size: 13px; font-weight: 700; color: var(--navy); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.enlace.peligro { color: var(--alert); font-size: 15px; text-decoration: none; }
.aviso-error { background: var(--alert-soft); color: var(--alert); border: 1px solid var(--alert); border-radius: 12px; padding: 10px 12px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.lista-borra { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
.hoja p { margin: 0; white-space: pre-line; }
.hoja .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.url { font-family: var(--font-mono); font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 6px 8px; overflow-wrap: anywhere; }
</style>

          ${r === null ? &quot;&quot; : r === &quot;nada&quot; ? `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>No hay una familia con ese correo o teléfono. Puedes enviarle un código de invitación desde «Mis alumnos».</span>`
            : `<div class=&quot;fila&quot;><b>${esc(famDe(r).nombre)}</b>${estadoDe(r) === &quot;aceptada&quot; ? `<span class=&quot;chip ok&quot;>✓ Conectados</span>` : estadoDe(r) === &quot;pendiente&quot; ? `<span class=&quot;chip bus&quot;>Pendiente</span>` : `<button class=&quot;btn&quot; style=&quot;min-height:40px&quot; data-a=&quot;elegirRutasFam&quot; data-v=&quot;invitar&quot; data-id=&quot;${r}&quot;>🤝 Invitar</button>`}</div>
              ${CONEX.eligiendo?.id === r &amp;&amp; !estadoDe(r) ? selectorRutas() : &quot;&quot;}`}
        </div>
        ${enviadas.length ? `<h3>Invitaciones enviadas</h3>${enviadas.map((c) => `<div class=&quot;card&quot;><b>${esc(famDe(c.familia).nombre)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Esperando que acepte en su app</span></div>`).join(&quot;&quot;)}` : &quot;&quot;}
        <h3>Familias conectadas (${conectadas.length})</h3>
        ${conectadas.map((c) => `<div class=&quot;card&quot;><b>✓ ${esc(famDe(c.familia).nombre)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>${c.hijos.length ? `Hijos: ${esc(c.hijos.join(&quot;, &quot;))}` : &quot;Aún no registra a sus hijos: entrarán solos a tus rutas&quot;}</span>
          ${c.rutas?.length ? `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Va en: ${c.rutas.map((rid) => RUTAS.find((x) => x.id === rid).nombre).join(&quot; y &quot;)}</span>` : &quot;&quot;}</div>`).join(&quot;&quot;)}
      </div>`;
    }
    if (ADM.vista === &quot;solicitudes&quot;) {
      const abiertas = ADM.solicitudes.filter((x) => x.estado !== &quot;cerrada&quot;);
      return `<div class=&quot;vista&quot;>${volver}<h1>Solicitudes</h1>${msg}
        ${abiertas.length ? abiertas.map((x) => `<button class=&quot;card&quot; style=&quot;text-align:left;cursor:pointer;${x.estado === &quot;abierta&quot; ? &quot;border:2px solid var(--alert)&quot; : &quot;&quot;}&quot; data-a=&quot;verSol&quot; data-id=&quot;${x.id}&quot;>
          <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>${x.tipo === &quot;cancelacion_servicio&quot; ? &quot;Cancelación&quot; : &quot;Pregunta&quot;} · ${x.estado === &quot;abierta&quot; ? &quot;Sin responder&quot; : &quot;Respondida&quot;}</span>
          <b>${esc(x.asunto)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>${esc(x.autor)} · ${esc(nombreDe(x.alumno))}</span></button>`).join(&quot;&quot;) : '<p class=&quot;nota&quot;>No hay solicitudes por atender. 🎉</p>'}</div>`;
    }
    const porCobrar = ADM.cobros.filter((c) => c.estado === &quot;pendiente&quot;).reduce((t, c) => t + c.monto, 0);
    const sinResp = ADM.solicitudes.filter((x) => x.estado === &quot;abierta&quot;).length;
    const sinApp = activos.filter((a) => !a.familiaApp).length;
    const opcion = (v, t, d, alerta) => `<button class=&quot;card&quot; style=&quot;text-align:left;cursor:pointer;${alerta ? &quot;border:2px solid var(--alert)&quot; : &quot;&quot;}&quot; data-a=&quot;adm&quot; data-v=&quot;${v}&quot;><h3>${t}</h3><span class=&quot;muted&quot; style=&quot;font-size:14px&quot;>${d}</span></button>`;
    return `<div class=&quot;vista&quot;><h1>Administrar</h1>
      <span class=&quot;muted&quot; style=&quot;font-size:14px&quot;>Eres la dueña del furgón: tú agregas a tus alumnos, ordenas la ruta y llevas los pagos. Se bloquea mientras manejas.</span>
      ${opcion(&quot;alumnos&quot;, &quot;👧 Mis alumnos&quot;, `${activos.length} activos${sinApp ? ` · ${sinApp} familia(s) sin la app` : &quot;&quot;}`, false)}
      ${opcion(&quot;rutas&quot;, &quot;🗺️ Rutas&quot;, &quot;Ruta recomendada, orden y «hoy no va»&quot;, false)}
      ${opcion(&quot;cobros&quot;, &quot;💳 Cobros y precios&quot;, `${pesosTxt(porCobrar)} por cobrar en ${mesTxt}`, ADM.cobros.some((c) => c.estado === &quot;pendiente&quot; &amp;&amp; c.vencido))}
      ${opcion(&quot;conexiones&quot;, &quot;🤝 Conexiones con familias&quot;, conexPendientes().length ? `${conexPendientes().length} familia(s) quieren conectarse` : &quot;Busca familias o deja que te encuentren&quot;, conexPendientes().length > 0)}
      ${opcion(&quot;solicitudes&quot;, &quot;💬 Solicitudes de las familias&quot;, sinResp ? `${sinResp} sin responder` : &quot;Todo respondido&quot;, sinResp > 0)}
      <p class=&quot;nota&quot;>También puedes entrar al panel web de administración con esta misma cuenta.</p></div>`;
  }

  // ---------- Estado de la app ----------
  const app = { vista: &quot;login&quot;, tab: &quot;hoy&quot;, hoja: null, toast: null, vel: 20, senal: true, terminados: [],
    ubicacionOk: false, rutaPorIniciar: null, legal: null, eliminarTxt: &quot;&quot; };
  let R = null; // recorrido activo

  function iniciarRecorrido(rutaId) {
    const ruta = RUTAS.find((r) => r.id === rutaId);
    const orden = alumnosQueVan(ruta);
    const noVan = alumnosDeRuta(ruta).filter((a) => ruta.noViaja.includes(a.id));
    // Con Google Maps conectado, el furgón recorre la ruta real por calles.
    const vigente = GM.claves[ruta.tipo] === orden.map((a) => a.id).join();
    const puntos = (vigente &amp;&amp; GM.rutas[ruta.tipo]) || trazar(ruta.tipo === &quot;ida&quot; ? [BASE, ...orden, COLEGIO] : [COLEGIO, ...orden]);
    const acum = [0];
    for (let i = 1; i < puntos.length; i++) acum.push(acum[i - 1] + dist(puntos[i - 1], puntos[i]));
    // Cada casa queda en el punto de la ruta más cercano, avanzando en orden.
    let desde = 0;
    const enRuta = orden.map((a) => {
      let mejor = desde, menor = Infinity;
      for (let i = desde; i < puntos.length; i++) { const dd = dist(puntos[i], a); if (dd < menor) { menor = dd; mejor = i; } }
      desde = mejor;
      return acum[mejor];
    });
    R = {
      ruta, puntos, acum, largo: acum.at(-1), t: 0, d: 0, cola: 0, enviadas: 0, detenido: null, fin: false,
      paradas: [...orden.map((a, j) => ({ ...a, dRuta: enRuta[j], estado: &quot;pendiente&quot; })), ...noVan.map((a) => ({ ...a, dRuta: Infinity, estado: &quot;no_viaja&quot; }))]
        .map((p) => ({ ...p, eta: null, avisoT: null, confT: null, confPor: null, marcaT: null })),
      llamadas: [], ev: [], gratis: 0, pagadas: 0,
    };
    evento(&quot;▶️&quot;, `Recorrido iniciado. Compartiendo ubicación cada ${CFG.gps} s.`);
    R.paradas.filter((p) => p.estado === &quot;no_viaja&quot;).forEach((p) => evento(&quot;📅&quot;, `${p.nombre} no va hoy (${ruta.porTia.includes(p.id) ? &quot;lo marcaste tú&quot; : &quot;lo marcó su apoderado&quot;}): la ruta se salta su casa.`));
    gps();
    app.vista = &quot;recorrido&quot;;
  }

  const hora = (t) => { const s = Math.floor(R.ruta.inicio + t); return `${String(Math.floor(s / 3600)).padStart(2, &quot;0&quot;)}:${String(Math.floor(s % 3600 / 60)).padStart(2, &quot;0&quot;)}`; };
  const evento = (i, txt, tipo = &quot;&quot;) => R.ev.unshift({ t: R.t, i, txt, tipo });

  function dSuave() {
    if (!R || R.fin || R.detenido || app.hoja || app.vista !== &quot;recorrido&quot;) return R ? R.d : 0;
    const obj = R.paradas.find((p) => p.estado === &quot;pendiente&quot; &amp;&amp; p.dRuta >= R.d - 1);
    return Math.min(obj ? obj.dRuta : R.largo, R.d + (typeof acc === &quot;number&quot; ? acc : 0) * CFG.kmh / 3.6);
  }

  function puntoEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1;
    if (d >= R.largo) return R.puntos.at(-1);
    const f = (d - R.acum[i - 1]) / ((R.acum[i] - R.acum[i - 1]) || 1), a = R.puntos[i - 1], b = R.puntos[i];
    return { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f };
  }

  function gps() {
    if (!app.senal) { R.cola++; return; }
    if (R.cola) evento(&quot;📶&quot;, `Señal recuperada: se enviaron ${R.cola + 1} posiciones guardadas.`);
    R.enviadas += R.cola + 1; R.cola = 0;
    const pos = puntoEn(R.d), v = CFG.kmh / 3.6;
    const pend = R.paradas.filter((p) => p.estado === &quot;pendiente&quot;);
    pend.forEach((p, i) => { p.eta = Math.max(0, (p.dRuta - R.d) / v) + i * CFG.parada; });
    for (const p of pend) {
      if (p.avisoT !== null) continue;
      if (dist(pos, p) <= CFG.proximidad || p.eta <= 5 * 60 + CFG.margen) {
        p.avisoT = R.t;
        avisar(p);
        app.toast = { txt: `🔔 Se avisó a ${p.apoderado} que llegas en ~${Math.max(1, Math.round(p.eta / 60))} min con ${p.nombre.split(&quot; &quot;)[0]}.`, hasta: performance.now() + 5000 };
      }
    }
  }

  function avisar(p) {
    evento(&quot;🔔&quot;, `Aviso automático a ${p.apoderado} de ${p.nombre}: alarma en su teléfono.`, &quot;aviso&quot;);
    evento(&quot;📲&quot;, `Llamada por la app a ${p.apoderado} (por internet, sin costo).`);
    R.llamadas.push({ p, canal: &quot;app&quot;, desde: R.t, fase: &quot;sonando&quot; });
    R.gratis++;
  }

  function confirmar(p, como) {
    if (p.confT !== null) return;
    p.confT = R.t; p.confPor = como;
    R.llamadas.filter((l) => l.p === p).forEach((l) => { l.fase = &quot;fin&quot;; });
    evento(&quot;✅&quot;, `${p.apoderado} confirmó el aviso de ${p.nombre.split(&quot; &quot;)[0]} (${como}).`, &quot;ok&quot;);
  }

  // Escalera de llamadas: primero gratis por la app; si el teléfono del apoderado no
  // acusa recibo en 15 s (sin internet), llamada telefónica normal (con costo).
  function llamadas() {
    for (const l of R.llamadas) {
      if (l.fase === &quot;fin&quot;) continue;
      const p = l.p, t = R.t - l.desde;
      if (p.estado !== &quot;pendiente&quot;) { l.fase = &quot;fin&quot;; continue; }
      if (p.respuesta === &quot;recibido&quot; &amp;&amp; t >= 6) { confirmar(p, &quot;tocó Recibido en la app&quot;); continue; }
      if (l.canal === &quot;app&quot;) {
        if (p.respuesta === &quot;sininternet&quot; &amp;&amp; t >= CFG.acuseApp) {
          evento(&quot;📵&quot;, `El teléfono de ${p.apoderado} no tiene internet: la llamada por la app no llegó. Se llama por teléfono (con costo).`);
          Object.assign(l, { canal: &quot;telefono&quot;, desde: R.t });
          R.pagadas++;
        } else if (p.respuesta === &quot;app&quot; &amp;&amp; t >= 10) {
          confirmar(p, &quot;contestó la llamada por la app y presionó 1 · sin costo&quot;);
        }
      } else if (t >= 12) {
        confirmar(p, &quot;contestó la llamada telefónica y presionó 1 · con costo&quot;);
      }
    }
  }

  function paso() {
    if (!R || R.fin) return;
    R.t++;
    const v = CFG.kmh / 3.6;
    if (!R.detenido) {
      const obj = R.paradas.find((p) => p.estado === &quot;pendiente&quot; &amp;&amp; p.dRuta >= R.d - 1);
      const tope = obj ? obj.dRuta : R.largo;
      R.d = Math.min(tope, R.d + v);
      if (obj &amp;&amp; R.d >= obj.dRuta) { R.detenido = obj; evento(&quot;🅿️&quot;, `Llegaste donde ${obj.nombre}. Marca la ${R.ruta.tipo === &quot;ida&quot; ? &quot;subida&quot; : &quot;entrega&quot;}.`); }
    }
    // Demostración: en la vuelta, la mamá de Sofía toca «Ya subió» en su app.
    if (R.ruta.tipo === &quot;vuelta&quot; &amp;&amp; R.t === 12) {
      const p = R.paradas.find((x) => x.id === &quot;sofia&quot; &amp;&amp; x.estado === &quot;pendiente&quot;);
      if (p) { p.subioFamilia = true; evento(&quot;🙋&quot;, `${p.apoderado} confirmó que ${p.nombre.split(&quot; &quot;)[0]} subió: la sigue en vivo hasta su hogar.`); }
    }
    if (R.t % CFG.gps === 0) gps();
    llamadas();
  }

  function marcar(id, estado) {
    const p = R.paradas.find((x) => x.id === id);
    if (!p || p.estado !== &quot;pendiente&quot;) return;
    p.estado = estado; p.marcaT = R.t;
    R.llamadas.filter((l) => l.p === p).forEach((l) => { l.fase = &quot;fin&quot;; });
    const txt = estado === &quot;ausente&quot; ? `${p.nombre} marcado ausente.` : R.ruta.tipo === &quot;ida&quot; ? `${p.nombre} subió al furgón.` : `${p.nombre} está en su hogar.`;
    evento(estado === &quot;ausente&quot; ? &quot;🚫&quot; : &quot;🏠&quot;, `${txt} Se avisó a ${p.apoderado}.`, &quot;ok&quot;);
    app.toast = { txt: `✅ ${txt} Su apoderado ya recibió la confirmación.`, hasta: performance.now() + 4000 };
    if (R.detenido === p) R.detenido = null;
  }

  function finalizar() {
    R.fin = true;
    const pend = R.paradas.filter((p) => p.estado === &quot;pendiente&quot;).length;
    evento(&quot;🏁&quot;, &quot;Recorrido finalizado. El GPS se detuvo.&quot;);
    const det = R.paradas.map((p) => [p.nombre, p.avisoT !== null ? hora(p.avisoT) : &quot;—&quot;, p.marcaT !== null ? hora(p.marcaT) : &quot;—&quot;,
      p.estado === &quot;no_viaja&quot; ? &quot;No viajó&quot; : p.estado === &quot;ausente&quot; ? &quot;Ausente&quot; : !p.confPor ? (pend ? &quot;Pendiente&quot; : &quot;Sin confirmar&quot;)
      : p.confPor.includes(&quot;telefónica&quot;) ? &quot;Teléfono (con costo)&quot; : p.confPor.includes(&quot;llamada por la app&quot;) ? &quot;Llamada app (gratis)&quot; : &quot;Recibido en app&quot;]);
    app.terminados.unshift({ fecha: &quot;Hoy&quot;, ruta: R.ruta.nombre, inicio: hora(0), fin: hora(R.t), km: +(R.d / 1000).toFixed(1), det, ejemplo: false });
    app.hoja = null; app.vista = &quot;resumen&quot;;
  }

  // ---------- Vistas ----------
  const esc = (s) => String(s).replace(/[&amp;<>&quot;]/g, (c) => ({ &quot;&amp;&quot;: &quot;&amp;amp;&quot;, &quot;<&quot;: &quot;&amp;lt;&quot;, &quot;>&quot;: &quot;&amp;gt;&quot;, '&quot;': &quot;&amp;quot;&quot; }[c]));
  const $tel = document.getElementById(&quot;tel&quot;);
  let previo = &quot;&quot;, presionando = false;
  addEventListener(&quot;pointerdown&quot;, () => { presionando = true; }, true);
  addEventListener(&quot;pointerup&quot;, () => setTimeout(() => { presionando = false; }, 0), true);

  function barraSis() {
    const h = R &amp;&amp; app.vista !== &quot;hoy&quot; ? hora(R.t) : (app.vista === &quot;login&quot; ? &quot;16:25&quot; : &quot;16:28&quot;);
    return `<div class=&quot;estado-sis&quot;><span>${h}</span><span>${app.senal ? &quot;4G ▮▮▮ · 82%&quot; : &quot;Sin señal · 82%&quot;}</span></div>`;
  }

  function vLogin() {
    return `<div class=&quot;vista&quot; style=&quot;justify-content:center&quot;>
      <div style=&quot;text-align:center; display:flex; flex-direction:column; gap:6px; align-items:center; margin-bottom: 18px;&quot;>
        <svg width=&quot;84&quot; height=&quot;56&quot; viewBox=&quot;0 0 84 56&quot; aria-hidden=&quot;true&quot;><rect x=&quot;4&quot; y=&quot;8&quot; width=&quot;76&quot; height=&quot;36&quot; rx=&quot;9&quot; fill=&quot;var(--bus)&quot; stroke=&quot;var(--bus-ink)&quot; stroke-width=&quot;3&quot;/><rect x=&quot;12&quot; y=&quot;15&quot; width=&quot;16&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.75&quot;/><rect x=&quot;34&quot; y=&quot;15&quot; width=&quot;16&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.75&quot;/><rect x=&quot;56&quot; y=&quot;15&quot; width=&quot;16&quot; height=&quot;12&quot; rx=&quot;2&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.75&quot;/><circle cx=&quot;22&quot; cy=&quot;46&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;/><circle cx=&quot;62&quot; cy=&quot;46&quot; r=&quot;7&quot; fill=&quot;var(--ink)&quot;/></svg>
        <h1>Furgón Escolar</h1><span class=&quot;muted&quot;>Avisos automáticos de llegada</span>
      </div>
      <div class=&quot;campo&quot;><label for=&quot;em&quot;>Correo</label><input id=&quot;em&quot; type=&quot;email&quot; value=&quot;${TIA.email}&quot; autocomplete=&quot;email&quot;></div>
      <div class=&quot;campo&quot;><label for=&quot;pw&quot;>Contraseña</label><input id=&quot;pw&quot; type=&quot;password&quot; value=&quot;demo-furgon&quot; autocomplete=&quot;current-password&quot;></div>
      <button class=&quot;btn xl&quot; data-a=&quot;entrar&quot;>Ingresar</button>
      <p class=&quot;nota&quot;>Cuenta de demostración. Las cuentas de conductora las crea el dueño del furgón con un código de invitación.</p>
      ${enlacesLegales()}
    </div>`;
  }

  function vLicencia() {
    const s = situacionLic(), f = LIC.form;
    const foto = (lado) => `<div style=&quot;display:flex;flex-direction:column;gap:6px&quot;><b style=&quot;font-size:14px&quot;>Foto del ${lado}${lado === &quot;reverso&quot; ? &quot; (opcional)&quot; : &quot;&quot;}</b>
      ${LIC.fotos[lado] ? `<img class=&quot;foto-lic&quot; src=&quot;${LIC.fotos[lado]}&quot; alt=&quot;Foto del ${lado}&quot;>` : &quot;&quot;}
      <label class=&quot;btn sec&quot; style=&quot;display:flex;align-items:center;justify-content:center;cursor:pointer&quot;>📷 ${LIC.fotos[lado] ? &quot;Cambiar foto&quot; : &quot;Tomar o elegir foto&quot;}<input type=&quot;file&quot; accept=&quot;image/*&quot; capture=&quot;environment&quot; data-foto=&quot;${lado}&quot; style=&quot;display:none&quot;></label></div>`;
    return `<div class=&quot;vista&quot;><button class=&quot;volver-adm&quot; data-a=&quot;cerrarLic&quot;>‹ Volver</button><h1>Mi licencia</h1>
      <div class=&quot;card&quot; style=&quot;border:2px solid ${s.clase === &quot;ok&quot; ? &quot;var(--ok)&quot; : s.clase === &quot;bus&quot; ? &quot;var(--bus)&quot; : &quot;var(--alert)&quot;}&quot;><b>${s.txt}</b>
        <span class=&quot;muted&quot; style=&quot;font-size:14px&quot;>N° ${LIC.numero} · Clase ${LIC.clase} · vence el ${fechaCL(LIC.vence)}</span></div>
      ${LIC.estado === &quot;pendiente&quot; ? `<p class=&quot;nota&quot;>Te avisaremos cuando la empresa la verifique.</p>` : f ? `<div class=&quot;card&quot;><h3>Subir licencia renovada</h3>
          <div class=&quot;campo&quot;><label for=&quot;lic-numero&quot;>Número (RUT)</label><input id=&quot;lic-numero&quot; data-l=&quot;numero&quot; value=&quot;${esc(f.numero)}&quot;></div>
          <b style=&quot;font-size:14px&quot;>Clase</b><div class=&quot;chips&quot;>${[&quot;A1&quot;, &quot;A3&quot;, &quot;A2&quot;, &quot;A4&quot;, &quot;A5&quot;, &quot;B&quot;].map((c) => `<button class=&quot;chip ${f.clase === c ? &quot;ok&quot; : &quot;&quot;}&quot; style=&quot;border:0;cursor:pointer;font-size:14px;padding:8px 12px&quot; data-a=&quot;claseLic&quot; data-v=&quot;${c}&quot;>${c}</button>`).join(&quot;&quot;)}</div>
          <div class=&quot;campo&quot;><label for=&quot;lic-vence&quot;>Vence el</label><input id=&quot;lic-vence&quot; type=&quot;date&quot; data-l=&quot;vence&quot; value=&quot;${esc(f.vence)}&quot;></div>
          ${foto(&quot;frente&quot;)}${foto(&quot;reverso&quot;)}
          ${LIC.error ? `<p class=&quot;nota&quot; style=&quot;color:var(--alert);margin:0&quot;>${esc(LIC.error)}</p>` : &quot;&quot;}
          <button class=&quot;btn xl&quot; data-a=&quot;enviarLic&quot;>Enviar para verificar</button>
          <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>🔒 Las fotos solo las ve la empresa para verificarla.</span></div>`
        : `<button class=&quot;btn xl&quot; data-a=&quot;renovarLic&quot;>Subir licencia renovada</button>`}

  function vHoy() {

        <div class=&quot;chips&quot;><span class=&quot;chip ok&quot;>✓ Ubicación “Siempre”</span><span class=&quot;chip ok&quot;>✓ Notificaciones</span><span class=&quot;chip ok&quot;>✓ Batería 82%</span><span class=&quot;chip ok&quot;>✓ Ahorro de batería desactivado</span></div>

      ${(() => { const s = situacionLic(); return s.clase === &quot;ok&quot; ? &quot;&quot; : `<button class=&quot;card&quot; style=&quot;text-align:left;cursor:pointer;border:2px solid ${s.clase === &quot;bus&quot; ? &quot;var(--bus)&quot; : &quot;var(--alert)&quot;}&quot; data-a=&quot;abrirLic&quot;><b>🪪 Mi licencia</b><span style=&quot;font-size:14px&quot;>${esc(s.txt)}</span></button>`; })()}
      ${conexPendientes().length ? `<button class=&quot;card&quot; style=&quot;text-align:left;cursor:pointer;border:2px solid var(--ok)&quot; data-a=&quot;irConexiones&quot;><b>🤝 ${esc(famDe(conexPendientes()[0].familia).nombre)} quiere conectarse contigo</b><span class=&quot;muted&quot; style=&quot;font-size:14px&quot;>Toca para responder</span></button>` : &quot;&quot;}
      ${rutas}

    </div>`;

  // Fondo de mapa dibujado: manzanas, calles, avenidas, un parque y el río Mapocho.
  const FONDO_MAPA = (() => {
    let f = `<rect width=&quot;${W}&quot; height=&quot;${H}&quot; fill=&quot;var(--mapa-fondo)&quot;/>`;
    for (let x = 6; x < W; x += 30) for (let y = 6; y < H; y += 26) f += `<rect x=&quot;${x}&quot; y=&quot;${y}&quot; width=&quot;24&quot; height=&quot;20&quot; rx=&quot;3&quot; fill=&quot;var(--mapa-manzana)&quot;/>`;
    f += `<rect x=&quot;186&quot; y=&quot;58&quot; width=&quot;54&quot; height=&quot;46&quot; rx=&quot;8&quot; fill=&quot;var(--mapa-parque)&quot;/>`;
    f += `<path d=&quot;M-10 40 C 60 18, 120 52, 190 30 S 300 6, 380 22&quot; fill=&quot;none&quot; stroke=&quot;var(--mapa-agua)&quot; stroke-width=&quot;9&quot; stroke-linecap=&quot;round&quot;/>`;
    for (let x = 3; x < W; x += 30) f += `<line x1=&quot;${x}&quot; y1=&quot;0&quot; x2=&quot;${x}&quot; y2=&quot;${H}&quot; stroke=&quot;var(--mapa-calle)&quot; stroke-width=&quot;${x % 90 === 3 ? 5 : 3}&quot;/>`;
    for (let y = 3; y < H; y += 26) f += `<line x1=&quot;0&quot; y1=&quot;${y}&quot; x2=&quot;${W}&quot; y2=&quot;${y}&quot; stroke=&quot;var(--mapa-calle)&quot; stroke-width=&quot;${y % 78 === 3 ? 5 : 3}&quot;/>`;
    f += `<line x1=&quot;0&quot; y1=&quot;185&quot; x2=&quot;${W}&quot; y2=&quot;160&quot; stroke=&quot;var(--mapa-avenida)&quot; stroke-width=&quot;7&quot;/>`;
    return f;
  })();

  function mapa() {
    if (GM.estado === &quot;listo&quot;) {
      return `<div class=&quot;mapa&quot;><div id=&quot;gmap-host&quot; class=&quot;gmap-host&quot;></div><span class=&quot;sello&quot;><span class=&quot;g&quot;>G</span> Google Maps · tráfico en vivo</span></div>
        ${GM.avisoRuta ? `<div class=&quot;nota-mapa&quot;>${esc(GM.avisoRuta)}</div>` : &quot;&quot;}`;
    }
    const d = dSuave();
    const pts = R.puntos.map(px), van = px(puntoEn(d));
    const i0 = R.acum.findIndex((a) => a >= d);
    const hecho = pts.slice(0, i0 === -1 ? pts.length : i0).concat([van]);
    const linea = (arr) => arr.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(&quot; &quot;);
    const sig = R.paradas.find((p) => p.estado === &quot;pendiente&quot; &amp;&amp; p.dRuta >= R.d - 1);
    const izq = sig ? px(sig).x < van.x - 1 : false;
    const casas = R.paradas.map((p, j) => {
      if (p.estado === &quot;no_viaja&quot;) return &quot;&quot;;
      const c = px(p);
      return `<circle cx=&quot;${c.x}&quot; cy=&quot;${c.y}&quot; r=&quot;${CFG.proximidad * k}&quot; fill=&quot;var(--bus)&quot; fill-opacity=&quot;.14&quot;/>
        <svg x=&quot;${c.x - 12}&quot; y=&quot;${c.y - 32}&quot; width=&quot;24&quot; height=&quot;32&quot; viewBox=&quot;0 0 30 40&quot;>${pinSVG(p.estado === &quot;entregado&quot; ? &quot;✓&quot; : j + 1, colorCasa(p)).replace(/^<svg[^>]*>|<\/svg>$/g, &quot;&quot;)}</svg>`;
    }).join(&quot;&quot;);
    const col = px(COLEGIO);
    return `<div class=&quot;mapa&quot;><svg viewBox=&quot;0 0 ${W} ${H}&quot; role=&quot;img&quot; aria-label=&quot;Mapa del recorrido&quot;>
      ${FONDO_MAPA}
      <polyline points=&quot;${linea(pts)}&quot; fill=&quot;none&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;9&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>
      <polyline points=&quot;${linea(pts)}&quot; fill=&quot;none&quot; stroke=&quot;var(--muted)&quot; stroke-width=&quot;4&quot; stroke-dasharray=&quot;1 7&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>
      <polyline points=&quot;${linea(hecho)}&quot; fill=&quot;none&quot; stroke=&quot;var(--navy)&quot; stroke-width=&quot;5&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>
      <svg x=&quot;${col.x - 13}&quot; y=&quot;${col.y - 34}&quot; width=&quot;26&quot; height=&quot;34&quot; viewBox=&quot;0 0 30 40&quot;>${pinSVG(&quot;🏫&quot;, &quot;#15202B&quot;).replace(/^<svg[^>]*>|<\/svg>$/g, &quot;&quot;)}</svg>
      ${casas}
      <circle class=&quot;halo&quot; cx=&quot;${van.x}&quot; cy=&quot;${van.y - 8}&quot; r=&quot;22&quot; fill=&quot;var(--bus)&quot;/>
      <svg x=&quot;${van.x - 32}&quot; y=&quot;${van.y - 47}&quot; width=&quot;64&quot; height=&quot;54&quot; viewBox=&quot;0 0 64 54&quot;>${furgonSVG(izq).replace(/^<svg[^>]*>|<\/svg>$/g, &quot;&quot;)}</svg>
    </svg>
    <span class=&quot;sello&quot;>Mapa del recorrido</span></div>
    ${GM.estado === &quot;error&quot; ? `<div class=&quot;nota-mapa&quot;>${esc(GM.error)}</div>` : GM.estado === &quot;cargando&quot; ? `<div class=&quot;nota-mapa&quot;>Conectando con Google Maps…</div>` : &quot;&quot;}`;
  }

  function vRecorrido() {
    const pend = R.paradas.filter((p) => p.estado === &quot;pendiente&quot;);
    const hechas = R.paradas.filter((p) => p.estado !== &quot;pendiente&quot;);
    const ok = R.ruta.tipo === &quot;ida&quot; ? &quot;Subió ✅&quot; : &quot;En su hogar ✅&quot;;
    const estadoAviso = (p) => p.confT !== null ? `<span class=&quot;chip ok&quot;>✓ ${esc(p.apoderado)} confirmó</span>`
      : p.avisoT !== null ? `<span class=&quot;chip alerta&quot;>🔔 Avisado ${hora(p.avisoT)} · esperando confirmación</span>`
      : `<span class=&quot;chip&quot;>Se avisará ~5 min antes</span>`;
    return `<div class=&quot;vista&quot;>
      <div class=&quot;fila&quot;><h1>${R.ruta.nombre}</h1><span class=&quot;mono muted&quot;>${hora(R.t)}</span></div>
      <div class=&quot;chips&quot;>
        ${app.senal ? `<span class=&quot;chip ok&quot;><span class=&quot;dot&quot;></span>Compartiendo ubicación</span>` : `<span class=&quot;chip alerta&quot;><span class=&quot;dot&quot;></span>Sin señal · ${R.cola} posiciones guardadas</span>`}
        <span class=&quot;chip&quot;>${(R.d / 1000).toFixed(1)} de ${(R.largo / 1000).toFixed(1)} km</span>
      </div>
      ${R.detenido ? &quot;&quot; : `<div class=&quot;manejo&quot;><span>🚐</span><div><b>Conduce tranquila</b>Los avisos a los apoderados se envían solos. Marca a cada alumno cuando estés detenida.</div></div>`}
      ${mapa()}
      ${pend.map((p, i) => {
        const aqui = R.detenido === p;
        return `<div class=&quot;parada ${i === 0 ? &quot;actual&quot; : &quot;&quot;}&quot;>
          <span class=&quot;num&quot;>Parada ${R.paradas.indexOf(p) + 1}${aqui ? &quot; · estás aquí&quot; : p.eta != null ? ` · llegada en ~${Math.max(1, Math.round(p.eta / 60))} min` : &quot;&quot;}</span>
          <span class=&quot;nom&quot;>${esc(p.nombre)}</span>
          <span class=&quot;muted&quot;>${esc(p.direccion)} · ${esc(p.indic)}</span>
          <div class=&quot;chips&quot;>${p.subioFamilia ? `<span class=&quot;chip ok&quot;>🙋 Su familia confirmó que subió</span>` : &quot;&quot;}${estadoAviso(p)}</div>
          ${i === 0 &amp;&amp; !aqui ? `<div class=&quot;navs&quot;><a class=&quot;btn-nav&quot; href=&quot;${urlNavegar(p)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>🧭 <b>Google Maps</b></a><a class=&quot;btn-nav waze&quot; href=&quot;${urlWaze(p)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>🚗 <b>Waze</b></a></div>` : &quot;&quot;}
          ${aqui || i === 0 ? `<div class=&quot;grandes&quot;><button class=&quot;ok&quot; data-a=&quot;marcar&quot; data-id=&quot;${p.id}&quot; data-e=&quot;entregado&quot;>${ok}</button><button class=&quot;no&quot; data-a=&quot;marcar&quot; data-id=&quot;${p.id}&quot; data-e=&quot;ausente&quot;>Ausente</button></div>` : &quot;&quot;}
        </div>`;
      }).join(&quot;&quot;)}
      ${pend.length === 0 ? `<div class=&quot;card&quot;><h3>¡Listo! No quedan alumnos.</h3><span class=&quot;muted&quot;>Finaliza el recorrido para dejar de compartir tu ubicación.</span></div>` : &quot;&quot;}
      ${hechas.map((p) => `<div class=&quot;parada hecha&quot;><span>${R.paradas.indexOf(p) + 1}. ${esc(p.nombre)} · ${{ entregado: ok + &quot; &quot; + (p.marcaT !== null ? hora(p.marcaT) : &quot;&quot;), ausente: &quot;Ausente&quot;, no_viaja: &quot;Hoy no viaja&quot; }[p.estado]}</span></div>`).join(&quot;&quot;)}
      <div class=&quot;card&quot;><h3>Avisos automáticos</h3>
        <ul class=&quot;lista-ev&quot;>${R.ev.slice(0, 8).map((e) => `<li><span class=&quot;h&quot;>${hora(e.t)}</span><span>${e.i}</span><span>${esc(e.txt)}</span></li>`).join(&quot;&quot;)}</ul></div>
      <button class=&quot;btn sec&quot; data-a=&quot;pedirFin&quot;>Finalizar recorrido</button>
      <div class=&quot;demo&quot; aria-label=&quot;Controles de la demostración&quot;><b>Demo</b>
        <span class=&quot;seg&quot;>${[5, 20, 40].map((v) => `<button data-a=&quot;vel&quot; data-v=&quot;${v}&quot; aria-pressed=&quot;${app.vel === v}&quot;>×${v}</button>`).join(&quot;&quot;)}</span>
        <label class=&quot;chk&quot;><input type=&quot;checkbox&quot; id=&quot;chkSenal&quot; ${app.senal ? &quot;&quot; : &quot;checked&quot;}> Sin señal</label>
      </div>
    </div>`;
  }

  function vResumen() {
    const r = app.terminados[0];
    const entregados = R.paradas.filter((p) => p.estado === &quot;entregado&quot;).length;
    const avisos = R.paradas.filter((p) => p.avisoT !== null).length;
    const conf = R.paradas.filter((p) => p.confT !== null).length;
    const dur = Math.round(R.t / 60);
    return `<div class=&quot;vista&quot;>
      <span class=&quot;chip ok&quot; style=&quot;align-self:flex-start&quot;>✓ GPS detenido</span>
      <h1>Recorrido terminado</h1>
      <span class=&quot;muted&quot;>${r.ruta} · ${r.inicio} a ${r.fin}</span>
      <div class=&quot;cifras&quot;>
        <div class=&quot;cifra&quot;><b>${dur} min</b><span>Duración</span></div>
        <div class=&quot;cifra&quot;><b>${r.km} km</b><span>Recorridos</span></div>
        <div class=&quot;cifra&quot;><b>${entregados}/${R.paradas.length}</b><span>${R.ruta.tipo === &quot;ida&quot; ? &quot;Subieron&quot; : &quot;En su hogar&quot;}</span></div>
        <div class=&quot;cifra&quot;><b>${conf}/${avisos}</b><span>Avisos confirmados</span></div>
        <div class=&quot;cifra&quot;><b>${R.gratis}</b><span>Llamadas por la app (sin costo)</span></div>

      </div>
      <div class=&quot;card&quot;><h3>Detalle</h3>${tablaDet(r.det)}</div>
      <p class=&quot;nota&quot;>Llamadas que hiciste mientras manejabas: <b>0</b>. Todos los avisos se enviaron solos. Solo se pagó una llamada telefónica cuando el apoderado no tenía internet.</p>
      <button class=&quot;btn xl&quot; data-a=&quot;volver&quot;>Volver al inicio</button>
    </div>`;
  }

  const tablaDet = (det) => `<table class=&quot;det&quot;><thead><tr><th>Alumno</th><th>Aviso</th><th>${&quot;En su hogar&quot;}</th><th>Confirmó</th></tr></thead><tbody>
    ${det.map((d) => `<tr><td>${esc(d[0])}</td><td class=&quot;mono&quot;>${d[1]}</td><td class=&quot;mono&quot;>${d[2]}</td><td>${esc(d[3])}</td></tr>`).join(&quot;&quot;)}</tbody></table>`;

  function vHistorial() {
    const todos = [...app.terminados, ...HISTORIAL];
    return `<div class=&quot;vista&quot;>
      <h1>Historial</h1>
      <span class=&quot;muted&quot;>Hora de cada aviso y de cada llegada al hogar. Toca un recorrido para ver el detalle.</span>
      ${todos.map((h, i) => `<details class=&quot;hist&quot; ${i === 0 ? &quot;open&quot; : &quot;&quot;}>

  }

  // Apariencia: automática (según el teléfono), clara u oscura.
  const temaActual = () => document.documentElement.dataset.theme === &quot;dark&quot; ? &quot;oscuro&quot; : document.documentElement.dataset.theme === &quot;light&quot; ? &quot;claro&quot; : &quot;sistema&quot;;
  function cambiarTema(v) {

  }
  function vPerfil() {
    return `<div class=&quot;vista&quot;>
      <div style=&quot;display:flex; gap:14px; align-items:center&quot;>
        <div class=&quot;avatar&quot;>MF</div>

      </div>

        <div class=&quot;dato&quot;><span>Notificaciones</span><span style=&quot;color:var(--ok)&quot;>Activadas ✓</span></div>

      </div>
      <div class=&quot;card&quot;><h3>Apariencia</h3>
        <span class=&quot;seg tema&quot; role=&quot;group&quot; aria-label=&quot;Apariencia&quot;>${[[&quot;sistema&quot;, &quot;Automático&quot;], [&quot;claro&quot;, &quot;Claro&quot;], [&quot;oscuro&quot;, &quot;Oscuro&quot;]].map(([v, n]) => `<button data-a=&quot;tema&quot; data-v=&quot;${v}&quot; aria-pressed=&quot;${temaActual() === v}&quot;>${n}</button>`).join(&quot;&quot;)}</span>

        <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Automático usa el idioma del teléfono.</span></div>
      <p class=&quot;nota&quot;>🔒 Tu ubicación solo se comparte mientras hay un recorrido activo. Al finalizar, el GPS se apaga. Los teléfonos de los apoderados no se muestran: la app los llama por ti.</p>
      <button class=&quot;btn sec&quot; data-a=&quot;salir&quot;>Cerrar sesión</button>

        const hijo = HIJOS.find((h) => h.id === p.id);
        return { ...p, dRuta: acum[2 * (j + 1)], estado: hijo &amp;&amp; hijo.noViaja.vuelta ? &quot;no_viaja&quot; : &quot;pendiente&quot;, eta: null, avisoT: null, confT: null, marcaT: null };
      }),
      llamada: null, linea: [],

  }

  const hora = (t) => { const s = Math.floor(16 * 3600 + 30 * 60 + t); return `${String(Math.floor(s / 3600)).padStart(2, &quot;0&quot;)}:${String(Math.floor(s % 3600 / 60)).padStart(2, &quot;0&quot;)}`; };

    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1;

    const f = (d - R.acum[i - 1]) / ((R.acum[i] - R.acum[i - 1]) || 1), a = R.ruta[i - 1], b = R.ruta[i];
    return { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f };
  }
  function notificar(n) {
    // Sin internet la push no llega: queda pendiente hasta que vuelva la conexión.
    if (!app.internet) { app.pendientes.push({ ...n, t: R.t }); return; }
    app.notifs.unshift({ ...n, t: R.t });

  }
  const linea = (txt) => R.linea.push([hora(R.t), txt]);
  // Privacidad: cerca (< 300 m) de la casa de otro niño, la familia ve solo una zona aproximada.
  const cercaDeOtraCasa = (d) => { const pos = puntoEn(d); return R.paradas.some((x) => !x.mia &amp;&amp; dist(pos, x) < CFG.proximidad); };
  const AVISO_PRIVACIDAD = &quot;El furgón está en una parada: ubicación aproximada para cuidar la privacidad de otras familias.&quot;;

  function paso() {
    R.t++;
    const v = CFG.kmh / 3.6;

        if (p) entregar(p);

      }
    } else {
      const obj = R.paradas.find((p) => p.estado === &quot;pendiente&quot; &amp;&amp; p.dRuta >= R.d - 1);
      R.d = Math.min(obj ? obj.dRuta : R.largo, R.d + v);
      if (obj &amp;&amp; R.d >= obj.dRuta) R.detenidoHasta = R.t + CFG.detencion;
      if (!obj &amp;&amp; R.d >= R.largo) { R.fin = true; app.corriendo = false; guardarHistorial(); }
    }
    if (R.t % CFG.gps === 0) evaluar();
    if (R.llamada &amp;&amp; R.llamada.fase === &quot;esperando&quot; &amp;&amp; R.t >= R.llamada.reintentoT) iniciarLlamada(R.llamada.p, 2);
    if (R.llamada &amp;&amp; R.llamada.fase === &quot;sin_acuse&quot; &amp;&amp; R.t >= R.llamada.hastaT) {

    if ((r = patron(t)) !== null) return r;
    if (nucleo !== null &amp;&amp; (r = patron(nucleo)) !== null) return pre + r;

  function miniMapa(p) {
    const a = puntoEn(R.d), dx = (p.lng - a.lng) * mLng, dy = (p.lat - a.lat) * mLat;
    const span = Math.max(700, Math.abs(dx) * 2.4, Math.abs(dy) * 2.4 * (300 / 150));
    const k = 300 / span, cx = 150 - (dx * k) / 2, cy = 75 + (dy * k) / 2, hx = cx + dx * k, hy = cy - dy * k;
    return `<div class=&quot;mini&quot;><svg viewBox=&quot;0 0 300 150&quot; role=&quot;img&quot; aria-label=&quot;El furgón en camino a tu casa&quot;>
      <line x1=&quot;${cx}&quot; y1=&quot;${cy}&quot; x2=&quot;${hx}&quot; y2=&quot;${hy}&quot; stroke=&quot;var(--road)&quot; stroke-width=&quot;5&quot; stroke-dasharray=&quot;3 7&quot; stroke-linecap=&quot;round&quot;/>
      <path d=&quot;M${hx - 11} ${hy + 2} L${hx} ${hy - 10} L${hx + 11} ${hy + 2} L${hx + 8} ${hy + 2} L${hx + 8} ${hy + 11} L${hx - 8} ${hy + 11} L${hx - 8} ${hy + 2} Z&quot; fill=&quot;var(--navy)&quot;/>
      <g transform=&quot;translate(${cx} ${cy})&quot;><rect x=&quot;-17&quot; y=&quot;-11&quot; width=&quot;34&quot; height=&quot;22&quot; rx=&quot;6&quot; fill=&quot;var(--bus)&quot; stroke=&quot;var(--bus-ink)&quot; stroke-width=&quot;2&quot;/><rect x=&quot;-11&quot; y=&quot;-6&quot; width=&quot;9&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.7&quot;/><rect x=&quot;2&quot; y=&quot;-6&quot; width=&quot;9&quot; height=&quot;6&quot; rx=&quot;1&quot; fill=&quot;var(--bus-ink)&quot; opacity=&quot;.7&quot;/></g>
      <text x=&quot;10&quot; y=&quot;142&quot; font-size=&quot;12&quot; fill=&quot;var(--muted)&quot; font-family=&quot;var(--font-body)&quot;>En vivo · a ${(dist(a, p) / 1000).toFixed(1)} km de tu casa</text>
    </svg></div>`;
  }

  function estadoHijo(h) {
    if (!h.asignado) return `<div class=&quot;estado no&quot;><b>Esperando asignación</b><span>El dueño del furgón debe agregar a ${esc(h.nombre)} a una ruta.</span></div>`;
    const p = parDe(h);
    if (!R) return h.noViaja.vuelta ? `<div class=&quot;estado no&quot;><b>Hoy no viaja en la vuelta</b><span>La tía Marcela no pasará por tu casa.</span></div>`
      : `<div class=&quot;estado&quot;><b>Vuelta hoy · 16:30</b><span>Te avisaremos unos ${h.minutos} minutos antes de que llegue el furgón.</span></div>`;
    if (p.estado === &quot;no_viaja&quot;) return `<div class=&quot;estado no&quot;><b>Hoy no viaja</b><span>Se saltó en la ruta.</span></div>`;
    if (p.estado === &quot;entregado&quot;) return `<div class=&quot;estado ok&quot;><b>🏠 En su hogar desde las ${hora(p.marcaT)}</b><span>Dejado/a por la tía Marcela.</span></div>`;
    if (p.aBordoT != null &amp;&amp; p.avisoT === null) return `<div class=&quot;estado bus&quot;><b>🚐 ${esc(h.nombre)} va a bordo</b><span>Confirmaste que subió a las ${hora(p.aBordoT)} · llega en ~${Math.max(1, Math.round((p.eta ?? 600) / 60))} min. La ves en vivo.</span></div>`;
    if (p.avisoT !== null) {
      const aqui = Math.abs(p.dRuta - R.d) < 2;
      return `<div class=&quot;estado bus&quot;><b>${aqui ? &quot;🚐 El furgón está afuera de tu casa&quot; : `🔔 Llega en ~${Math.max(1, Math.round(p.eta / 60))} min`}</b><span>Aviso enviado a las ${hora(p.avisoT)}${p.confT !== null ? &quot; · ✓ confirmado&quot; : &quot;&quot;}</span></div>`;
    }
    return `<div class=&quot;estado&quot;><b>En camino</b><span>El furgón salió del colegio a las 16:30. Te avisaremos cuando falten ~${h.minutos} minutos.</span></div>`;

  function vInicio() {

      ${R ? `<span class=&quot;muted&quot; style=&quot;font-size:12px&quot;>Llamadas hoy: <b>${app.llamGratis}</b> por la app (sin costo) · <b>${app.llamPagadas}</b> telefónicas (con costo)</span>` : &quot;&quot;}

    const tarjetas = hijosVisibles().map((h) => {

        <div class=&quot;fila&quot;><div style=&quot;display:flex; gap:10px; align-items:center; min-width:0&quot;><div class=&quot;avatar chico&quot;>${esc(h.nombre[0])}</div><div style=&quot;min-width:0&quot;><h2>${esc(h.nombre)} ${esc(h.apellido)}</h2><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>${esc(h.curso)} · ${esc(h.colegio)}</span></div></div>
          <button class=&quot;btn link&quot; data-a=&quot;ficha&quot; data-id=&quot;${h.id}&quot;>Ficha ›</button></div>
        ${estadoHijo(h)}
        ${verMapa ? (cercaDeOtraCasa(R.d) ? `<div class=&quot;privado&quot;>🔒 ${AVISO_PRIVACIDAD}</div>` : miniMapa(p)) : R &amp;&amp; p &amp;&amp; p.estado === &quot;pendiente&quot; ? `<div class=&quot;privado&quot;>🔒 Cuando ${esc(h.nombre)} se suba, toca «Ya subió» y la verás en vivo. Si no, verás el furgón desde tu aviso.</div>` : &quot;&quot;}
        ${R &amp;&amp; !R.fin &amp;&amp; p &amp;&amp; p.estado === &quot;pendiente&quot; &amp;&amp; !aBordo ? `<button class=&quot;btn bus&quot; data-a=&quot;yaSubio&quot; data-id=&quot;${h.id}&quot;>🙋 Ya subió ${esc(h.nombre)}</button>` : &quot;&quot;}
        ${R &amp;&amp; !R.fin &amp;&amp; p &amp;&amp; p.estado === &quot;pendiente&quot; ? `<button class=&quot;btn&quot; data-a=&quot;seguir&quot; data-id=&quot;${h.id}&quot;>🗺️ ${aBordo ? `Seguir a ${esc(h.nombre)} en vivo` : &quot;Seguir el furgón en vivo&quot;}</button>` : &quot;&quot;}
        ${p &amp;&amp; p.avisoT !== null &amp;&amp; p.estado === &quot;pendiente&quot; &amp;&amp; p.confT === null ? `<button class=&quot;btn ok&quot; data-a=&quot;recibido&quot; data-id=&quot;${h.id}&quot;>Recibido, estoy ${AP.atento}</button>` : &quot;&quot;}
        ${h.asignado ? `<div><span style=&quot;font-weight:700; font-size:14px&quot;>Hoy no viaja</span>
          ${[&quot;ida&quot;, &quot;vuelta&quot;].map((t) => {
            const bloqueado = t === &quot;ida&quot; || (R &amp;&amp; p &amp;&amp; (p.estado === &quot;entregado&quot; || (p.estado === &quot;pendiente&quot; &amp;&amp; p.avisoT !== null &amp;&amp; Math.abs(p.dRuta - R.d) < 2)));
            return `<div class=&quot;sw-fila&quot;><span>${t === &quot;ida&quot; ? &quot;Ida (07:00) · ya pasó&quot; : &quot;Vuelta (16:30)&quot;}</span><label class=&quot;sw rojo&quot;><input type=&quot;checkbox&quot; data-a=&quot;noviaja&quot; data-id=&quot;${h.id}&quot; data-t=&quot;${t}&quot; ${h.noViaja[t] ? &quot;checked&quot; : &quot;&quot;} ${bloqueado ? &quot;disabled&quot; : &quot;&quot;} aria-label=&quot;${esc(h.nombre)} no viaja en la ${t}&quot;><span></span></label></div>`;
          }).join(&quot;&quot;)}</div>` : &quot;&quot;}
      </div>`;
    }).join(&quot;&quot;);
    return `<div class=&quot;vista&quot;>
      <div><span class=&quot;muted&quot;>Martes 7 de octubre</span><h1>Hola, ${AP.corto}</h1></div>

      ${demo}
      ${FAMILIA.unido ? `<div class=&quot;card&quot;><div class=&quot;fila&quot;><b>👨‍👩‍👧 Ver la app como</b></div>
          <span class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;Ver la app como&quot;>${Object.values(PERSONAS).map((x) => `<button data-a=&quot;verComo&quot; data-v=&quot;${x.id}&quot; aria-pressed=&quot;${AP.id === x.id}&quot;>${x.corto} (${x.rol})</button>`).join(&quot;&quot;)}</span>
          <span class=&quot;muted&quot; style=&quot;font-size:12px&quot;>Perfil compartido: los dos ven a los mismos hijos y reciben la misma alarma, cada uno en su teléfono.</span></div>`
        : AP.id === &quot;ana&quot; ? `<button class=&quot;card invita&quot; data-a=&quot;familia&quot; style=&quot;border-color:var(--bus)&quot;>👨‍👩‍👧 <b>Comparte con el papá</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Que Rodrigo también reciba la alarma, las llamadas y siga el furgón en vivo desde su teléfono.</span></button>` : &quot;&quot;}
      ${AP.id === &quot;ana&quot; &amp;&amp; TIAS.some((t) => t.estado === &quot;pendiente&quot; &amp;&amp; t.inicio === &quot;tia&quot;) ? `<button class=&quot;card invita&quot; data-a=&quot;conectar&quot;>🤝 <b>${esc(TIAS.find((t) => t.estado === &quot;pendiente&quot; &amp;&amp; t.inicio === &quot;tia&quot;).nombre)}</b> quiere conectarse contigo<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Toca para responder</span></button>` : &quot;&quot;}

      ${app.notifs.length ? `<h3>Notificaciones</h3>${app.notifs.slice(0, 6).map((n) => `<div class=&quot;notif ${n.tipo === &quot;aviso&quot; ? &quot;alarma&quot; : n.tipo === &quot;ok&quot; ? &quot;ok&quot; : &quot;&quot;}&quot;><b>${esc(n.titulo)}</b>${esc(n.cuerpo)} <small>${hora(n.t)}</small></div>`).join(&quot;&quot;)}` : &quot;&quot;}
    </div>`;

  // Mapa de barrio estilizado para ubicar el pin.
  function barrio(pin, editable) {
    const W = 320, H = 210;
    let calles = &quot;&quot;;
    for (let x = 18; x < W; x += 52) calles += `<rect x=&quot;${x}&quot; y=&quot;0&quot; width=&quot;9&quot; height=&quot;${H}&quot; fill=&quot;var(--road)&quot;/>`;
    for (let y = 22; y < H; y += 46) calles += `<rect x=&quot;0&quot; y=&quot;${y}&quot; width=&quot;${W}&quot; height=&quot;9&quot; fill=&quot;var(--road)&quot;/>`;
    const p = pin ? { x: pin.x * W, y: pin.y * H } : null;
    return `<div class=&quot;barrio&quot;><svg viewBox=&quot;0 0 ${W} ${H}&quot; data-a=&quot;${editable ? &quot;pin&quot; : &quot;&quot;}&quot; role=&quot;img&quot; aria-label=&quot;Mapa del barrio${editable ? &quot;: toca para ubicar el pin&quot; : &quot;&quot;}&quot;>
      <rect width=&quot;${W}&quot; height=&quot;${H}&quot; fill=&quot;var(--block)&quot;/>${calles}
      <rect x=&quot;0&quot; y=&quot;${H / 2 - 7}&quot; width=&quot;${W}&quot; height=&quot;14&quot; fill=&quot;var(--line)&quot; transform=&quot;rotate(-14 ${W / 2} ${H / 2})&quot;/>
      ${p ? `<g transform=&quot;translate(${p.x} ${p.y})&quot;><path d=&quot;M0 0 C -12 -16 -14 -22 -14 -28 A 14 14 0 1 1 14 -28 C 14 -22 12 -16 0 0 Z&quot; fill=&quot;var(--alert)&quot; stroke=&quot;var(--surface)&quot; stroke-width=&quot;2&quot;/><circle cx=&quot;0&quot; cy=&quot;-28&quot; r=&quot;5&quot; fill=&quot;var(--surface)&quot;/></g>` : &quot;&quot;}
      ${editable ? `<text x=&quot;8&quot; y=&quot;${H - 8}&quot; font-size=&quot;12&quot; fill=&quot;var(--ink)&quot; font-family=&quot;var(--font-body)&quot; font-weight=&quot;700&quot;>Toca la puerta de tu casa</text>` : &quot;&quot;}
    </svg></div>`;
  }
  const coordsDe = (pin) => pin ? `${(-33.452 + (0.5 - pin.y) * 0.004).toFixed(5)}, ${(-70.558 + (pin.x - 0.5) * 0.006).toFixed(5)}` : &quot;—&quot;;

  function vFicha() {
    const h = HIJOS.find((x) => x.id === app.hijoId);
    return `<div class=&quot;vista&quot;>
      <button class=&quot;volver&quot; data-a=&quot;atras&quot;>‹ Volver</button>
      <div style=&quot;display:flex; gap:12px; align-items:center&quot;><div class=&quot;avatar&quot;>${esc(h.nombre[0])}</div><div style=&quot;min-width:0&quot;><h1>${esc(h.nombre)} ${esc(h.apellido)}</h1><span class=&quot;muted&quot;>${esc(h.curso)} · ${esc(h.colegio)}</span></div></div>
      <div class=&quot;card&quot;><div class=&quot;fila&quot;><h3>Dirección</h3><button class=&quot;btn link&quot; data-a=&quot;editPin&quot;>${app.editPin ? &quot;Listo&quot; : &quot;Ajustar pin&quot;}</button></div>
        <span>${esc(h.direccion)}</span>
        ${barrio(h.pin, app.editPin)}
        <span class=&quot;muted mono&quot; style=&quot;font-size:12px&quot;>Pin: ${coordsDe(h.pin)}</span>
        <div class=&quot;dato&quot;><span>Indicaciones</span><span>${esc(h.indic)}</span></div>
        <p class=&quot;nota&quot; style=&quot;margin:0&quot;>El aviso se calcula hasta este pin. Ubícalo justo en la puerta para que llegue a tiempo.</p>

        <span class=&quot;seg&quot; role=&quot;group&quot; aria-label=&quot;Minutos de anticipación&quot;>${[3, 5, 7, 10].map((m) => `<button data-a=&quot;minutos&quot; data-v=&quot;${m}&quot; aria-pressed=&quot;${h.minutos === m}&quot;>${m} min</button>`).join(&quot;&quot;)}</span>
        <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Recibirás la alarma y la llamada cuando el furgón esté a unos ${h.minutos} minutos, según el tráfico.</span>
      </div>
      <div class=&quot;card&quot;><h3>Teléfonos para la llamada</h3>
        ${h.contactos.map((c, i) => `<div class=&quot;dato&quot;><span>${i === 0 ? &quot;Principal&quot; : &quot;Secundario&quot;} · ${esc(c.nombre)}</span><span class=&quot;mono&quot;>${esc(c.tel)}</span></div>`).join(&quot;&quot;)}
        <p class=&quot;nota&quot; style=&quot;margin:0&quot;>Si el principal no contesta dos veces, llamamos al secundario. Presionar 1 confirma el aviso.</p>
      </div>
      <div class=&quot;card&quot;><h3>Furgón</h3>
        <div class=&quot;dato&quot;><span>Conductora</span><span>${TIA.nombre}</span></div>
        <div class=&quot;dato&quot;><span>Vehículo</span><span>${TIA.furgon}</span></div>
        <div class=&quot;dato&quot;><span>Recorridos</span><span>Ida 07:00 · Vuelta 16:30</span></div>

  function vAgregar() {

    return `<div class=&quot;vista&quot;>
      <button class=&quot;volver&quot; data-a=&quot;atras&quot;>‹ Volver</button>
      <h1>Agregar hijo/a</h1>
      ${campo(&quot;nombre&quot;, &quot;Nombre&quot;, 'autocomplete=&quot;off&quot;')}
      ${campo(&quot;apellido&quot;, &quot;Apellido&quot;, 'autocomplete=&quot;off&quot;')}
      <div class=&quot;dos&quot;>${campo(&quot;curso&quot;, &quot;Curso&quot;, 'placeholder=&quot;2° Básico&quot;')}${campo(&quot;colegio&quot;, &quot;Colegio&quot;)}</div>
      ${tiasConectadas().length > 1 ? `<div class=&quot;campo&quot;><label>¿Con qué tía o tío va?</label><div class=&quot;chips&quot;>${tiasConectadas().map((t) => `<button class=&quot;chip ${f.tia === t.id ? &quot;ok&quot; : &quot;&quot;}&quot; style=&quot;border:0;cursor:pointer;font-size:14px;padding:8px 12px&quot; data-a=&quot;tiaHijo&quot; data-id=&quot;${t.id}&quot;>${f.tia === t.id ? &quot;✓ &quot; : &quot;&quot;}${esc(t.nombre.replace(/ \(.*\)$/, &quot;&quot;))}</button>`).join(&quot;&quot;)}</div>${e.tia ? `<small style=&quot;color:var(--alert)&quot;>${e.tia}</small>` : &quot;&quot;}</div>` : &quot;&quot;}
      ${campo(&quot;direccion&quot;, &quot;Dirección&quot;, 'placeholder=&quot;Calle, número, comuna&quot;')}

      ${campo(&quot;indic&quot;, &quot;Indicaciones para la tía (opcional)&quot;, 'placeholder=&quot;Ej: portón verde, depto 302&quot;')}

      <div class=&quot;dos&quot;>${campo(&quot;c1n&quot;, &quot;Principal · nombre&quot;)}${campo(&quot;c1t&quot;, &quot;Teléfono&quot;, 'inputmode=&quot;tel&quot; placeholder=&quot;9 1234 5678&quot;')}</div>
      <div class=&quot;dos&quot;>${campo(&quot;c2n&quot;, &quot;Secundario · nombre&quot;)}${campo(&quot;c2t&quot;, &quot;Teléfono&quot;, 'inputmode=&quot;tel&quot; placeholder=&quot;Opcional&quot;')}</div>
      <p class=&quot;nota&quot;>La tía o el tío asignará a tu hijo/a a su ruta. Hasta entonces verás “Esperando asignación”.</p>
      <button class=&quot;btn xl&quot; data-a=&quot;guardar&quot;>Guardar</button>
    </div>`;

  // Familia: compartir el perfil con el papá (o la mamá).
  function vFamilia() {
    const lista = FAMILIA.hijos ?? HIJOS.map((h) => h.id);
    const unir = (n) => n.join(idioma() === &quot;en&quot; ? &quot; and &quot; : &quot; e &quot;);
    const nombres = HIJOS.filter((h) => lista.includes(h.id)).map((h) => h.nombre);
    // Mismo mensaje que la app real (idiomas/en/movil-familias.ts), en el idioma de la app.
    const msj = (c) => idioma() === &quot;en&quot;
      ? `Hi! I'm sharing ${unir(nombres)} with you in the “Furgón Escolar” app so you also get the school van alerts and can track it live.\n1) Download the app.\n2) If you don't have an account, tap “Create account” and enter this code: ${c}\n   If you already have an account, go to “Family” → “I have a family code”.\nThe code works once and expires in 7 days.`
      : `Hola. Te comparto a ${unir(nombres)} en la app «Furgón Escolar» para que también recibas los avisos del furgón y lo sigas en vivo.\n1) Descarga la app.\n2) Si no tienes cuenta, toca «Crear cuenta» y escribe este código: ${c}\n   Si ya tienes cuenta, ve a «Familia» → «Tengo un código».\nEl código sirve una vez y vence en 7 días.`;
    const soyPapa = AP.id === &quot;rodrigo&quot;;
    return `<div class=&quot;vista&quot;>
      <button class=&quot;volver&quot; data-a=&quot;atras&quot;>‹ Volver</button>
      <h1>Familia</h1>
      <span class=&quot;muted&quot; style=&quot;font-size:14px&quot;>Comparte a tus hijos con el papá o la mamá (o un abuelo/a). Cada uno entra con su propia cuenta y ambos reciben la alarma, las llamadas, siguen el furgón en vivo y pueden marcar «Ya subió» y «hoy no viaja».</span>
      ${hijosVisibles().map((h) => `<div class=&quot;card&quot;><b>${esc(h.nombre)} ${esc(h.apellido)}</b>
        <div class=&quot;dato&quot;><span>👤 Ana Pérez</span><span class=&quot;muted&quot;>${AP.id === &quot;ana&quot; ? &quot;mamá · tú&quot; : &quot;mamá&quot;}</span></div>
        ${FAMILIA.unido &amp;&amp; lista.includes(h.id) ? `<div class=&quot;dato&quot;><span>👥 ${esc(PERSONAS.rodrigo.nombre)}</span><span class=&quot;muted&quot;>${soyPapa ? &quot;papá · tú&quot; : &quot;papá&quot;}</span></div>` : &quot;&quot;}
        ${soyPapa &amp;&amp; FAMILIA.unido &amp;&amp; lista.includes(h.id) ? (app.salirFam === h.id
          ? `<div class=&quot;card&quot; style=&quot;border:2px solid var(--alert)&quot;><b>¿Dejar de recibir los avisos de ${esc(h.nombre)}?</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Ya no verás a este hijo/a en tu app.</span>
              <div class=&quot;dos&quot;><button class=&quot;btn sec&quot; data-a=&quot;cancelarSalirFam&quot;>Cancelar</button><button class=&quot;btn peligro&quot; data-a=&quot;confirmarSalirFam&quot; data-id=&quot;${h.id}&quot;>Salir de la familia</button></div></div>`
          : `<button class=&quot;btn link&quot; style=&quot;align-self:flex-start;color:var(--alert)&quot; data-a=&quot;salirFam&quot; data-id=&quot;${h.id}&quot;>Salir de la familia</button>`) : &quot;&quot;}
      </div>`).join(&quot;&quot;)}
      ${FAMILIA.unido ? `<p class=&quot;nota&quot; style=&quot;color:var(--ok)&quot;>✓ ${esc(PERSONAS.rodrigo.corto)} se unió con su propia cuenta. Su teléfono quedó en la llamada automática de ${nombres.join(&quot; e &quot;)}.</p>
          ${AP.id === &quot;ana&quot; ? `<button class=&quot;btn sec&quot; data-a=&quot;dejarCompartir&quot;>Dejar de compartir con ${esc(PERSONAS.rodrigo.corto)}</button>` : &quot;&quot;}`
        : FAMILIA.codigo ? `<div class=&quot;card&quot; style=&quot;border:2px solid var(--bus)&quot;><b>Código para Rodrigo</b>
          <div class=&quot;codigo-fam&quot;>${FAMILIA.codigo}</div>
          <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Sirve una vez y vence en 7 días. Esperando que Rodrigo lo use…</span>
          <a class=&quot;btn ok&quot; style=&quot;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center&quot; href=&quot;https://wa.me/?text=${encodeURIComponent(msj(FAMILIA.codigo))}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>Enviar por WhatsApp</a></div>`
        : `<div class=&quot;card&quot; style=&quot;border:2px solid var(--bus)&quot;><h3>👨‍👩‍👧 Compartir con…</h3>
          <div class=&quot;chips&quot;>${[&quot;Papá&quot;, &quot;Abuelo/a&quot;, &quot;Otro&quot;].map((p) => `<button class=&quot;chip ${FAMILIA.parentesco === p ? &quot;ok&quot; : &quot;&quot;}&quot; style=&quot;border:0;cursor:pointer;font-size:14px;padding:8px 12px&quot; data-a=&quot;parentescoFam&quot; data-v=&quot;${p}&quot;>${FAMILIA.parentesco === p ? &quot;✓ &quot; : &quot;&quot;}${p}</button>`).join(&quot;&quot;)}</div>
          <span style=&quot;font-weight:700;font-size:14px&quot;>¿A quiénes?</span>
          <div class=&quot;chips&quot;>${HIJOS.map((h) => `<button class=&quot;chip ${lista.includes(h.id) ? &quot;ok&quot; : &quot;&quot;}&quot; style=&quot;border:0;cursor:pointer;font-size:14px;padding:8px 12px&quot; data-a=&quot;hijoFam&quot; data-id=&quot;${h.id}&quot;>${lista.includes(h.id) ? &quot;✓ &quot; : &quot;&quot;}${esc(h.nombre)}</button>`).join(&quot;&quot;)}</div>
          <button class=&quot;btn&quot; data-a=&quot;crearCodigoFam&quot;>Crear código para compartir</button></div>`}
    </div>`;
  }

  // Conectar con la tía o el tío: búsqueda por nombre, furgón o comuna, e invitaciones recibidas.
  function vConectar() {
    const q = app.busqueda.trim().toLowerCase();
    const sinTilde = (x) => x.normalize(&quot;NFD&quot;).replace(/[\u0300-\u036f]/g, &quot;&quot;).toLowerCase();
    const res = q.length >= 2 ? TIAS.filter((t) => sinTilde(`${t.nombre} ${t.empresa} ${t.comunas}`).includes(sinTilde(q))) : null;
    const recibidas = TIAS.filter((t) => t.estado === &quot;pendiente&quot; &amp;&amp; t.inicio === &quot;tia&quot;);
    const enviadas = TIAS.filter((t) => t.estado === &quot;pendiente&quot; &amp;&amp; t.inicio === &quot;yo&quot;);
    const fila = (t) => `<div class=&quot;tia-res&quot;><div class=&quot;avatar chico&quot;>${esc(t.nombre[0])}</div><div style=&quot;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px&quot;>
        <b>${esc(t.nombre)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>🚐 ${esc(t.empresa)} · ${esc(t.comunas)}</span>${t.presentacion ? `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>${esc(t.presentacion)}</span>` : &quot;&quot;}
        ${t.estado === &quot;aceptada&quot; ? `<span class=&quot;chip ok&quot; style=&quot;align-self:flex-start&quot;>✓ Conectados</span>`
          : t.estado === &quot;pendiente&quot; &amp;&amp; t.inicio === &quot;yo&quot; ? `<span class=&quot;chip bus&quot; style=&quot;align-self:flex-start&quot;>Solicitud enviada · esperando respuesta</span>`
          : t.estado === &quot;pendiente&quot; ? `<span class=&quot;chip bus&quot; style=&quot;align-self:flex-start&quot;>Te invitó · responde arriba</span>`
          : app.eligiendo === t.id ? `<div class=&quot;campo&quot;><label for=&quot;f-msgCon&quot;>Mensaje (opcional)</label><input id=&quot;f-msgCon&quot; data-f=&quot;msgCon&quot; value=&quot;${esc(app.form?.msgCon ?? &quot;&quot;)}&quot; placeholder=&quot;Ej: Hola tía, Sofía va en 3° básico&quot;></div>
              <div class=&quot;dos&quot;><button class=&quot;btn&quot; data-a=&quot;enviarCon&quot; data-id=&quot;${t.id}&quot;>Enviar solicitud</button><button class=&quot;btn sec&quot; data-a=&quot;cancelarElegir&quot;>Cancelar</button></div>`
          : `<button class=&quot;btn sec&quot; style=&quot;align-self:flex-start;min-height:40px&quot; data-a=&quot;elegirCon&quot; data-id=&quot;${t.id}&quot;>🤝 Conectar</button>`}
      </div></div>`;
    return `<div class=&quot;vista&quot;>
      <button class=&quot;volver&quot; data-a=&quot;atras&quot;>‹ Volver</button>
      <h1>Conectar con tu tía o tío</h1>
      ${app.msgCon ? `<p class=&quot;nota&quot; style=&quot;color:${app.msgCon.ok ? &quot;var(--ok)&quot; : &quot;var(--alert)&quot;};margin:0&quot;>${esc(app.msgCon.txt)}</p>` : &quot;&quot;}
      ${recibidas.map((t) => `<div class=&quot;card&quot; style=&quot;border:2px solid var(--ok)&quot;><b>🤝 ${esc(t.nombre)} quiere conectarse contigo</b>
        <span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>🚐 ${esc(t.empresa)} · ${esc(t.comunas)}</span>${t.mensaje ? `<span>“${esc(t.mensaje)}”</span>` : &quot;&quot;}
        <div class=&quot;dos&quot;><button class=&quot;btn ok&quot; data-a=&quot;aceptarCon&quot; data-id=&quot;${t.id}&quot;>Aceptar</button><button class=&quot;btn sec&quot; data-a=&quot;rechazarCon&quot; data-id=&quot;${t.id}&quot;>Rechazar</button></div></div>`).join(&quot;&quot;)}
      <div class=&quot;card&quot;>
        <div class=&quot;campo&quot;><label for=&quot;buscar&quot;>Buscar tía o tío del furgón</label><input id=&quot;buscar&quot; data-f=&quot;buscar&quot; value=&quot;${esc(app.busqueda)}&quot; placeholder=&quot;Nombre, furgón o comuna&quot; autocomplete=&quot;off&quot;></div>
        ${res === null ? `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Prueba con «Rosa», «Ñuñoa» o «Furgones». Solo aparecen quienes activaron «Que las familias me encuentren».</span>`
          : res.length ? res.map(fila).join(&quot;&quot;) : `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>No encontramos a nadie con «${esc(app.busqueda.trim())}». Pídele a tu tía o tío que active la búsqueda en su app o que te envíe un código.</span>`}
      </div>
      ${enviadas.length ? `<h3>Solicitudes enviadas</h3>${enviadas.map((t) => `<div class=&quot;card&quot;><b>${esc(t.nombre)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Esperando respuesta</span><button class=&quot;btn link&quot; data-a=&quot;retirarCon&quot; data-id=&quot;${t.id}&quot;>Retirar solicitud</button></div>`).join(&quot;&quot;)}` : &quot;&quot;}
      <h3>Conectada con</h3>
      ${tiasConectadas().map((t) => `<div class=&quot;card&quot;><b>✓ ${esc(t.nombre)}</b><span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>🚐 ${esc(t.empresa)} · ${(() => { const n = HIJOS.filter((h) => (h.tia ?? &quot;marcela&quot;) === t.id).map((h) => h.nombre); return n.length ? `lleva a ${esc(n.join(&quot; e &quot;))}` : &quot;aún no lleva a tus hijos: agrégalos con «+ Agregar hijo/a»&quot;; })()}</span></div>`).join(&quot;&quot;)}
      <p class=&quot;nota&quot;>🔒 La tía o el tío solo ve tu nombre y el de tus hijos cuando se conectan. Tu dirección la ve solo en su ruta.</p>
    </div>`;
  }

  function vHistorial() {
    return `<div class=&quot;vista&quot;>
      <h1>Historial</h1>
      <span class=&quot;muted&quot;>Cada aviso, quién lo confirmó y a qué hora llegaron tus hijos.</span>
      ${HISTORIAL.map((h, i) => `<details class=&quot;hist&quot; ${i === 0 ? &quot;open&quot; : &quot;&quot;}><summary><div class=&quot;fila&quot;><b>${esc(h.fecha)}</b>${h.ejemplo ? `<span class=&quot;ejemplo&quot;>Ejemplo</span>` : `<span class=&quot;chip ok&quot;>Hoy</span>`}</div></summary>
        <ul class=&quot;linea&quot;>${h.items.map(([t, x]) => `<li><span class=&quot;h&quot;>${t}</span><span>${esc(x)}</span></li>`).join(&quot;&quot;)}</ul></details>`).join(&quot;&quot;)}
    </div>`;
  }

  // Apariencia: automática (según el teléfono), clara u oscura.
  const temaActual = () => document.documentElement.dataset.theme === &quot;dark&quot; ? &quot;oscuro&quot; : document.documentElement.dataset.theme === &quot;light&quot; ? &quot;claro&quot; : &quot;sistema&quot;;
  function cambiarTema(v) {
    if (v === &quot;sistema&quot;) delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = v === &quot;oscuro&quot; ? &quot;dark&quot; : &quot;light&quot;;
  }
  function vPerfil() {
    return `<div class=&quot;vista&quot;>
      <div style=&quot;display:flex; gap:14px; align-items:center&quot;><div class=&quot;avatar&quot;>${AP.ini}</div><div style=&quot;min-width:0&quot;><h1>${AP.nombre}</h1><span class=&quot;muted&quot;>${AP.rol === &quot;mamá&quot; ? &quot;Apoderada&quot; : &quot;Apoderado&quot;} de ${hijosVisibles().map((h) => h.nombre).join(&quot; e &quot;)}</span></div></div>
      <div class=&quot;card&quot;><h3>Mis datos</h3>
        <div class=&quot;dato&quot;><span>Teléfono</span><span class=&quot;mono&quot;>${AP.tel}</span></div>
        <div class=&quot;dato&quot;><span>Correo</span><span>${AP.email}</span></div>
      </div>
      <div class=&quot;card&quot;><div class=&quot;fila&quot;><h3>👨‍👩‍👧 Familia</h3><button class=&quot;btn link&quot; data-a=&quot;familia&quot;>${FAMILIA.unido ? &quot;Ver ›&quot; : &quot;Compartir ›&quot;}</button></div>
        <div class=&quot;dato&quot;><span>👤 Tú</span><span class=&quot;muted&quot;>${AP.rol}</span></div>
        ${FAMILIA.unido ? `<div class=&quot;dato&quot;><span>👥 ${otroPadre().nombre}</span><span class=&quot;muted&quot;>${otroPadre().rol} · recibe los avisos</span></div>`
          : `<span class=&quot;muted&quot; style=&quot;font-size:13px&quot;>Comparte a tus hijos con el papá para que él también reciba la alarma y siga el furgón.</span>`}
      </div>
      <div class=&quot;card&quot;><div class=&quot;fila&quot;><h3>Mis tías y tíos</h3><button class=&quot;btn link&quot; data-a=&quot;conectar&quot;>Conectar ›</button></div>
        ${tiasConectadas().map((t) => `<div class=&quot;dato&quot;><span>✓ ${esc(t.nombre)}</span><span class=&quot;muted&quot;>${esc(t.empresa)}</span></div>`).join(&quot;&quot;)}

  // ---------- Seguimiento en vivo (mapa tipo Uber) ----------
  const cam = { x: null, y: null, s: null };
  const aMundo = (p) => ({ x: (p.lng + 70.62) * mLng, y: (-33.40 - p.lat) * mLat });
  function dSuave() {
    // Posición interpolada entre pasos de la simulación, para que el furgón se deslice.
    if (!R || R.fin || R.detenidoHasta !== null || !app.corriendo || (R.llamada &amp;&amp; R.llamada.fase === &quot;sonando&quot;)) return R ? R.d : 0;
    const obj = R.paradas.find((p) => p.estado === &quot;pendiente&quot; &amp;&amp; p.dRuta >= R.d - 1);
    return Math.min(obj ? obj.dRuta : R.largo, R.d + acc * CFG.kmh / 3.6);
  }
  function rumboEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1; if (i >= R.ruta.length) i = R.ruta.length - 1;
    const a = R.ruta[i - 1], b = R.ruta[i];
    return Math.atan2((b.lng - a.lng) * mLng, (b.lat - a.lat) * mLat) * 180 / Math.PI;
  }
  function tramo(d0, d1) {
    const pts = [puntoEn(d0)];
    R.acum.forEach((a, i) => { if (a > d0 &amp;&amp; a < d1) pts.push(R.ruta[i]); });
    pts.push(puntoEn(d1));
    return pts;
  }
  const zonaDe = (pt) => ({ lat: Math.round(pt.lat * 100) / 100, lng: Math.round(pt.lng * 100) / 100 });

  function vSeguir() {
