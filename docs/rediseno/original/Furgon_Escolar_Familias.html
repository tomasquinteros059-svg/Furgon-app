<title>Furgón Escolar Familias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una barra fina para elegir rol arriba y, debajo, el teléfono con la app (pantalla completa en celulares) */
:root {
  --fondo: #FFFFFF; --superficie: #FFFFFF; --superficie2: #F3F4F6; --borde: #E3E5E8;
  --texto: #14181F; --suave: #5F6672; --amarillo: #F5B700; --sobreAmarillo: #1F1A00; --amarilloSuave: #FFF7DB;
  --marino: #1E3A5F; --verde: #1E8E3E; --rojo: #D93025; --mesa: #E9EAEE; --calle: #DADDE3; --manzana: #F4F5F7;
  --ui: "Inter", "Roboto", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #0E1116; --superficie: #161A21; --superficie2: #1E232B; --borde: #2A313B;
  --texto: #F3F4F6; --suave: #9AA3AE; --amarillo: #F7C21A; --sobreAmarillo: #1A1500; --amarilloSuave: #2E2810;
  --marino: #8DB8E6; --verde: #4DC47F; --rojo: #FF6B5E; --mesa: #07090C; --calle: #2A313B; --manzana: #1A1F27; color-scheme: dark } }
:root[data-theme="dark"] {
  --fondo: #0E1116; --superficie: #161A21; --superficie2: #1E232B; --borde: #2A313B;
  --texto: #F3F4F6; --suave: #9AA3AE; --amarillo: #F7C21A; --sobreAmarillo: #1A1500; --amarilloSuave: #2E2810;
  --marino: #8DB8E6; --verde: #4DC47F; --rojo: #FF6B5E; --mesa: #07090C; --calle: #2A313B; --manzana: #1A1F27; color-scheme: dark }
body { background: var(--mesa); color: var(--texto); font-family: var(--ui); font-size: 15px; margin: 0; padding: 0 16px; }
.mesa { max-width: 440px; margin: 0 auto; padding-block: 14px 24px; display: grid; gap: 12px; }
.rol { display: flex; gap: 6px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 12px; padding: 4px; }
.rol button { flex: 1; border: 0; background: transparent; color: var(--suave); font: 700 14px var(--ui); padding: 10px; border-radius: 9px; cursor: pointer; }
.rol button[aria-pressed="true"] { background: var(--amarillo); color: var(--sobreAmarillo); }
.nota { color: var(--suave); font-size: 12.5px; text-align: center; margin: 0; }
.telefono { background: var(--fondo); border: 1px solid var(--borde); border-radius: 28px; overflow: hidden; height: min(820px, calc(100vh - 120px)); min-height: 560px; display: flex; flex-direction: column; position: relative; box-shadow: 0 20px 50px -20px rgba(0,0,0,.35); }
@media (max-width: 480px) { body { padding: 0; } .mesa { padding: 0; gap: 0; } .nota { display: none; } .telefono { border-radius: 0; border: 0; height: 100vh; box-shadow: none; } }
.pantalla { flex: 1; overflow-y: auto; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.pantalla > * { flex-shrink: 0; }
.encabezado { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 2px; }
h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 17px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
p { margin: 0; }
.suave { color: var(--suave); font-size: 14px; }
.etiqueta { font-weight: 600; font-size: 14px; margin-top: 4px; }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.tarjeta.verde { border: 2px solid var(--verde); } .tarjeta.amarilla { border: 2px solid var(--amarillo); } .tarjeta.roja { border: 2px solid var(--rojo); }
.aviso { background: var(--superficie2); border-left: 4px solid var(--marino); border-radius: 10px; padding: 12px 36px 12px 14px; position: relative; font-size: 14.5px; line-height: 1.45; }
.aviso.exito { border-color: var(--verde); } .aviso.error { border-color: var(--rojo); }
.cerrar-aviso { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; color: var(--suave); font-size: 18px; cursor: pointer; width: 28px; height: 28px; }
.btn { border: 1px solid transparent; border-radius: 12px; min-height: 46px; padding: 0 14px; font: 700 15px var(--ui); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--amarillo); color: var(--sobreAmarillo); width: 100%; }
.btn.sec { background: var(--superficie); color: var(--texto); border-color: var(--borde); }
.btn.exito { background: var(--verde); color: #fff; } .btn.peligro { background: var(--rojo); color: #fff; }
.btn.texto { background: transparent; color: var(--marino); min-height: 36px; }
.btn.grande { min-height: 56px; font-size: 17px; }
.btn.chico { width: auto; min-height: 38px; padding: 0 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--amarillo); outline-offset: 2px; }
.fila { display: flex; gap: 8px; align-items: center; }
.fila > .btn { flex: 1; }
.fila > .btn.chico { flex: none; min-width: 44px; }
.lista-item { padding: 8px 0; border-bottom: 1px solid var(--borde); display: flex; flex-direction: column; gap: 6px; }
.lista-item:last-child { border-bottom: 0; }
.tachado { color: var(--suave); text-decoration: line-through; }
.ico { width: 20px; height: 20px; display: inline-block; flex: none; vertical-align: middle; }
.ico svg { display: block; }
.barra { display: flex; border-top: 1px solid var(--borde); background: var(--superficie); padding: 6px 0 8px; }
.barra button { flex: 1; border: 0; background: transparent; color: var(--suave); font: 500 11px var(--ui); display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; position: relative; }
.barra button .ico { width: 24px; height: 24px; }
.barra button[aria-selected="true"] { color: var(--texto); font-weight: 700; }
.barra button:not([aria-selected="true"]) .ico svg [style*="amarillo"] { fill: transparent !important; }
.punto { position: absolute; top: 2px; left: calc(50% + 6px); width: 9px; height: 9px; border-radius: 50%; background: var(--rojo); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--amarillo); color: var(--sobreAmarillo); display: grid; place-items: center; font-weight: 800; font-size: 14px; border: 0; cursor: pointer; overflow: hidden; padding: 0; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar.grande { width: 120px; height: 120px; font-size: 44px; cursor: default; }
.puntos { border: 0; background: transparent; color: var(--texto); font: 900 26px var(--ui); cursor: pointer; padding: 0 8px; position: relative; line-height: 1; }
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo label { font-weight: 600; font-size: 14px; }
.campo input, .campo textarea, .campo select { background: var(--superficie); color: var(--texto); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; font: 400 15px var(--ui); }
.campo small { color: var(--suave); font-size: 12.5px; }
.interruptor { appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--borde); position: relative; cursor: pointer; flex: none; transition: background .2s; }
.interruptor::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.interruptor:checked { background: var(--rojo); } .interruptor.verde:checked { background: var(--verde); }
.interruptor:checked::after { transform: translateX(18px); }
.capa { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 60px 12px 12px; z-index: 5; }
.hoja { background: var(--fondo); border-radius: 16px; width: 100%; max-height: 100%; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.segmento { display: flex; border: 1px solid var(--borde); border-radius: 12px; padding: 3px; gap: 3px; background: var(--superficie2); }
.segmento button { flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--suave); font: 700 14px var(--ui); cursor: pointer; }
.segmento button[aria-pressed="true"] { background: var(--amarillo); color: var(--sobreAmarillo); }
.toast { position: absolute; left: 12px; right: 12px; bottom: 80px; background: var(--texto); color: var(--fondo); border-radius: 12px; padding: 12px 14px; font-weight: 600; z-index: 9; font-size: 14px; }
.mapa { flex: none; width: 100%; border-radius: 14px; border: 1px solid var(--borde); background: var(--manzana); display: block; aspect-ratio: 3 / 2; }
.alarma { background: var(--amarillo); color: var(--sobreAmarillo); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; font-weight: 700; animation: latido 1s ease-in-out infinite alternate; }
@keyframes latido { from { transform: scale(1); } to { transform: scale(1.015); } }
@media (prefers-reduced-motion: reduce) { .alarma { animation: none; } }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--superficie2); color: var(--suave); }
.chip.ok { background: color-mix(in srgb, var(--verde) 18%, transparent); color: var(--verde); }
.chip.no { background: color-mix(in srgb, var(--rojo) 16%, transparent); color: var(--rojo); }
.chip.ya { background: var(--amarilloSuave); color: var(--texto); }
.num { font-variant-numeric: tabular-nums; }
.oculto { display: none !important; }
</style>

<div class="mesa">
  <div class="rol oculto" role="group" aria-label="Ver la app como">
    <button id="ver-tia" type="button" aria-pressed="false">Ver como tía</button>
    <button id="ver-familia" type="button" aria-pressed="true">Ver como familia</button>
  </div>
  <p class="nota">App para mamás y papás · versión de prueba con datos de ejemplo.</p>
  <div class="telefono" id="telefono">
    <main class="pantalla" id="pantalla"></main>
    <nav class="barra" id="barra" role="tablist"></nav>
  </div>
</div>

const ico = (n) => `<span class="ico">${ICONOS[n] || ""}</span>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const alumno = (id) => S.alumnos.find((a) => a.id === id);
const ruta = (id) => S.rutas.find((r) => r.id === id);
const noVa = (id, tipo) => !!S.noVa[`${id}:${tipo}`];
const pesos = (n) => new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 }).format(n);

function avisar(txt) { S.toast = txt; pintar(); clearTimeout(avisar.t); avisar.t = setTimeout(() => { S.toast = null; pintar(); }, 2600); }

// ---------- Simulación del recorrido (el furgón avanza solo) ----------
function puntosRuta(r) {
  const casas = []; const vistas = new Set();
  for (const id of r.orden) {
    const a = alumno(id); const k = `${a.x},${a.y}`;
    if (noVa(id, r.tipo) || vistas.has(k)) continue; vistas.add(k); casas.push({ x: a.x, y: a.y, ids: r.orden.filter((o) => { const b = alumno(o); return b.x === a.x && b.y === a.y; }) });
  }
  const col = { x: S.colegio.x, y: S.colegio.y, ids: [] };
  return r.tipo === "ida" ? [{ x: 20, y: 180, ids: [] }, ...casas, col] : [col, ...casas];
}
function largo(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return L; }
function puntoEn(pts, f) {
  let d = largo(pts) * f;
  for (let i = 1; i < pts.length; i++) {
    const s = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (d <= s) return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * (d / s), y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * (d / s) };
    d -= s;
  }
  return pts[pts.length - 1];
}
// Minutos que faltan para llegar a una casa (la ruta completa dura ~25 min en esta demo).
function etaMin(idAlumno) {
  const r = S.recorrido && ruta(S.recorrido.rutaId); if (!r) return null;
  const pts = puntosRuta(r); const L = largo(pts); let acum = 0;
  for (let i = 1; i < pts.length; i++) {
    acum += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    if (pts[i].ids.includes(idAlumno)) return Math.max(0, Math.round((acum / L - S.recorrido.progreso) * 25));
  }
  return null;
}
function iniciar(rutaId) {
  const r = ruta(rutaId);
  if (!r.orden.length) return avisar("Esta ruta aún no tiene alumnos.");
  const estados = {}; for (const id of r.orden) estados[id] = noVa(id, r.tipo) ? "no_viaja" : "pendiente";
  S.recorrido = { rutaId, progreso: 0, estados, avisado: {}, confirmado: {} };
  if (S.rol === "tia") S.vista.tia = "recorrido"; S.menu = false;
  clearInterval(iniciar.t);
  iniciar.t = setInterval(() => {
    const rec = S.recorrido; if (!rec) return clearInterval(iniciar.t);
    rec.progreso = Math.min(1, rec.progreso + 0.004);
    const rr = ruta(rec.rutaId);
    for (const id of rr.orden) {
      const m = etaMin(id);
      if (m !== null && m <= (S.minutosAviso[id] ?? 5) && rec.estados[id] === "pendiente") rec.avisado[id] = true;
      if (m === 0 && rec.estados[id] === "pendiente") rec.estados[id] = "entregado";
    }
    pintar(true);
  }, 250);
  pintar();
}
function terminar() { clearInterval(iniciar.t); S.recorrido = null; S.vista.tia = "inicio"; avisar("Recorrido terminado. ¡Buen trabajo!"); }

function mapaSVG(r, vanEnFamilia) {
  const pts = puntosRuta(r); const van = S.recorrido ? puntoEn(pts, S.recorrido.progreso) : pts[0];
  const calles = [30, 80, 130, 180].map((y) => `<line x1="0" y1="${y}" x2="300" y2="${y}" stroke="var(--calle)" stroke-width="7"/>`).join("")
    + [40, 100, 160, 220, 280].map((x) => `<line x1="${x}" y1="0" x2="${x}" y2="200" stroke="var(--calle)" stroke-width="7"/>`).join("");
  const linea = `<polyline points="${pts.map((p) => `${p.x},${p.y}`).join(" ")}" fill="none" stroke="var(--marino)" stroke-width="3" stroke-dasharray="5 4" opacity=".7"/>`;
  let n = 0;
  const casas = pts.filter((p) => p.ids.length).map((p) => {
    n++; const mia = vanEnFamilia ? p.ids.some((id) => alumno(id).familia === "familia") : true;
    if (vanEnFamilia && !mia) return ""; // privacidad: la familia no ve las casas de otros niños
    const listo = p.ids.every((id) => S.recorrido && S.recorrido.estados[id] !== "pendiente");
    return `<g><circle cx="${p.x}" cy="${p.y}" r="10" fill="${listo ? "var(--verde)" : "var(--marino)"}" stroke="#fff" stroke-width="2.5"/><text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">${vanEnFamilia ? "⌂" : n}</text></g>`;
  }).join("");
  const col = `<g><rect x="${S.colegio.x - 11}" y="${S.colegio.y - 11}" width="22" height="22" rx="5" fill="var(--amarillo)" stroke="#fff" stroke-width="2"/><text x="${S.colegio.x}" y="${S.colegio.y + 4}" text-anchor="middle" font-size="11" font-weight="800" fill="var(--sobreAmarillo)">C</text></g>`;
  const furgon = `<g transform="translate(${van.x - 13},${van.y - 9})"><rect width="26" height="16" rx="4" fill="#F5B700" stroke="#1F1A00" stroke-width="1.5"/><rect x="3" y="3" width="6" height="5" rx="1" fill="#BFE3F5"/><rect x="11" y="3" width="6" height="5" rx="1" fill="#BFE3F5"/><circle cx="6" cy="16" r="3" fill="#15202B"/><circle cx="20" cy="16" r="3" fill="#15202B"/></g>`;
  return `<svg class="mapa" viewBox="0 0 300 200" role="img" aria-label="Mapa del recorrido">${calles}${vanEnFamilia ? "" : linea}${casas}${col}${furgon}</svg>`;
}

// ---------- Piezas comunes ----------
function avatar(quien, grande) {
  const p = S.perfil[quien]; const ini = p.nombre.trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join("").toUpperCase();
  return `<button type="button" class="avatar${grande ? " grande" : ""}" data-accion="perfil" aria-label="Mi perfil">${p.foto ? `<img src="${p.foto}" alt="">` : esc(ini)}</button>`;
}
function encabezado(titulo, derecha) { return `<div class="encabezado"><h1>${esc(titulo)}</h1><div class="fila">${derecha || ""}</div></div>`; }
function volver(destino) { return `<button type="button" class="btn texto chico" data-ir="${destino}">Volver</button>`; }

// ---------- Pantallas de la tía ----------
function tiaInicio() {
  const conRec = S.recorrido;
  let h = encabezado(`Hola, ${S.perfil.tia.nombre.split(" ")[0]}`, avatar("tia") + `<button type="button" class="puntos" data-accion="menu" aria-label="Más opciones">⋮</button>`);
  if (!S.consejosCerrados) h += `<div class="aviso">Inicia el recorrido antes de partir. Los avisos a los apoderados se envían solos: no necesitas tocar el teléfono mientras manejas.<br><br>${ico("gps")} Tu celular es el GPS del furgón: mantenlo con batería, con la ubicación activada y en su soporte.<button class="cerrar-aviso" data-accion="cerrar-consejos" aria-label="Cerrar aviso">✕</button></div>`;
  if (!S.nuevosCerrados) h += `<div class="tarjeta verde"><div class="encabezado"><h2>🆕 Se sumaron a tus rutas</h2><button class="cerrar-aviso" style="position:static" data-accion="cerrar-nuevos" aria-label="Cerrar aviso">✕</button></div>
    <p>${ico("ida")} <b>Isidora Rojas</b> · Mañana, parada 4</p><p>${ico("casa")} <b>Isidora Rojas</b> · Tarde, parada 1</p>
    <p class="suave">Quedaron donde menos alargan el recorrido. Su familia ya recibe los avisos.</p></div>`;
  if (S.recomendacion && S.recomendacion.ok) h += `<div class="aviso exito">${esc(S.recomendacion.ok)}</div>`;
  for (const r of S.rutas) {
    const van = r.orden.filter((id) => !noVa(id, r.tipo));
    const activa = conRec && conRec.rutaId === r.id;
    h += `<div class="tarjeta ${activa ? "verde" : ""}"><h2>${ico(r.tipo === "ida" ? "ida" : "casa")} ${esc(r.nombre)}</h2>
      <p class="suave">${r.tipo === "ida" ? "Casa → colegio" : "Colegio → casa"}${r.hora ? ` · ${r.hora}` : ""} · ${S.colegio.nombre}</p>
      <p class="etiqueta">${r.tipo === "ida" ? "A buscar hoy" : "A dejar hoy"} (${van.length})</p>
      ${r.orden.length ? r.orden.map((id, i) => { const a = alumno(id); const nv = noVa(id, r.tipo);
        return `<div class="lista-item"><b class="${nv ? "tachado" : ""}">${i + 1}. ${esc(a.nombre)}</b><span class="suave">${nv ? "Hoy no viaja" : esc(a.dir)}</span></div>`; }).join("") : `<p class="suave">Esta ruta aún no tiene alumnos.</p>`}
      ${van.length ? `<a class="btn sec" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent("Ñuñoa, Santiago")}">${ico("mapa")} Ver la ruta en Google Maps</a>` : ""}
      ${!activa && r.orden.length >= 2 ? recomendacionHTML(r) : ""}
      ${activa ? `<button class="btn exito grande" data-ir="recorrido">Continuar recorrido en curso</button>` : `<button class="btn grande" data-iniciar="${r.id}" ${conRec ? "disabled" : ""}>Iniciar recorrido</button>`}
    </div>`;
  }
  return h;
}
function recomendacionHTML(r) {
  const rec = S.recomendacion && S.recomendacion.rutaId === r.id ? S.recomendacion : null;
  if (!rec) return `<button class="btn sec" data-recomendar="${r.id}">${ico("brujula")} Calcular la mejor ruta</button>`;
  if (!rec.cambia) return `<div class="tarjeta amarilla"><p>👍 El orden actual ya es el más corto (≈ ${rec.km} km).</p><button class="btn texto" data-accion="descartar">Cerrar</button></div>`;
  return `<div class="tarjeta amarilla"><b>✨ Ruta recomendada: ${rec.km} km (antes ${rec.antes} km)</b><p class="suave">Ahorras ${(rec.antes - rec.km).toFixed(1)} km por recorrido. Calculada por calles con Google Maps.</p>
    ${rec.orden.map((id, i) => `<p>${i + 1}. ${esc(alumno(id).nombre)}</p>`).join("")}
    <div class="fila"><button class="btn exito" data-aplicar="${r.id}">Aplicar</button><button class="btn sec" data-accion="descartar">Descartar</button></div></div>`;
}
function recomendar(id) {
  const r = ruta(id);
  // Orden de vecino más cercano, partiendo del extremo opuesto al colegio (como hace el servidor).
  const pend = [...r.orden]; const orden = []; let pos = r.tipo === "ida" ? { x: 20, y: 180 } : S.colegio;
  while (pend.length) { pend.sort((a, b) => Math.hypot(alumno(a).x - pos.x, alumno(a).y - pos.y) - Math.hypot(alumno(b).x - pos.x, alumno(b).y - pos.y)); const s = pend.shift(); orden.push(s); pos = alumno(s); }
  const km = (o) => +(largo([r.tipo === "ida" ? { x: 20, y: 180 } : S.colegio, ...o.map(alumno), ...(r.tipo === "ida" ? [S.colegio] : [])]) / 40).toFixed(1);
  S.recomendacion = { rutaId: id, orden, km: km(orden), antes: km(r.orden), cambia: orden.join() !== r.orden.join() };
}

function pintar(soloVivo) {
  const v = S.vista[S.rol];
  // Mientras el furgón avanza solo se redibujan las pantallas que lo muestran (no se pierde lo que escribes).
  if (soloVivo && !((S.rol === "tia" && v === "recorrido") || (S.rol === "familia" && (v === "inicio" || v === "seguir")) || (S.rol === "tia" && v === "inicio"))) return;
  if (soloVivo && document.activeElement && document.activeElement.matches("input, textarea")) return;
  const pantallas = S.rol === "tia"
    ? { inicio: tiaInicio, recorrido: tiaRecorrido, alumnos: tiaAlumnos, rutas: tiaRutas, mensajes: tiaMensajes, perfil: () => perfil("tia"), cobros: () => tiaSimple("cobros"), licencia: () => tiaSimple("licencia"), conexiones: () => tiaSimple("conexiones") }
    : { inicio: famInicio, seguir: famSeguir, pagos: famPagos, mensajes: famMensajes, familia: famFamilia, furgon: famFurgon, perfil: () => perfil("familia") };
  const el = document.getElementById("pantalla");
  // Pantalla nueva: parte arriba. Misma pantalla redibujada: se queda donde estaba.
  const clave = S.rol + ":" + v; const y = clave === pintar.ultima ? el.scrollTop : 0; pintar.ultima = clave;
  el.innerHTML = (pantallas[v] || pantallas.inicio)() + (S.rol === "tia" && S.menu ? menuHTML() : "") + (S.confirmar ? confirmarHTML() : "") + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  el.scrollTop = y;
  const sinBarra = (S.rol === "tia" && v === "recorrido") || (S.rol === "familia" && v === "seguir");
  const barra = document.getElementById("barra");
  barra.classList.toggle("oculto", sinBarra);
  barra.innerHTML = PESTANAS[S.rol].map(([id, nombre, icono]) => `<button type="button" role="tab" aria-selected="${v === id}" data-ir="${id}">${ico(icono)}${nombre}${id === "mensajes" && S.rol === "tia" && S.mensajes.some((m) => !m.respuesta) ? `<span class="punto"></span>` : ""}</button>`).join("");
  document.getElementById("ver-tia").setAttribute("aria-pressed", S.rol === "tia");
  document.getElementById("ver-familia").setAttribute("aria-pressed", S.rol === "familia");
}

  else if (d.recomendar) recomendar(d.recomendar);
  else if (d.aplicar) { ruta(d.aplicar).orden = S.recomendacion.orden; S.recomendacion = { ok: `Listo: ${ruta(d.aplicar).nombre} quedó con el orden recomendado.` }; }
  else if (d.marcar) { const [id, est] = d.marcar.split(":"); S.recorrido.estados[id] = est; }
  else if (d.mover) { const [rid, id, dl] = d.mover.split(":"); const o = ruta(rid).orden; const i = o.indexOf(id); const j = i + Number(dl); [o[i], o[j]] = [o[j], o[i]]; }
  else if (d.quitar) { const [rid, id] = d.quitar.split(":"); const r = ruta(rid); r.orden = r.orden.filter((x) => x !== id); }
  else if (d.agregar) { const [rid, id] = d.agregar.split(":"); ruta(rid).orden.push(id); avisar(`${alumno(id).nombre} quedó en la ruta.`); }
  else if (d.eliminarRuta) { const r = ruta(d.eliminarRuta); S.confirmar = { titulo: `¿Eliminar la ruta «${r.nombre}»?`, texto: "Los alumnos siguen registrados; solo se quitan de esta ruta.", rutaId: r.id }; }
  else if (d.responder) { const m = S.mensajes.find((x) => x.id == d.responder); const v = document.getElementById(`resp-${m.id}`).value.trim(); if (!v) return avisar("Escribe tu respuesta."); m.respuesta = v; avisar("Respuesta enviada a la familia."); }
  else if (d.tema) { S.tema = d.tema; if (d.tema === "sistema") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", d.tema === "oscuro" ? "dark" : "light"); }
  else if (d.confirmar) { S.recorrido.confirmado[d.confirmar] = true; avisar("Listo: la tía sabe que estás atento/a."); }
  else if (d.minutos) { const o = [3, 5, 7, 10, 15]; const a = d.minutos; S.minutosAviso[a] = o[(o.indexOf(S.minutosAviso[a]) + 1) % o.length]; }
  else if (d.pagar) { S.pagos[d.pagar].pagado = true; avisar("Le avisamos a la tía que pagaste."); }
  else if (d.quitarFoto) { S.perfil[d.quitarFoto].foto = null; avisar("Foto quitada."); }
  else if (d.guardarPerfil) {
    const p = S.perfil[d.guardarPerfil]; const n = document.getElementById("pf-nombre").value.trim();
    if (n.length < 2) return avisar("Escribe tu nombre.");
    p.nombre = n; p.tel = document.getElementById("pf-tel").value.trim();
    if (d.guardarPerfil === "tia") { p.comunas = document.getElementById("pf-comunas").value.trim(); p.presentacion = document.getElementById("pf-pres").value.trim(); p.visible = document.getElementById("pf-visible").checked; }
    return avisar("Datos guardados.");
  }
  else if (d.novahoy) {
    if (b.type === "checkbox") { S.noVa[d.novahoy] = b.checked; return avisar(b.checked ? "Listo: la tía ya sabe que hoy no viaja." : "Listo: sí viaja."); }
    S.noVa[d.novahoy] = !S.noVa[d.novahoy];
  }
  else switch (d.accion) {
    case "menu": S.menu = true; break;
    case "cerrar-menu": if (e.target.closest("[data-dentro]") && !e.target.closest("[data-accion='cerrar-menu'].btn")) return; S.menu = false; break;
    case "perfil": S.vista[S.rol] = "perfil"; break;
    case "cerrar-consejos": S.consejosCerrados = true; break;
    case "cerrar-nuevos": S.nuevosCerrados = true; break;
    case "mostrar-avisos": S.consejosCerrados = false; S.nuevosCerrados = false; S.menu = false; break;
    case "descartar": S.recomendacion = null; break;
    case "terminar": terminar(); return;
    case "nueva-ruta": S.creandoRuta = true; break;
    case "cancelar-ruta": S.creandoRuta = false; break;
    case "crear-ruta": {
      const n = document.getElementById("nr-nombre").value.trim(); const hora = document.getElementById("nr-hora").value.trim();
      if (!n) return avisar("Ponle un nombre a la ruta.");
      if (hora && !/^([01]?\d|2[0-3]):[0-5]\d$/.test(hora)) return avisar("La hora va como 07:30.");
      S.rutas.push({ id: "r" + Date.now(), nombre: n, tipo: document.getElementById("nr-vuelta").getAttribute("aria-pressed") === "true" ? "vuelta" : "ida", hora, orden: [] });
      S.creandoRuta = false; avisar(`Ruta «${n}» creada. Agrégale alumnos abajo.`); return;
    }
    case "si-confirmar": S.rutas = S.rutas.filter((r) => r.id !== S.confirmar.rutaId); S.confirmar = null; avisar("Ruta eliminada."); return;
    case "no-confirmar": S.confirmar = null; break;
    case "enviar-msg": { const v = document.getElementById("msg-nuevo").value.trim(); if (!v) return avisar("Escribe tu mensaje."); const m = { id: Date.now(), de: "Familia Demo", texto: v, respuesta: null }; S.mensajes.unshift(m); avisar("Mensaje enviado a la tía."); setTimeout(() => { m.respuesta = "¡Recibido! Gracias por avisar 😊"; pintar(); }, 4000); return; }
    case "salir": S.menu = false; avisar("En la app real, aquí se cierra la sesión."); return;
    case "aceptar": avisar("Familia conectada."); break;
    case "rechazar": avisar("Solicitud rechazada."); break;
    case "toast-nuevo": avisar("En la app real se registra con nombre y dirección exacta."); return;
    case "toast-licencia": avisar("En la app real se toma la foto del frente y del reverso."); return;
  }
  pintar();
});
document.getElementById("telefono").addEventListener("click", (e) => {
  const seg = e.target.closest("#nr-ida, #nr-vuelta"); if (!seg) return;
  document.getElementById("nr-ida").setAttribute("aria-pressed", seg.id === "nr-ida");
  document.getElementById("nr-vuelta").setAttribute("aria-pressed", seg.id === "nr-vuelta");
});
document.getElementById("telefono").addEventListener("change", (e) => {
  const f = e.target.closest("[data-foto]"); if (!f || !f.files[0]) return;
  const lector = new FileReader();
  lector.onload = () => { S.perfil[f.dataset.foto].foto = lector.result; avisar("Foto lista. Toca «Guardar» para dejarla."); };
  lector.readAsDataURL(f.files[0]);
});
pintar();
</script>
