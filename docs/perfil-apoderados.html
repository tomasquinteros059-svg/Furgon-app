<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furgón Escolar · Apoderados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* App de los padres: una columna móvil, tarjeta por hijo con su estado en vivo, alarma y llamada a pantalla completa. */
:root {
  --bg: #F3F4F6; --app: #FFFFFF; --surface: #FFFFFF; --surface-2: #F3F4F6;
  --ink: #14181F; --muted: #5F6672; --line: #E3E5E8; --road: #D6D9DE; --block: #EEF0F2;
  --bus: #F5B700; --bus-ink: #1F1A00; --bus-soft: #FFF7DB;
  --navy: #1E3A5F; --navy-ink: #FFFFFF;
  --ok: #1E8E3E; --ok-soft: #E6F4EA; --alert: #D93025; --alert-soft: #FCE8E6;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
    --line: #2B3743; --road: #3A4754; --block: #222D37; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
    --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07090C; --app: #0E1116; --surface: #161A21; --surface-2: #1E232B; --ink: #F3F4F6; --muted: #9AA3AE;
  --line: #2A313B; --road: #3A414C; --block: #1A1F27; --bus: #F7C21A; --bus-ink: #1A1500; --bus-soft: #2E2810;
  --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.telefono { width: min(410px, 100%); height: min(860px, calc(100vh - 60px)); min-height: 620px; background: var(--app); border: 10px solid var(--ink); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 520px) {
  body { padding: 0; gap: 0; }
  .rotulo { display: none; }
  .telefono { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; }
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.estado-sis { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.vista { flex: 1; overflow-y: auto; padding: 6px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; padding: 9px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.tabs button span { font-size: 20px; line-height: 1; }
.tabs button[aria-current="page"] { color: var(--ink); }
.codigo-fam { font-family: var(--font-mono); font-size: 28px; letter-spacing: .12em; text-align: center; background: var(--bus-soft); border: 2px dashed var(--bus); border-radius: 12px; padding: 10px; }
.card.invita { border: 2px solid var(--ok); text-align: left; font: inherit; color: inherit; cursor: pointer; }
.tia-res { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line); padding-top: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fila > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.alerta { background: var(--alert-soft); color: var(--alert); }
.chip.bus { background: var(--bus-soft); }
.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 16px; background: var(--bus); color: var(--bus-ink); }
.btn.bus { background: var(--bus); color: var(--bus-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.sec { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.xl { min-height: 60px; font-size: 18px; }
.btn.link { background: transparent; color: var(--navy); min-height: 0; padding: 4px 0; text-align: left; }
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-weight: 700; font-size: 14px; }
.campo input { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); width: 100%; }
.campo small { color: var(--muted); font-size: 12px; }
.campo.error input { border-color: var(--alert); }
.campo.error small { color: var(--alert); }
.dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.nota { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.estado { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.estado b { font-size: 16px; }
.estado.bus { background: var(--bus-soft); }
.estado.ok { background: var(--ok-soft); }
.estado.no { background: var(--surface-2); color: var(--muted); }
.sw-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; background: var(--road); border-radius: 999px; pointer-events: none; transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw.rojo input:checked + span { background: var(--alert); }
.sw input:checked + span::after { transform: translateX(18px); }
.mini svg, .barrio svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--surface-2); }
.barrio svg { cursor: crosshair; }
.privado { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.notif { border-radius: 10px; padding: 9px 11px; background: var(--surface-2); font-size: 14px; }
.notif b { display: block; }
.notif.alarma { background: var(--alert-soft); }
.notif.ok { background: var(--ok-soft); }
.notif small { color: var(--muted); font-family: var(--font-mono); }
.demo { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 14px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--app); }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; flex: none; }
.avatar.chico { width: 42px; height: 42px; font-size: 19px; background: var(--bus-soft); color: var(--ink); border: 1px solid var(--line); }
.dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dato:last-child { border-bottom: 0; }
.dato span:first-child { color: var(--muted); }
.dato span:last-child { text-align: right; font-weight: 700; }
.volver { border: 0; background: transparent; font-weight: 700; color: var(--navy); padding: 4px 0; align-self: flex-start; }
.ejemplo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

/* Seguimiento en vivo (mapa tipo Uber) */
.seguir { flex: 1; position: relative; overflow: hidden; background: var(--block); }
.mapa-vivo, .mapa-vivo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.arriba { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 2; gap: 8px; }
.pildora { background: var(--surface); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 7px; }
.vivo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--alert); }
.vivo-dot.aprox { background: var(--bus); }
.hoja-seg { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px 16px; box-shadow: 0 -8px 24px rgba(0,0,0,.16); display: flex; flex-direction: column; gap: 10px; }
.asa { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.eta-grande { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.pasos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pasos div { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.pasos i { height: 5px; border-radius: 3px; background: var(--line); }
.pasos i.ok { background: var(--ok); }
.pasos i.ahora { background: var(--bus); }
.conductora { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.patente { font-family: var(--font-mono); font-weight: 700; border: 2px solid var(--ink); border-radius: 6px; padding: 2px 8px; font-size: 13px; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .zona { animation: zona 2.2s ease-in-out infinite; }
  .vivo-dot { animation: pulso 1.4s ease-in-out infinite; }
}
@keyframes zona { 50% { opacity: .5; } }

/* Alarma y llamada */
.banner { position: absolute; left: 8px; right: 8px; top: 30px; z-index: 8; border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 3px solid var(--alert); box-shadow: 0 12px 30px rgba(0,0,0,.3); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.banner.ok { border-color: var(--ok); }
.banner .app-n { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.banner b { font-size: 16px; }
.llamada { position: absolute; inset: 0; z-index: 9; background: #0F2236; color: #fff; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; padding: 44px 20px 34px; gap: 16px; }
.llamada.tel { background: #1B1F24; }
.llamada .quien { font-family: var(--font-display); font-size: 34px; }
.llamada .voz { background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.teclas { display: flex; gap: 26px; justify-content: center; }
.tecla { width: 80px; height: 80px; border-radius: 50%; border: 0; font-weight: 700; color: #fff; }
.tecla.uno { background: #1D7F45; font-size: 30px; }
.tecla.colgar { background: #C4281C; font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  .banner { animation: baja .3s ease-out; }
  .banner.vibra { animation: baja .3s ease-out, vibra .45s linear .3s 4; }
  .llamada .quien { animation: pulso 1.4s ease-in-out infinite; }
}
@keyframes baja { from { transform: translateY(-130%); } to { transform: none; } }
@keyframes vibra { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pulso { 50% { opacity: .6; } }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
details.hist summary { cursor: pointer; list-style: none; }
details.hist summary::-webkit-details-marker { display: none; }
ul.linea { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
ul.linea li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; }
ul.linea .h { font-family: var(--font-mono); color: var(--muted); font-size: 12px; padding-top: 2px; }
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.22em; flex-shrink: 0; display: inline-block; overflow: visible; }
.btn .ico, .chip.bus .ico, .btn.ok .ico, .grandes .ok .ico, .grandes .no .ico, .btn.peligro .ico { --ico-acento: rgba(255, 255, 255, .38); }
.seg.tema { display: flex; padding: 3px; gap: 3px; background: var(--surface-2); border-radius: 12px; }
.seg.tema button { flex: 1; min-height: 40px; border-radius: 9px; font-size: 14px; color: var(--muted); }
.seg.tema button[aria-pressed="true"] { background: var(--bus); color: var(--bus-ink); }
.btn.sec .ico { --ico-acento: var(--bus); }
</style>
</head>

        <div class="fila"><div style="display:flex; gap:10px; align-items:center; min-width:0"><div class="avatar chico">${esc(h.nombre[0])}</div><div style="min-width:0"><h2>${esc(h.nombre)} ${esc(h.apellido)}</h2><span class="muted" style="font-size:13px">${esc(h.curso)} · ${esc(h.colegio)}</span></div></div>
          <button class="btn link" data-a="ficha" data-id="${h.id}">Ficha ›</button></div>
        ${estadoHijo(h)}
        ${verMapa ? miniMapa(p) : R && p && p.estado === "pendiente" ? `<div class="privado">🔒 Cuando ${esc(h.nombre)} se suba, toca «Ya subió» y la verás en vivo. Si no, verás el furgón desde tu aviso.</div>` : ""}
        ${R && !R.fin && p && p.estado === "pendiente" && !aBordo ? `<button class="btn bus" data-a="yaSubio" data-id="${h.id}">🙋 Ya subió ${esc(h.nombre)}</button>` : ""}
        ${R && !R.fin && p && p.estado === "pendiente" ? `<button class="btn" data-a="seguir" data-id="${h.id}">🗺️ ${aBordo ? `Seguir a ${esc(h.nombre)} en vivo` : "Seguir el furgón en vivo"}</button>` : ""}
        ${p && p.avisoT !== null && p.estado === "pendiente" && p.confT === null ? `<button class="btn ok" data-a="recibido" data-id="${h.id}">Recibido, estoy ${AP.atento}</button>` : ""}
        ${h.asignado ? `<div><span style="font-weight:700; font-size:14px">Hoy no viaja</span>
          ${["ida", "vuelta"].map((t) => {
            const bloqueado = t === "ida" || (R && p && (p.estado === "entregado" || (p.estado === "pendiente" && p.avisoT !== null && Math.abs(p.dRuta - R.d) < 2)));
            return `<div class="sw-fila"><span>${t === "ida" ? "Ida (07:00) · ya pasó" : "Vuelta (16:30)"}</span><label class="sw rojo"><input type="checkbox" data-a="noviaja" data-id="${h.id}" data-t="${t}" ${h.noViaja[t] ? "checked" : ""} ${bloqueado ? "disabled" : ""} aria-label="${esc(h.nombre)} no viaja en la ${t}"><span></span></label></div>`;
          }).join("")}</div>` : ""}
      </div>`;
    }).join("");
    return `<div class="vista">
      <div><span class="muted">Martes 7 de octubre</span><h1>Hola, ${AP.corto}</h1></div>
      ${AP.sinProteger ? `<button class="card invita" data-a="proteger" style="border-color:var(--bus)">🔒 <b>Protege tu cuenta</b><span class="muted" style="font-size:13px">Entraste con un código: agrega tu correo y una contraseña para no perderla si cambias de teléfono.</span></button>` : ""}
      ${demo}
      ${FAMILIA.unido ? `<div class="card"><div class="fila"><b>👨‍👩‍👧 Ver la app como</b></div>
          <span class="seg" role="group" aria-label="Ver la app como">${Object.values(PERSONAS).map((x) => `<button data-a="verComo" data-v="${x.id}" aria-pressed="${AP.id === x.id}">${x.corto} (${x.rol})</button>`).join("")}</span>
          <span class="muted" style="font-size:12px">Perfil compartido: los dos ven a los mismos hijos y reciben la misma alarma, cada uno en su teléfono.</span></div>`
        : AP.id === "ana" ? `<button class="card invita" data-a="familia" style="border-color:var(--bus)">👨‍👩‍👧 <b>Comparte con el papá</b><span class="muted" style="font-size:13px">Que Rodrigo también reciba la alarma, las llamadas y siga el furgón en vivo desde su teléfono.</span></button>` : ""}
      ${AP.id === "ana" && TIAS.some((t) => t.estado === "pendiente" && t.inicio === "tia") ? `<button class="card invita" data-a="conectar">🤝 <b>${esc(TIAS.find((t) => t.estado === "pendiente" && t.inicio === "tia").nombre)}</b> quiere conectarse contigo<span class="muted" style="font-size:13px">Toca para responder</span></button>` : ""}
      ${tarjetas}
      <button class="btn sec" data-a="agregar">+ Agregar hijo/a</button>
      <button class="btn sec" data-a="conectar">🤝 Conectar con tía o tío</button>
      ${app.notifs.length ? `<h3>Notificaciones</h3>${app.notifs.slice(0, 6).map((n) => `<div class="notif ${n.tipo === "aviso" ? "alarma" : n.tipo === "ok" ? "ok" : ""}"><b>${esc(n.titulo)}</b>${esc(n.cuerpo)} <small>${hora(n.t)}</small></div>`).join("")}` : ""}
    </div>`;
  }

  // Mapa de barrio estilizado para ubicar el pin.
  function barrio(pin, editable) {
    const W = 320, H = 210;
    let calles = "";
    for (let x = 18; x < W; x += 52) calles += `<rect x="${x}" y="0" width="9" height="${H}" fill="var(--road)"/>`;
    for (let y = 22; y < H; y += 46) calles += `<rect x="0" y="${y}" width="${W}" height="9" fill="var(--road)"/>`;
    const p = pin ? { x: pin.x * W, y: pin.y * H } : null;
    return `<div class="barrio"><svg viewBox="0 0 ${W} ${H}" data-a="${editable ? "pin" : ""}" role="img" aria-label="Mapa del barrio${editable ? ": toca para ubicar el pin" : ""}">
      <rect width="${W}" height="${H}" fill="var(--block)"/>${calles}
      <rect x="0" y="${H / 2 - 7}" width="${W}" height="14" fill="var(--line)" transform="rotate(-14 ${W / 2} ${H / 2})"/>
      ${p ? `<g transform="translate(${p.x} ${p.y})"><path d="M0 0 C -12 -16 -14 -22 -14 -28 A 14 14 0 1 1 14 -28 C 14 -22 12 -16 0 0 Z" fill="var(--alert)" stroke="var(--surface)" stroke-width="2"/><circle cx="0" cy="-28" r="5" fill="var(--surface)"/></g>` : ""}
      ${editable ? `<text x="8" y="${H - 8}" font-size="12" fill="var(--ink)" font-family="var(--font-body)" font-weight="700">Toca la puerta de tu casa</text>` : ""}
    </svg></div>`;
  }
  const coordsDe = (pin) => pin ? `${(-33.452 + (0.5 - pin.y) * 0.004).toFixed(5)}, ${(-70.558 + (pin.x - 0.5) * 0.006).toFixed(5)}` : "—";

  function vFicha() {
    const h = HIJOS.find((x) => x.id === app.hijoId);
    return `<div class="vista">
      <button class="volver" data-a="atras">‹ Volver</button>
      <div style="display:flex; gap:12px; align-items:center"><div class="avatar">${esc(h.nombre[0])}</div><div style="min-width:0"><h1>${esc(h.nombre)} ${esc(h.apellido)}</h1><span class="muted">${esc(h.curso)} · ${esc(h.colegio)}</span></div></div>
      <div class="card"><div class="fila"><h3>Dirección</h3><button class="btn link" data-a="editPin">${app.editPin ? "Listo" : "Ajustar pin"}</button></div>
        <span>${esc(h.direccion)}</span>
        ${barrio(h.pin, app.editPin)}
        <span class="muted mono" style="font-size:12px">Pin: ${coordsDe(h.pin)}</span>
        <div class="dato"><span>Indicaciones</span><span>${esc(h.indic)}</span></div>
        <p class="nota" style="margin:0">El aviso se calcula hasta este pin. Ubícalo justo en la puerta para que llegue a tiempo.</p>
      </div>
      <div class="card"><h3>Avisarme antes de que llegue</h3>
        <span class="seg" role="group" aria-label="Minutos de anticipación">${[3, 5, 7, 10].map((m) => `<button data-a="minutos" data-v="${m}" aria-pressed="${h.minutos === m}">${m} min</button>`).join("")}</span>
        <span class="muted" style="font-size:13px">Recibirás la alarma y la llamada cuando el furgón esté a unos ${h.minutos} minutos, según el tráfico.</span>
      </div>
      <div class="card"><h3>Teléfonos para la llamada</h3>
        ${h.contactos.map((c, i) => `<div class="dato"><span>${i === 0 ? "Principal" : "Secundario"} · ${esc(c.nombre)}</span><span class="mono">${esc(c.tel)}</span></div>`).join("")}
        <p class="nota" style="margin:0">Si el principal no contesta dos veces, llamamos al secundario. Presionar 1 confirma el aviso.</p>
      </div>
      <div class="card"><h3>Furgón</h3>
        <div class="dato"><span>Conductora</span><span>${TIA.nombre}</span></div>
        <div class="dato"><span>Vehículo</span><span>${TIA.furgon}</span></div>
        <div class="dato"><span>Recorridos</span><span>Ida 07:00 · Vuelta 16:30</span></div>
      </div>
    </div>`;
  }

  function vAgregar() {
    const f = app.form, e = app.errores;
    const campo = (id, label, extra = "", ayuda = "") => `<div class="campo ${e[id] ? "error" : ""}"><label for="f-${id}">${label}</label><input id="f-${id}" data-f="${id}" value="${esc(f[id] ?? "")}" ${extra}>${e[id] ? `<small>${e[id]}</small>` : ayuda ? `<small>${ayuda}</small>` : ""}</div>`;
    return `<div class="vista">

      ${tiasConectadas().length > 1 ? `<div class="campo"><label>¿Con qué tía o tío va?</label><div class="chips">${tiasConectadas().map((t) => `<button class="chip ${f.tia === t.id ? "ok" : ""}" style="border:0;cursor:pointer;font-size:14px;padding:8px 12px" data-a="tiaHijo" data-id="${t.id}">${f.tia === t.id ? "✓ " : ""}${esc(t.nombre.replace(/ \(.*\)$/, ""))}</button>`).join("")}</div>${e.tia ? `<small style="color:var(--alert)">${e.tia}</small>` : ""}</div>` : ""}
      ${campo("direccion", "Dirección", 'placeholder="Calle, número, comuna"')}
      ${barrio(f.pin, true)}
      ${e.pin ? `<small style="color:var(--alert)">${e.pin}</small>` : `<small class="muted">Toca el mapa para marcar la puerta de tu casa.</small>`}
      ${campo("indic", "Indicaciones para la tía (opcional)", 'placeholder="Ej: portón verde, depto 302"')}
      <h3>Teléfonos para la llamada automática</h3>

      <div class="dos">${campo("c2n", "Secundario · nombre")}${campo("c2t", "Teléfono", 'inputmode="tel" placeholder="Opcional"')}</div>

      <button class="btn xl" data-a="guardar">Guardar</button>
    </div>`;
  }

  // Familia: compartir el perfil con el papá (o la mamá).
  function vFamilia() {

    return `<div class="vista">
      <button class="volver" data-a="atras">‹ Volver</button>
      <h1>Familia</h1>
      <span class="muted" style="font-size:14px">Comparte a tus hijos con el papá o la mamá (o un abuelo/a). Cada uno entra con su propia cuenta y los dos reciben la alarma, las llamadas, siguen el furgón en vivo y pueden marcar «Ya subió» y «hoy no viaja».</span>
      ${HIJOS.map((h) => `<div class="card"><b>${esc(h.nombre)} ${esc(h.apellido)}</b>
        <div class="dato"><span>👤 Ana Pérez</span><span class="muted">mamá${AP.id === "ana" ? " · tú" : ""}</span></div>
        ${FAMILIA.unido && lista.includes(h.id) ? `<div class="dato"><span>👥 Rodrigo Pérez</span><span class="muted">papá${AP.id === "rodrigo" ? " · tú" : ""}</span></div>` : ""}
      </div>`).join("")}
      ${FAMILIA.unido ? `<p class="nota" style="color:var(--ok)">✓ Rodrigo se unió con su propia cuenta. Su teléfono quedó en la llamada automática de ${HIJOS.filter((h) => lista.includes(h.id)).map((h) => h.nombre).join(" e ")}.</p>
          ${AP.id === "ana" ? `<button class="btn sec" data-a="dejarCompartir">Dejar de compartir con Rodrigo</button>` : ""}`
        : FAMILIA.codigo ? `<div class="card" style="border:2px solid var(--bus)"><b>Código para Rodrigo</b>
          <div class="codigo-fam">${FAMILIA.codigo}</div>
          <span class="muted" style="font-size:13px">Sirve una vez y vence en 7 días. Esperando que Rodrigo lo use…</span>
          <a class="btn ok" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" href="https://wa.me/?text=${encodeURIComponent(msj(FAMILIA.codigo))}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>`
        : `<div class="card" style="border:2px solid var(--bus)"><h3>👨‍👩‍👧 Compartir con…</h3>
          <div class="chips">${["Papá", "Abuelo/a", "Otro"].map((p) => `<button class="chip ${FAMILIA.parentesco === p ? "ok" : ""}" style="border:0;cursor:pointer;font-size:14px;padding:8px 12px" data-a="parentescoFam" data-v="${p}">${FAMILIA.parentesco === p ? "✓ " : ""}${p}</button>`).join("")}</div>
          <span style="font-weight:700;font-size:14px">¿A quiénes?</span>
          <div class="chips">${HIJOS.map((h) => `<button class="chip ${lista.includes(h.id) ? "ok" : ""}" style="border:0;cursor:pointer;font-size:14px;padding:8px 12px" data-a="hijoFam" data-id="${h.id}">${lista.includes(h.id) ? "✓ " : ""}${esc(h.nombre)}</button>`).join("")}</div>
          <button class="btn" data-a="crearCodigoFam">Crear código para compartir</button></div>`}
    </div>`;
  }

  // Conectar con la tía o el tío: búsqueda por nombre, furgón o comuna, e invitaciones recibidas.
  function vConectar() {
    const q = app.busqueda.trim().toLowerCase();
    const sinTilde = (x) => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    const res = q.length >= 2 ? TIAS.filter((t) => sinTilde(`${t.nombre} ${t.empresa} ${t.comunas}`).includes(sinTilde(q))) : null;
    const recibidas = TIAS.filter((t) => t.estado === "pendiente" && t.inicio === "tia");
    const enviadas = TIAS.filter((t) => t.estado === "pendiente" && t.inicio === "yo");
    const fila = (t) => `<div class="tia-res"><div class="avatar chico">${esc(t.nombre[0])}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
        <b>${esc(t.nombre)}</b><span class="muted" style="font-size:13px">🚐 ${esc(t.empresa)} · ${esc(t.comunas)}</span>${t.presentacion ? `<span class="muted" style="font-size:13px">${esc(t.presentacion)}</span>` : ""}
        ${t.estado === "aceptada" ? `<span class="chip ok" style="align-self:flex-start">✓ Conectados</span>`
          : t.estado === "pendiente" && t.inicio === "yo" ? `<span class="chip bus" style="align-self:flex-start">Solicitud enviada · esperando respuesta</span>`
          : t.estado === "pendiente" ? `<span class="chip bus" style="align-self:flex-start">Te invitó · responde arriba</span>`
          : app.eligiendo === t.id ? `<div class="campo"><label for="f-msgCon">Mensaje (opcional)</label><input id="f-msgCon" data-f="msgCon" value="${esc(app.form?.msgCon ?? "")}" placeholder="Ej: Hola tía, Sofía va en 3° básico"></div>
              <div class="dos"><button class="btn" data-a="enviarCon" data-id="${t.id}">Enviar solicitud</button><button class="btn sec" data-a="cancelarElegir">Cancelar</button></div>`
          : `<button class="btn sec" style="align-self:flex-start;min-height:40px" data-a="elegirCon" data-id="${t.id}">🤝 Conectar</button>`}
      </div></div>`;
    return `<div class="vista">
      <button class="volver" data-a="atras">‹ Volver</button>
      <h1>Conectar con tu tía o tío</h1>
      ${app.msgCon ? `<p class="nota" style="color:${app.msgCon.ok ? "var(--ok)" : "var(--alert)"};margin:0">${esc(app.msgCon.txt)}</p>` : ""}
      ${recibidas.map((t) => `<div class="card" style="border:2px solid var(--ok)"><b>🤝 ${esc(t.nombre)} quiere conectarse contigo</b>
        <span class="muted" style="font-size:13px">🚐 ${esc(t.empresa)} · ${esc(t.comunas)}</span>${t.mensaje ? `<span>“${esc(t.mensaje)}”</span>` : ""}
        <div class="dos"><button class="btn ok" data-a="aceptarCon" data-id="${t.id}">Aceptar</button><button class="btn sec" data-a="rechazarCon" data-id="${t.id}">Rechazar</button></div></div>`).join("")}
      <div class="card">
        <div class="campo"><label for="buscar">Buscar tía o tío del furgón</label><input id="buscar" data-f="buscar" value="${esc(app.busqueda)}" placeholder="Nombre, furgón o comuna" autocomplete="off"></div>
        ${res === null ? `<span class="muted" style="font-size:13px">Prueba con «Rosa», «Ñuñoa» o «Furgones». Solo aparecen quienes activaron «Que las familias me encuentren».</span>`
          : res.length ? res.map(fila).join("") : `<span class="muted" style="font-size:13px">No encontramos a nadie con «${esc(app.busqueda.trim())}». Pídele a tu tía o tío que active la búsqueda en su app o que te envíe un código.</span>`}
      </div>
      ${enviadas.length ? `<h3>Solicitudes enviadas</h3>${enviadas.map((t) => `<div class="card"><b>${esc(t.nombre)}</b><span class="muted" style="font-size:13px">Esperando respuesta</span><button class="btn link" data-a="retirarCon" data-id="${t.id}">Retirar solicitud</button></div>`).join("")}` : ""}
      <h3>Conectada con</h3>
      ${tiasConectadas().map((t) => `<div class="card"><b>✓ ${esc(t.nombre)}</b><span class="muted" style="font-size:13px">🚐 ${esc(t.empresa)} · ${(() => { const n = HIJOS.filter((h) => (h.tia ?? "marcela") === t.id).map((h) => h.nombre); return n.length ? `lleva a ${esc(n.join(" e "))}` : "aún no lleva a tus hijos: agrégalos con «+ Agregar hijo/a»"; })()}</span></div>`).join("")}
      <p class="nota">🔒 La tía o el tío solo ve tu nombre y el de tus hijos cuando se conectan. Tu dirección la ve solo en su ruta.</p>
    </div>`;
  }

  function vHistorial() {
    return `<div class="vista">
      <h1>Historial</h1>
      <span class="muted">Cada aviso, quién lo confirmó y a qué hora llegaron tus hijos.</span>
      ${HISTORIAL.map((h, i) => `<details class="hist" ${i === 0 ? "open" : ""}><summary><div class="fila"><b>${esc(h.fecha)}</b>${h.ejemplo ? `<span class="ejemplo">Ejemplo</span>` : `<span class="chip ok">Hoy</span>`}</div></summary>
        <ul class="linea">${h.items.map(([t, x]) => `<li><span class="h">${t}</span><span>${esc(x)}</span></li>`).join("")}</ul></details>`).join("")}
    </div>`;
  }

  // Apariencia: automática (según el teléfono), clara u oscura.
  const temaActual = () => document.documentElement.dataset.theme === "dark" ? "oscuro" : document.documentElement.dataset.theme === "light" ? "claro" : "sistema";
  function cambiarTema(v) {
    if (v === "sistema") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = v === "oscuro" ? "dark" : "light";
  }
  function vPerfil() {
    return `<div class="vista">
      <div style="display:flex; gap:14px; align-items:center"><div class="avatar">${AP.ini}</div><div style="min-width:0"><h1>${AP.nombre}</h1><span class="muted">${AP.rol === "mamá" ? "Apoderada" : "Apoderado"} de ${hijosVisibles().map((h) => h.nombre).join(" e ")}</span></div></div>
      <div class="card"><h3>Mis datos</h3>
        <div class="dato"><span>Teléfono</span><span class="mono">${AP.tel}</span></div>
        <div class="dato"><span>Correo</span><span>${AP.email}</span></div>
      </div>
      <div class="card"><div class="fila"><h3>👨‍👩‍👧 Familia</h3><button class="btn link" data-a="familia">${FAMILIA.unido ? "Ver ›" : "Compartir ›"}</button></div>
        <div class="dato"><span>👤 Tú</span><span class="muted">${AP.rol}</span></div>
        ${FAMILIA.unido ? `<div class="dato"><span>👥 ${otroPadre().nombre}</span><span class="muted">${otroPadre().rol} · recibe los avisos</span></div>`
          : `<span class="muted" style="font-size:13px">Comparte a tus hijos con el papá para que él también reciba la alarma y siga el furgón.</span>`}
      </div>
      <div class="card"><div class="fila"><h3>Mis tías y tíos</h3><button class="btn link" data-a="conectar">Conectar ›</button></div>
        ${tiasConectadas().map((t) => `<div class="dato"><span>✓ ${esc(t.nombre)}</span><span class="muted">${esc(t.empresa)}</span></div>`).join("")}
      </div>
      <div class="card"><h3>Avisos</h3>
        <div class="sw-fila"><span><b>Alarma sonora</b><br><span class="muted" style="font-size:13px">Suena aunque el teléfono esté en silencio (Android)</span></span><label class="sw"><input type="checkbox" data-a="optAlarma" ${app.alarma ? "checked" : ""} aria-label="Alarma sonora"><span></span></label></div>
        <div class="sw-fila"><span><b>Llamada automática</b><br><span class="muted" style="font-size:13px">Te llamamos con un mensaje de voz</span></span><label class="sw"><input type="checkbox" data-a="optLlamada" ${app.llamadaAuto ? "checked" : ""} aria-label="Llamada automática"><span></span></label></div>

      <div class="card"><h3>Apariencia</h3>
        <span class="seg tema" role="group" aria-label="Apariencia">${[["sistema", "Automático"], ["claro", "Claro"], ["oscuro", "Oscuro"]].map(([v, n]) => `<button data-a="tema" data-v="${v}" aria-pressed="${temaActual() === v}">${n}</button>`).join("")}</span>
        <span class="muted" style="font-size:13px">Automático sigue el modo del teléfono.</span></div>

  }

  function vLlamada() {
    const l = R && R.llamada;
    if (!l || l.fase !== "sonando") return "";
    const h = hijoDe(l.p), m = Math.max(1, Math.round(l.p.eta / 60));
    const queda = Math.max(0, Math.ceil((l.hastaReal - performance.now()) / 1000));
    return `<div class="llamada ${l.canal === "telefono" ? "tel" : ""}" role="dialog" aria-label="Llamada entrante">
      <div>${l.canal === "app"
        ? `<span class="pildora" style="background:var(--bus);color:var(--bus-ink)">📲 Llamada por internet · sin costo</span><div class="quien" style="margin-top:10px">Furgón Escolar</div><span style="opacity:.8">Llamada de la app · intento ${l.intento}</span>`
        : `<span class="pildora">📞 Llamada telefónica · con costo</span><div class="quien" style="margin-top:10px">Furgón Escolar</div><span class="mono" style="opacity:.8">+56 2 2123 4567 · intento ${l.intento}</span>`}</div>
      <div class="voz">🗣️ “Hola. Le avisamos del furgón escolar. El furgón llegará en aproximadamente ${m} minutos con ${esc(h.nombre)} ${esc(h.apellido)}. Por favor, que alguien esté esperando en casa. Para confirmar, presione 1.”</div>
      <div><div class="teclas"><button class="tecla uno" data-a="uno">1</button><button class="tecla colgar" data-a="colgar">Colgar</button></div>
      <p style="opacity:.8; font-size:13px; margin:12px 0 0">Si no presionas 1 en ${queda} s, cuenta como no contestada.</p></div>
    </div>`;
  }

  function tabs() {
    const t = [["inicio", "🏠", "Inicio"], ["historial", "🕘", "Historial"], ["perfil", "👤", "Perfil"]];
    return `<nav class="tabs" aria-label="Secciones">${t.map(([id, ic, n]) => `<button data-a="tab" data-id="${id}" aria-current="${app.tab === id && !app.sub ? "page" : "false"}"><span>${ic}</span>${n}</button>`).join("")}</nav>`;
  }

  // ---------- Seguimiento en vivo (mapa tipo Uber) ----------
  const cam = { x: null, y: null, s: null };
  const aMundo = (p) => ({ x: (p.lng + 70.62) * mLng, y: (-33.40 - p.lat) * mLat });
  function dSuave() {
    // Posición interpolada entre pasos de la simulación, para que el furgón se deslice.
    if (!R || R.fin || R.detenidoHasta !== null || !app.corriendo || (R.llamada && R.llamada.fase === "sonando")) return R ? R.d : 0;
    const obj = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
    return Math.min(obj ? obj.dRuta : R.largo, R.d + acc * CFG.kmh / 3.6);
  }
  function rumboEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1; if (i >= R.ruta.length) i = R.ruta.length - 1;
    const a = R.ruta[i - 1], b = R.ruta[i];
    return Math.atan2((b.lng - a.lng) * mLng, (b.lat - a.lat) * mLat) * 180 / Math.PI;
  }
  function tramo(d0, d1) {
    const pts = [puntoEn(d0)];
    R.acum.forEach((a, i) => { if (a > d0 && a < d1) pts.push(R.ruta[i]); });
    pts.push(puntoEn(d1));
    return pts;
  }
  const zonaDe = (pt) => ({ lat: Math.round(pt.lat * 100) / 100, lng: Math.round(pt.lng * 100) / 100 });

  function vSeguir() {
    const h = HIJOS.find((x) => x.id === app.hijoId), p = h && parDe(h);
    const arriba = (chip) => `<div class="arriba"><button class="pildora" data-a="atras">‹ Volver</button>${chip}</div>`;
    if (!R || !p) {
      return `<div class="seguir">${arriba("")}<div class="hoja-seg"><div class="asa"></div><span class="eta-grande">Sin recorrido en curso</span>
        <span class="muted">El mapa se activa cuando la tía Marcela inicia el recorrido.</span></div></div>`;
    }
    const aBordo = p.estado === "pendiente" && p.aBordoT != null;
    const exacta = p.estado === "pendiente" && (p.avisoT !== null || aBordo);
    let titulo, detalle;
    if (p.estado === "entregado") { titulo = `${h.nombre} está en su hogar`; detalle = `En su hogar desde las ${hora(p.marcaT)} por la tía Marcela.`; }
    else if (p.estado !== "pendiente") { titulo = "Hoy no viaja"; detalle = "El furgón no pasará por tu casa."; }
    else {
      const aqui = Math.abs(p.dRuta - R.d) < 2;
      titulo = aqui ? "El furgón está afuera" : p.eta < 90 ? "Está llegando" : `Llega en ${Math.max(1, Math.round(p.eta / 60))} min`;
      const antes = R.paradas.filter((x) => x.estado === "pendiente" && x.dRuta < p.dRuta).length;
      detalle = p.avisoT !== null ? `Hora estimada ${hora(R.t + p.eta)} · aviso enviado a las ${hora(p.avisoT)}${p.confT !== null ? " · confirmado ✓" : ""}`
        : aBordo ? `🚐 ${h.nombre} va a bordo desde las ${hora(p.aBordoT)} · hora estimada ${hora(R.t + p.eta)}`
        : antes ? `Hora estimada ${hora(R.t + p.eta)} · faltan ${antes} parada${antes === 1 ? "" : "s"} antes de tu casa`
        : `Hora estimada ${hora(R.t + p.eta)} · tu casa es la próxima parada`;
    }
    const chip = p.estado !== "pendiente" ? "" : !app.internet ? `<span class="pildora"><span class="vivo-dot aprox"></span>Sin internet · última posición</span>` : exacta ? `<span class="pildora"><span class="vivo-dot"></span>En vivo</span>`
      : `<span class="pildora"><span class="vivo-dot aprox"></span>Zona aproximada</span>`;
    const paso = (ok, ahora, txt) => `<div><i class="${ok ? "ok" : ahora ? "ahora" : ""}"></i>${txt}</div>`;
    return `<div class="seguir">
      <div class="mapa-vivo"><svg id="mv" role="img" aria-label="Mapa en vivo del furgón y tu casa"></svg></div>
      ${arriba(chip)}
      <div class="hoja-seg">
        <div class="asa"></div>
        <span class="eta-grande">${titulo}</span>
        <span class="muted" style="font-size:14px">${detalle}</span>
        <div class="pasos">${paso(p.aBordoT != null, false, "Subió")}${paso(true, false, "Salió del colegio")}${paso(p.avisoT !== null, p.avisoT === null && p.estado === "pendiente", "Aviso")}${paso(p.estado === "entregado", p.avisoT !== null && p.estado === "pendiente", "En su hogar")}</div>
        ${p.estado === "pendiente" && !aBordo && !R.fin ? `<button class="btn bus" data-a="yaSubio" data-id="${h.id}">🙋 Ya subió ${esc(h.nombre)}</button>` : ""}
        ${p.avisoT !== null && p.estado === "pendiente" && p.confT === null ? `<button class="btn ok" data-a="recibido" data-id="${h.id}">Recibido, estoy ${AP.atento}</button>` : ""}
        <div class="conductora"><div class="avatar chico">M</div>
          <div style="flex:1; min-width:0"><b>${TIA.nombre}</b><br><span class="muted" style="font-size:13px">Hyundai H1 blanca · lleva a ${esc(h.nombre)}</span></div>
          <span class="patente">DEMO-11</span></div>
        <span class="muted" style="font-size:12px">🔒 Ves el furgón exacto mientras ${esc(h.nombre)} va a bordo (desde que tocas «Ya subió») o desde tu aviso. Si no, una zona aproximada (~1 km).</span>
      </div>
    </div>`;
  }

  function dibujarMapa() {
    const svg = $tel.querySelector("#mv");
    if (!svg || !R) return;
    const h = HIJOS.find((x) => x.id === app.hijoId), p = h && parDe(h);
    if (!p) return;
    const W = svg.clientWidth || 390, H = svg.clientHeight || 700;
    const hoja = $tel.querySelector(".hoja-seg"), altoHoja = hoja ? hoja.offsetHeight : 300;
    const arriba = 64, abajo = H - altoHoja - 16;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    const d = !app.internet && R.dCongelado != null ? R.dCongelado : dSuave(), van = puntoEn(d);
    const exacta = p.estado === "pendiente" && (p.avisoT !== null || p.aBordoT != null);
    const casa = aMundo(p);
    const foco = p.estado === "pendiente" ? (exacta ? aMundo(van) : aMundo(zonaDe(van))) : casa;
    const margen = p.estado !== "pendiente" ? 400 : exacta ? 180 : 1050;
    const minX = Math.min(casa.x, foco.x) - margen, maxX = Math.max(casa.x, foco.x) + margen;
    const minY = Math.min(casa.y, foco.y) - margen, maxY = Math.max(casa.y, foco.y) + margen;
    const objS = Math.max(2.2, (maxX - minX) / (W - 40), (maxY - minY) / Math.max(120, abajo - arriba));
    const obj = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: objS };
    if (cam.s === null) Object.assign(cam, obj);
    else { cam.x += (obj.x - cam.x) * 0.08; cam.y += (obj.y - cam.y) * 0.08; cam.s += (obj.s - cam.s) * 0.08; }
    const cyPantalla = (arriba + abajo) / 2;
    const P = (w) => ({ x: W / 2 + (w.x - cam.x) / cam.s, y: cyPantalla + (w.y - cam.y) / cam.s });
    const PG = (g) => P(aMundo(g));

    // Calles genéricas del barrio (no revelan el recorrido).
    const paso = cam.s > 7 ? 440 : 220, x0 = cam.x - (W / 2) * cam.s, x1 = cam.x + (W / 2) * cam.s;
    const y0 = cam.y - cyPantalla * cam.s, y1 = cam.y + (H - cyPantalla) * cam.s;
    let calles = "";
    for (let x = Math.floor(x0 / paso) * paso; x <= x1; x += paso) { const sx = P({ x, y: 0 }).x; calles += `<line x1="${sx}" y1="0" x2="${sx}" y2="${H}" stroke-width="${x % 1320 === 0 ? 9 : 5}"/>`; }
    for (let y = Math.floor(y0 / paso) * paso; y <= y1; y += paso) { const sy = P({ x: 0, y }).y; calles += `<line x1="0" y1="${sy}" x2="${W}" y2="${sy}" stroke-width="${y % 1320 === 0 ? 9 : 5}"/>`; }

    let capa = "";
    if (exacta) {
      const hecho = tramo(Math.min(p.dBordo ?? Infinity, p.dAviso ?? Infinity, d), d).map(PG), falta = tramo(d, p.dRuta).map(PG);
      const linea = (pts) => pts.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" ");
      capa += `<polyline points="${linea(hecho)}" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>`;
      capa += `<polyline points="${linea(falta)}" fill="none" stroke="var(--surface)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
      capa += `<polyline points="${linea(falta)}" fill="none" stroke="var(--navy)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    const c = P(casa);
    capa += `<g transform="translate(${c.x} ${c.y})"><path d="M0 0 C -14 -18 -17 -25 -17 -32 A 17 17 0 1 1 17 -32 C 17 -25 14 -18 0 0 Z" fill="var(--navy)" stroke="var(--surface)" stroke-width="3"/>
      <path d="M-8 -30 L0 -38 L8 -30 L8 -23 L-8 -23 Z" fill="var(--surface)"/>
      <rect x="-24" y="6" width="48" height="20" rx="10" fill="var(--surface)"/><text x="0" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">Casa</text></g>`;
    if (p.estado === "pendiente") {
      if (exacta) {
        const v = PG(van), r = rumboEn(d);
        capa += `<g transform="translate(${v.x} ${v.y}) rotate(${r})">
          <circle r="26" fill="var(--bus)" opacity=".18"/>
          <rect x="-10" y="-17" width="20" height="34" rx="6" fill="var(--bus)" stroke="var(--bus-ink)" stroke-width="2"/>
          <rect x="-7" y="-13" width="14" height="7" rx="2" fill="var(--bus-ink)" opacity=".75"/>
          <rect x="-7" y="6" width="14" height="5" rx="2" fill="var(--bus-ink)" opacity=".45"/></g>`;
      } else {
        const z = PG(zonaDe(van)), rz = 1000 / cam.s;
        capa += `<circle class="zona" cx="${z.x}" cy="${z.y}" r="${rz}" fill="var(--bus)" fill-opacity=".22" stroke="var(--bus)" stroke-width="2.5"/>
          <rect x="${z.x - 52}" y="${z.y - 13}" width="104" height="26" rx="13" fill="var(--surface)"/>
          <g style="color:var(--ink)">${icoPlano("furgon", "currentColor", "#F5B700", 18, z.x - 44, z.y - 9)}</g>
          <text x="${z.x + 10}" y="${z.y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">por aquí</text>`;
      }
    }
    svg.innerHTML = `<rect width="${W}" height="${H}" fill="var(--block)"/><g stroke="var(--road)">${calles}</g>${capa}`;
  }

  function construir() {
    let cuerpo;
    if (app.vista === "login") cuerpo = vLogin();
    else if (app.vista === "loginCodigo") cuerpo = vLoginCodigo();
    else if (app.sub === "proteger") cuerpo = vProteger();
    else if (app.sub === "ficha") cuerpo = vFicha();
    else if (app.sub === "agregar") cuerpo = vAgregar();
    else if (app.sub === "seguir") cuerpo = vSeguir();
    else if (app.sub === "conectar") cuerpo = vConectar();
    else if (app.sub === "familia") cuerpo = vFamilia();
    else cuerpo = { inicio: vInicio, historial: vHistorial, perfil: vPerfil }[app.tab]();
    const b = app.banner && app.banner.hasta > performance.now() ? app.banner : null;
    const banner = b && !(R && R.llamada && R.llamada.fase === "sonando") ? `<div class="banner ${b.tipo === "aviso" ? "vibra" : "ok"}" data-a="banner" role="status">
      <span class="app-n">${b.tipo === "aviso" ? "🔊 Furgón Escolar · alarma" : "Furgón Escolar"}</span><b>${esc(b.titulo)}</b><span>${esc(b.cuerpo)}</span></div>` : "";
    return iconizar(barraSis() + cuerpo + (app.vista === "login" || app.vista === "loginCodigo" || app.sub === "seguir" ? "" : tabs()) + banner + (app.vista === "login" || app.vista === "loginCodigo" ? "" : vLlamada()));
  }

  function render(forzar = false) {
    const html = construir();
    if (html !== previo && (forzar || !presionando)) {
      const sc = $tel.querySelector(".vista")?.scrollTop ?? 0;
      previo = html; $tel.innerHTML = html;
      const v = $tel.querySelector(".vista"); if (v) v.scrollTop = sc;
    }
    if (app.sub === "seguir") dibujarMapa();
  }

  // ---------- Eventos ----------
  function guardar() {
    const f = app.form, e = {};
    ["nombre", "apellido", "direccion", "c1n"].forEach((k) => { if (!(f[k] || "").trim()) e[k] = "Este dato es obligatorio."; });
    const t1 = normalizarTelefono(f.c1t || "");
    if (!t1) e.c1t = "Revisa el número (ej: 9 1234 5678).";
    const t2 = (f.c2t || "").trim() ? normalizarTelefono(f.c2t) : null;
    if ((f.c2t || "").trim() && !t2) e.c2t = "Revisa el número.";
    if (!f.pin) e.pin = "Marca tu casa en el mapa: así el aviso llega a tiempo.";
    if (tiasConectadas().length > 1 && !f.tia) e.tia = "Elige con quién va.";
    app.errores = e;
    if (Object.keys(e).length) return;
    HIJOS.push({ id: "h" + Date.now(), nombre: f.nombre.trim(), apellido: f.apellido.trim(), curso: f.curso || "—", colegio: f.colegio || "—",
      direccion: f.direccion, indic: f.indic || "—", pin: f.pin, minutos: 5, tia: f.tia ?? "marcela", noViaja: { ida: false, vuelta: false }, asignado: false,
      contactos: [{ nombre: f.c1n, tel: formatear(t1) }, ...(t2 ? [{ nombre: f.c2n || "Secundario", tel: formatear(t2) }] : [])] });
    app.sub = null; app.form = null;
  }

  // Lo escrito ya está en el campo: se guarda en el estado y se marca como dibujado, sin redibujar.
  document.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.f;
    if (k === "buscar") {
      // La búsqueda redibuja los resultados y devuelve el foco al campo.
      app.busqueda = e.target.value; app.eligiendo = null;
      previo = ""; render(true);
      const inp = $tel.querySelector("#buscar"); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      return;
    }
    if (k === "codigo" && app.form) {
      // Al escribir el código se muestra de qué familia es (y vuelve el foco al campo).
      app.form.codigo = e.target.value; app.errorCodigo = null; previo = ""; render(true);
      const inp = $tel.querySelector("#f-codigo"); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      return;
    }
    if (k && app.form) { app.form[k] = e.target.value; previo = construir(); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, a = el.dataset && el.dataset.a;
    if (!a) return; // los campos de texto se guardan en "input"
    if (a === "noviaja") {
      const h = HIJOS.find((x) => x.id === el.dataset.id); h.noViaja[el.dataset.t] = el.checked;
      if (R) { const p = parDe(h); if (p && el.dataset.t === "vuelta") { if (el.checked && p.estado === "pendiente") { p.estado = "no_viaja"; linea(`📅 Marcaste que ${h.nombre} no viaja hoy`); if (R.llamada && R.llamada.p === p) R.llamada = null; } else if (!el.checked && p.estado === "no_viaja") p.estado = "pendiente"; } }
    } else if (a === "internet") {
      app.internet = el.checked;
      if (R) {
        linea(app.internet ? "📶 Volvió el internet a tu teléfono" : "📵 Tu teléfono se quedó sin internet");
        if (!app.internet) R.dCongelado = R.d;
        // La llamada por la app que estaba esperando acuse llega apenas vuelve la conexión.
        if (app.internet && R.llamada && R.llamada.fase === "sin_acuse") Object.assign(R.llamada, { fase: "sonando", hastaReal: performance.now() + CFG.timbreReal * 1000 });
      }
      if (app.internet && app.pendientes.length) {
        const pend = app.pendientes; app.pendientes = [];

  });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el || el.tagName === "INPUT") return;

    else if (a === "loginCodigo") { app.vista = "loginCodigo"; app.form = null; app.errorCodigo = null; }
    else if (a === "volverLogin") { app.vista = "login"; app.form = null; }
    else if (a === "entrarCodigo") {
      const f = app.form, c = String(f.codigo).trim().toUpperCase();
      if (![CODIGO_DEMO, FAMILIA.codigo].includes(c)) app.errorCodigo = "Código no válido, vencido o ya usado.";
      else if (!f.nombre.trim()) app.errorCodigo = "Escribe tu nombre.";
      else if (!normalizarTelefono(f.tel)) app.errorCodigo = "Revisa tu teléfono (ej: 9 3333 4444).";
      else {
        // Se une a la familia y entra directo, con su propia sesión.
        Object.assign(PERSONAS.rodrigo, { nombre: f.nombre.trim(), corto: f.nombre.trim().split(" ")[0], tel: formatear(normalizarTelefono(f.tel)), sinProteger: true });
        FAMILIA.unido = true; FAMILIA.codigo = null;
        HIJOS.filter((h) => !FAMILIA.hijos || FAMILIA.hijos.includes(h.id)).forEach((h) => {
          if (h.contactos.length < 3 && !h.contactos.some((x) => x.papa)) h.contactos.push({ nombre: `${PERSONAS.rodrigo.corto} (papá)`, tel: PERSONAS.rodrigo.tel, papa: true });
        });
        AP = PERSONAS.rodrigo; app.vista = "app"; app.tab = "inicio"; app.sub = null; app.form = null; app.errorCodigo = null;
        app.banner = { tipo: "ok", titulo: "👨‍👩‍👧 Entraste a la familia", cuerpo: "Desde ahora recibes en este teléfono los avisos del furgón.", hasta: performance.now() + 5000 };

    else if (a === "guardarProteger") {
      const f = app.form;
      if (!/^\S+@\S+\.\S+$/.test(f.email.trim())) app.errorCodigo = "Revisa el correo.";
      else if (f.pass.length < 8) app.errorCodigo = "La contraseña debe tener al menos 8 caracteres.";
      else {

        app.sub = null; app.form = null; app.errorCodigo = null;
        app.banner = { tipo: "ok", titulo: "🔒 Cuenta protegida", cuerpo: "Ya puedes entrar con tu correo en cualquier teléfono.", hasta: performance.now() + 4500 };
      }
    }
    else if (a === "tab") { app.tab = el.dataset.id; app.sub = null; }
    else if (a === "simular") { nuevaSimulacion(); app.corriendo = true; app.llamGratis = 0; app.llamPagadas = 0; app.pendientes = []; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (x) {} }
    else if (a === "reiniciar") { nuevaSimulacion(); app.corriendo = true; app.notifs = []; app.llamGratis = 0; app.llamPagadas = 0; app.pendientes = []; }
    else if (a === "pausa") app.corriendo = !app.corriendo;
    else if (a === "vel") app.vel = Number(el.dataset.v);
    else if (a === "ficha") { app.sub = "ficha"; app.hijoId = el.dataset.id; app.editPin = false; }
    else if (a === "agregar") { app.sub = "agregar"; app.form = { pin: null }; app.errores = {}; }
    else if (a === "atras") { app.sub = null; app.form = null; app.busqueda = ""; app.eligiendo = null; }
    else if (a === "seguir") { app.sub = "seguir"; app.hijoId = el.dataset.id; cam.s = null; }
    else if (a === "yaSubio") {
      const h = HIJOS.find((x) => x.id === el.dataset.id), p = parDe(h);
      if (p && p.estado === "pendiente" && p.aBordoT == null) {
        p.aBordoT = R.t; p.dBordo = R.d;
        linea(`🙋 Confirmaste que ${h.nombre} subió al furgón: la sigues en vivo`);
        app.banner = { tipo: "ok", titulo: `🚐 ${h.nombre} va a bordo`, cuerpo: `Ahora ves el furgón de la tía Marcela en vivo hasta que ${h.nombre} llegue a su hogar.`, hasta: performance.now() + 4000 };
      }
      app.sub = "seguir"; app.hijoId = h.id; cam.s = null;
    }
    else if (a === "tema") cambiarTema(el.dataset.v);
    else if (a === "familia") app.sub = "familia";
    else if (a === "parentescoFam") FAMILIA.parentesco = el.dataset.v;
    else if (a === "hijoFam") {
      const l = new Set(FAMILIA.hijos ?? HIJOS.map((h) => h.id));
      if (l.has(el.dataset.id) && l.size > 1) l.delete(el.dataset.id); else l.add(el.dataset.id);
      FAMILIA.hijos = l.size === HIJOS.length ? null : [...l];
    }
    else if (a === "crearCodigoFam") {
      FAMILIA.codigo = "F" + Math.random().toString(16).slice(2, 9).toUpperCase().padEnd(7, "0");
      // Demostración: Rodrigo crea su cuenta con el código a los pocos segundos.
      setTimeout(() => {
        FAMILIA.unido = true;
        // Su teléfono entra a la llamada automática de los hijos compartidos (si hay cupo).
        HIJOS.filter((h) => !FAMILIA.hijos || FAMILIA.hijos.includes(h.id)).forEach((h) => {
          if (h.contactos.length < 3 && !h.contactos.some((c) => c.papa)) h.contactos.push({ nombre: "Rodrigo (papá)", tel: PERSONAS.rodrigo.tel, papa: true });
        });
        app.banner = { tipo: "ok", titulo: "👨‍👩‍👧 Rodrigo se unió a la familia", cuerpo: "Desde ahora la alarma y las llamadas también le llegan a él. Prueba «Ver la app como Rodrigo».", hasta: performance.now() + 6000 };
        previo = ""; render(true);
      }, 4000);
    }
    else if (a === "dejarCompartir") { Object.assign(FAMILIA, { unido: false, codigo: null, hijos: null }); HIJOS.forEach((h) => { h.contactos = h.contactos.filter((c) => !c.papa); }); }
    else if (a === "verComo") { AP = PERSONAS[el.dataset.v]; app.sub = null; }
    else if (a === "conectar") { app.sub = "conectar"; app.msgCon = null; app.eligiendo = null; app.form = {}; }
    else if (a === "elegirCon") { app.eligiendo = el.dataset.id; app.form = { msgCon: "" }; }
    else if (a === "cancelarElegir") app.eligiendo = null;
    else if (a === "enviarCon") {
      const t = TIAS.find((x) => x.id === el.dataset.id);
      Object.assign(t, { estado: "pendiente", inicio: "yo", mensaje: (app.form?.msgCon ?? "").trim() || null });
      app.eligiendo = null; app.msgCon = { ok: true, txt: `Solicitud enviada a ${t.nombre}. Te avisaremos cuando responda.` };
      // Demostración: la tía acepta a los pocos segundos.
      setTimeout(() => {
        if (t.estado !== "pendiente" || t.inicio !== "yo") return;
        t.estado = "aceptada";
        app.notifs.unshift({ tipo: "ok", titulo: `🤝 ${t.nombre} aceptó tu solicitud`, cuerpo: "Ya puedes agregar a tu hijo/a con este furgón.", t: R ? R.t : 0 });
        app.banner = { tipo: "ok", titulo: `🤝 ${t.nombre} aceptó tu solicitud`, cuerpo: "Ya puedes agregar a tu hijo/a con este furgón.", hasta: performance.now() + 5000 };
        if (app.sub === "conectar") app.msgCon = { ok: true, txt: `${t.nombre} aceptó: ya están conectados.` };
        previo = ""; render(true);
      }, 4000);
    }
    else if (a === "retirarCon") { const t = TIAS.find((x) => x.id === el.dataset.id); t.estado = null; t.inicio = null; app.msgCon = { ok: true, txt: "Solicitud retirada." }; }
    else if (a === "aceptarCon") { const t = TIAS.find((x) => x.id === el.dataset.id); t.estado = "aceptada"; app.msgCon = { ok: true, txt: `Listo: ya estás conectada con ${t.nombre}. Agrega a tu hijo/a y elige que va con este furgón.` }; }
    else if (a === "rechazarCon") { const t = TIAS.find((x) => x.id === el.dataset.id); t.estado = null; t.inicio = null; app.msgCon = { ok: true, txt: "Invitación rechazada." }; }
    else if (a === "tiaHijo") { app.form.tia = el.dataset.id; delete app.errores.tia; }
    else if (a === "editPin") app.editPin = !app.editPin;
    else if (a === "pin") {
      const r = el.getBoundingClientRect();
      const pin = { x: Math.min(.97, Math.max(.03, (e.clientX - r.left) / r.width)), y: Math.min(.97, Math.max(.2, (e.clientY - r.top) / r.height)) };
      if (app.sub === "agregar") { app.form.pin = pin; delete app.errores.pin; } else { HIJOS.find((x) => x.id === app.hijoId).pin = pin; }
    }
    else if (a === "minutos") HIJOS.find((x) => x.id === app.hijoId).minutos = Number(el.dataset.v);
    else if (a === "guardar") guardar();
    else if (a === "recibido") { const p = R.paradas.find((x) => x.id === el.dataset.id); confirmar(p, "📱 Tocaste “Recibido”: se cancelan las llamadas"); }
    else if (a === "banner") { const b = app.banner; app.banner = null; if (b && b.tipo === "aviso" && R) { const p = R.paradas.find((x) => x.id === b.hijo); if (p && !(R.llamada && R.llamada.fase === "sonando")) confirmar(p, "📱 Abriste la notificación: se cancelan los reintentos"); app.sub = "seguir"; app.hijoId = b.hijo; cam.s = null; } }
    else if (a === "uno") { const l = R.llamada; confirmar(l.p, `✅ Contestaste la llamada ${l.canal === "app" ? "por la app (sin costo)" : "telefónica (con costo)"} y presionaste 1`); }
    else if (a === "colgar") noContesto();
    else if (a === "salir") { app.vista = "login"; app.sub = null; }
    previo = ""; render(true);
  });

  let ult = performance.now(), acc = 0;
  function bucle(ahora) {
    const dt = Math.min(0.25, (ahora - ult) / 1000); ult = ahora;
    const sonando = R && R.llamada && R.llamada.fase === "sonando";
    if (sonando && performance.now() >= R.llamada.hastaReal) noContesto();
    // La simulación espera mientras suena la llamada, para que alcances a contestar.
    if (R && !R.fin && app.corriendo && !sonando) { acc += dt * app.vel; while (acc >= 1 && !R.fin) { paso(); acc--; } }
    render();
    requestAnimationFrame(bucle);
  }
  render(); requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
