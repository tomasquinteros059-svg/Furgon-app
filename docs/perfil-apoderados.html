<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furgón Escolar · Apoderados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* App de los padres: una columna móvil, tarjeta por hijo con su estado en vivo, alarma y llamada a pantalla completa. */
:root {
  --bg: #E7EBEF; --app: #F4F6F8; --surface: #FFFFFF; --surface-2: #EEF1F4;
  --ink: #15202B; --muted: #5A6573; --line: #D3D9E0; --road: #C4CBD3; --block: #E1E6EB;
  --bus: #F5B700; --bus-ink: #2A2100; --bus-soft: #FFF4CC;
  --navy: #16324F; --navy-ink: #FFFFFF;
  --ok: #1D7F45; --ok-soft: #E4F3EA; --alert: #C4281C; --alert-soft: #FCE9E7;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
    --line: #2B3743; --road: #3A4754; --block: #222D37; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
    --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #090D11; --app: #0F151B; --surface: #17212A; --surface-2: #1E2933; --ink: #E7ECF1; --muted: #95A2B0;
  --line: #2B3743; --road: #3A4754; --block: #222D37; --bus: #F7C21A; --bus-ink: #1E1800; --bus-soft: #3A3010;
  --navy: #8DB8E6; --navy-ink: #0B1622; --ok: #4DC47F; --ok-soft: #15301F; --alert: #FF6B5E; --alert-soft: #3A1C1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
.rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.telefono { width: min(410px, 100%); height: min(860px, calc(100vh - 60px)); min-height: 620px; background: var(--app); border: 10px solid var(--ink); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 520px) {
  body { padding: 0; gap: 0; }
  .rotulo { display: none; }
  .telefono { width: 100%; height: 100%; min-height: 0; border: 0; border-radius: 0; }
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--bus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.estado-sis { display: flex; justify-content: space-between; padding: 8px 18px 4px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.vista { flex: 1; overflow-y: auto; padding: 6px 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs button { border: 0; background: transparent; padding: 9px 4px 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.tabs button span { font-size: 20px; line-height: 1; }
.tabs button[aria-current="page"] { color: var(--ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fila > * { min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.alerta { background: var(--alert-soft); color: var(--alert); }
.chip.bus { background: var(--bus-soft); }
.btn { border: 0; border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 700; font-size: 16px; background: var(--navy); color: var(--navy-ink); }
.btn.bus { background: var(--bus); color: var(--bus-ink); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.sec { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.xl { min-height: 60px; font-size: 18px; }
.btn.link { background: transparent; color: var(--navy); min-height: 0; padding: 4px 0; text-align: left; }
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo label { font-weight: 700; font-size: 14px; }
.campo input { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; background: var(--surface); color: var(--ink); width: 100%; }
.campo small { color: var(--muted); font-size: 12px; }
.campo.error input { border-color: var(--alert); }
.campo.error small { color: var(--alert); }
.dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.nota { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.estado { border-radius: 10px; padding: 10px 12px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.estado b { font-size: 16px; }
.estado.bus { background: var(--bus-soft); }
.estado.ok { background: var(--ok-soft); }
.estado.no { background: var(--surface-2); color: var(--muted); }
.sw-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; padding: 4px 0; }
.sw { position: relative; width: 44px; height: 26px; flex: none; }
.sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; background: var(--road); border-radius: 999px; pointer-events: none; transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw.rojo input:checked + span { background: var(--alert); }
.sw input:checked + span::after { transform: translateX(18px); }
.mini svg, .barrio svg { width: 100%; height: auto; display: block; border-radius: 10px; background: var(--surface-2); }
.barrio svg { cursor: crosshair; }
.privado { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.notif { border-radius: 10px; padding: 9px 11px; background: var(--surface-2); font-size: 14px; }
.notif b { display: block; }
.notif.alarma { background: var(--alert-soft); }
.notif.ok { background: var(--ok-soft); }
.notif small { color: var(--muted); font-family: var(--font-mono); }
.demo { border: 1px dashed var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 14px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--app); }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--navy); color: var(--navy-ink); display: grid; place-items: center; font-family: var(--font-display); font-size: 28px; font-weight: 700; flex: none; }
.avatar.chico { width: 42px; height: 42px; font-size: 19px; background: var(--bus); color: var(--bus-ink); }
.dato { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.dato:last-child { border-bottom: 0; }
.dato span:first-child { color: var(--muted); }
.dato span:last-child { text-align: right; font-weight: 700; }
.volver { border: 0; background: transparent; font-weight: 700; color: var(--navy); padding: 4px 0; align-self: flex-start; }
.ejemplo { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

/* Seguimiento en vivo (mapa tipo Uber) */
.seguir { flex: 1; position: relative; overflow: hidden; background: var(--block); }
.mapa-vivo, .mapa-vivo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.arriba { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 2; gap: 8px; }
.pildora { background: var(--surface); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 7px; }
.vivo-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--alert); }
.vivo-dot.aprox { background: var(--bus); }
.hoja-seg { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; background: var(--surface); border-radius: 22px 22px 0 0; padding: 8px 16px 16px; box-shadow: 0 -8px 24px rgba(0,0,0,.16); display: flex; flex-direction: column; gap: 10px; }
.asa { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.eta-grande { font-family: var(--font-display); font-size: 34px; line-height: 1; }
.pasos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pasos div { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.pasos i { height: 5px; border-radius: 3px; background: var(--line); }
.pasos i.ok { background: var(--ok); }
.pasos i.ahora { background: var(--bus); }
.conductora { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
.patente { font-family: var(--font-mono); font-weight: 700; border: 2px solid var(--ink); border-radius: 6px; padding: 2px 8px; font-size: 13px; flex: none; }
@media (prefers-reduced-motion: no-preference) {
  .zona { animation: zona 2.2s ease-in-out infinite; }
  .vivo-dot { animation: pulso 1.4s ease-in-out infinite; }
}
@keyframes zona { 50% { opacity: .5; } }

/* Alarma y llamada */
.banner { position: absolute; left: 8px; right: 8px; top: 30px; z-index: 8; border-radius: 16px; padding: 12px 14px; background: var(--surface); border: 3px solid var(--alert); box-shadow: 0 12px 30px rgba(0,0,0,.3); cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.banner.ok { border-color: var(--ok); }
.banner .app-n { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.banner b { font-size: 16px; }
.llamada { position: absolute; inset: 0; z-index: 9; background: #0F2236; color: #fff; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; padding: 44px 20px 34px; gap: 16px; }
.llamada.tel { background: #1B1F24; }
.llamada .quien { font-family: var(--font-display); font-size: 34px; }
.llamada .voz { background: rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; font-size: 15px; }
.teclas { display: flex; gap: 26px; justify-content: center; }
.tecla { width: 80px; height: 80px; border-radius: 50%; border: 0; font-weight: 700; color: #fff; }
.tecla.uno { background: #1D7F45; font-size: 30px; }
.tecla.colgar { background: #C4281C; font-size: 15px; }
@media (prefers-reduced-motion: no-preference) {
  .banner { animation: baja .3s ease-out; }
  .banner.vibra { animation: baja .3s ease-out, vibra .45s linear .3s 4; }
  .llamada .quien { animation: pulso 1.4s ease-in-out infinite; }
}
@keyframes baja { from { transform: translateY(-130%); } to { transform: none; } }
@keyframes vibra { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes pulso { 50% { opacity: .6; } }
details.hist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
details.hist summary { cursor: pointer; list-style: none; }
details.hist summary::-webkit-details-marker { display: none; }
ul.linea { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
ul.linea li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 8px; }
ul.linea .h { font-family: var(--font-mono); color: var(--muted); font-size: 12px; padding-top: 2px; }
</style>
</head>
<body>
<span class="rotulo">Perfil · Padres y apoderados</span>
<div class="telefono" id="tel"></div>

<script>
(() => {
  // ---------- Datos de la demo ----------
  const AP = { nombre: "Ana Pérez", corto: "Ana", email: "ana.perez@correo.cl", tel: "+56 9 1111 1111" };
  const TIA = { nombre: "Tía Marcela", furgon: "Hyundai H1 blanca · DEMO-11", tel: "+56 9 5555 1234" };
  const COLEGIO = { lat: -33.4565, lng: -70.5978 };
  const PARADAS = [ // recorrido de vuelta completo (las casas de otras familias no se muestran)
    { id: "sofia", lat: -33.4495, lng: -70.5560, mia: true },
    { id: "matias", lat: -33.4180, lng: -70.5540, mia: false },
    { id: "isidora", lat: -33.4260, lng: -70.6100, mia: true },
  ];
  let HIJOS = [
    { id: "sofia", nombre: "Sofía", apellido: "Pérez", curso: "3° Básico", colegio: "Colegio Demo (Ñuñoa)", direccion: "Av. Ossa 1200, La Reina", indic: "Portón verde",
      pin: { x: 0.56, y: 0.47 }, minutos: 5, noViaja: { ida: false, vuelta: false }, asignado: true,
      contactos: [{ nombre: "Ana (mamá)", tel: "+56 9 1111 1111" }, { nombre: "Pedro (abuelo)", tel: "+56 9 2222 2222" }] },
    { id: "isidora", nombre: "Isidora", apellido: "Rojas", curso: "1° Básico", colegio: "Colegio Demo (Ñuñoa)", direccion: "Av. Pedro de Valdivia 900, Providencia", indic: "Casa esquina",
      pin: { x: 0.38, y: 0.58 }, minutos: 5, noViaja: { ida: false, vuelta: false }, asignado: true,
      contactos: [{ nombre: "Ana (mamá)", tel: "+56 9 1111 1111" }, { nombre: "Pedro (abuelo)", tel: "+56 9 2222 2222" }] },
  ];
  const HISTORIAL = [
    { fecha: "Lun 6 oct · Vuelta", ejemplo: true, items: [["16:34", "🔔 Aviso: Sofía llega en ~5 min"], ["16:34", "📞 Contestaste y presionaste 1"], ["16:40", "✅ Sofía llegó a casa"], ["16:55", "🔔 Aviso: Isidora llega en ~5 min"], ["16:55", "📱 Tocaste “Recibido”"], ["17:01", "✅ Isidora llegó a casa"]] },
    { fecha: "Lun 6 oct · Ida", ejemplo: true, items: [["07:01", "🔔 Aviso: el furgón pasa por Isidora en ~5 min"], ["07:06", "✅ Isidora subió al furgón"], ["07:20", "🔔 Aviso: el furgón pasa por Sofía en ~5 min"], ["07:26", "✅ Sofía subió al furgón"]] },
    { fecha: "Vie 3 oct · Vuelta", ejemplo: true, items: [["16:33", "🔔 Aviso: Sofía llega en ~5 min"], ["16:34", "📞 No contestaste: llamamos a Pedro (abuelo), que confirmó"], ["16:39", "✅ Sofía llegó a casa"], ["16:50", "🔔 Aviso: Isidora llega en ~5 min"], ["16:57", "✅ Isidora llegó a casa"]] },
  ];
  const CFG = { kmh: 30, margen: 30, parada: 60, proximidad: 300, gps: 10, detencion: 40, timbreReal: 20, reintento: 30, acuseApp: 15 };

  // ---------- Geometría ----------
  const rad = (g) => g * Math.PI / 180;
  const dist = (a, b) => { const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng); const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2; return 12742000 * Math.asin(Math.min(1, Math.sqrt(h))); };
  const mLng = 111195 * Math.cos(rad(-33.445)), mLat = 111195;

  // ---------- Teléfonos (misma regla que el prototipo) ----------
  function normalizarTelefono(t) {
    let s = t.trim().replace(/[\s().-]/g, ""); if (!s) return null;
    let d = s.startsWith("+") ? s.slice(1) : s.startsWith("00") ? s.slice(2) : s.startsWith("56") && s.length > 9 ? s : "56" + s.replace(/^0+/, "");
    if (!/^[1-9]\d{7,14}$/.test(d) || (d.startsWith("56") && d.length !== 11)) return null;
    return `+${d}`;
  }
  const formatear = (e) => { const m = /^\+56(9)(\d{4})(\d{4})$/.exec(e); return m ? `+56 ${m[1]} ${m[2]} ${m[3]}` : e; };

  // ---------- Estado ----------
  const app = { vista: "login", tab: "inicio", sub: null, hijoId: null, editPin: false, form: null, errores: {}, vel: 10, alarma: true, llamadaAuto: true, banner: null, notifs: [], internet: true, pendientes: [], llamGratis: 0, llamPagadas: 0 };
  let R = null; // simulación de la vuelta de hoy

  function nuevaSimulacion() {
    const puntos = [COLEGIO]; const ruta = [COLEGIO];
    PARADAS.forEach((p) => { ruta.push({ lat: ruta.at(-1).lat, lng: p.lng }, p); });
    const acum = [0]; for (let i = 1; i < ruta.length; i++) acum.push(acum[i - 1] + dist(ruta[i - 1], ruta[i]));
    R = {
      t: 0, d: 0, ruta, acum, largo: acum.at(-1), detenidoHasta: null, fin: false,
      paradas: PARADAS.map((p, j) => {
        const hijo = HIJOS.find((h) => h.id === p.id);
        return { ...p, dRuta: acum[2 * (j + 1)], estado: hijo && hijo.noViaja.vuelta ? "no_viaja" : "pendiente", eta: null, avisoT: null, confT: null, marcaT: null };
      }),
      llamada: null, linea: [],
    };
  }

  const hora = (t) => { const s = Math.floor(16 * 3600 + 30 * 60 + t); return `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`; };
  const hijoDe = (p) => HIJOS.find((h) => h.id === p.id);
  const parDe = (h) => R && R.paradas.find((p) => p.id === h.id);
  function puntoEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1;
    if (d >= R.largo) return R.ruta.at(-1);
    const f = (d - R.acum[i - 1]) / ((R.acum[i] - R.acum[i - 1]) || 1), a = R.ruta[i - 1], b = R.ruta[i];
    return { lat: a.lat + (b.lat - a.lat) * f, lng: a.lng + (b.lng - a.lng) * f };
  }
  function notificar(n) {
    // Sin internet la push no llega: queda pendiente hasta que vuelva la conexión.
    if (!app.internet) { app.pendientes.push({ ...n, t: R.t }); return; }
    app.notifs.unshift({ ...n, t: R.t });
    app.banner = { ...n, hasta: performance.now() + 6000 };
    if (n.tipo === "aviso") sonar();
  }
  const linea = (txt) => R.linea.push([hora(R.t), txt]);

  function paso() {
    R.t++;
    const v = CFG.kmh / 3.6;
    if (R.detenidoHasta !== null) {
      if (R.t >= R.detenidoHasta) {
        const p = R.paradas.find((x) => x.estado === "pendiente" && Math.abs(x.dRuta - R.d) < 2);
        if (p) entregar(p);
        R.detenidoHasta = null;
      }
    } else {
      const obj = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
      R.d = Math.min(obj ? obj.dRuta : R.largo, R.d + v);
      if (obj && R.d >= obj.dRuta) R.detenidoHasta = R.t + CFG.detencion;
      if (!obj && R.d >= R.largo) { R.fin = true; app.corriendo = false; guardarHistorial(); }
    }
    if (R.t % CFG.gps === 0) evaluar();
    if (R.llamada && R.llamada.fase === "esperando" && R.t >= R.llamada.reintentoT) iniciarLlamada(R.llamada.p, 2);
    if (R.llamada && R.llamada.fase === "sin_acuse" && R.t >= R.llamada.hastaT) {
      R.llamada.p.sinInternet = true;
      linea("📵 Tu teléfono no tenía internet: la llamada por la app no llegó. Te llamamos por teléfono (con costo)");
      llamarTelefono(R.llamada.p, R.llamada.intento);
    }
  }

  function evaluar() {
    const pos = puntoEn(R.d), v = CFG.kmh / 3.6;
    const pend = R.paradas.filter((p) => p.estado === "pendiente");
    pend.forEach((p, i) => { p.eta = Math.max(0, (p.dRuta - R.d) / v) + i * CFG.parada; });
    for (const p of pend) {
      if (p.avisoT !== null || !p.mia) continue;
      const h = hijoDe(p);
      if (dist(pos, p) <= CFG.proximidad || p.eta <= h.minutos * 60 + CFG.margen) {
        p.avisoT = R.t; p.dAviso = R.d;
        const m = Math.max(1, Math.round(p.eta / 60));
        notificar({ tipo: "aviso", hijo: h.id, titulo: `🚐 ${h.nombre} llega pronto a casa`, cuerpo: `El furgón llegará en aproximadamente ${m} minutos con ${h.nombre} ${h.apellido}. Por favor, que alguien esté esperando en casa.` });
        linea(`🔔 Aviso: ${h.nombre} llega en ~${m} min`);
        if (app.llamadaAuto) iniciarLlamada(p, 1);
      }
    }
  }

  // Primero gratis por la app; si el teléfono no acusa recibo en 15 s (sin internet),
  // llamada telefónica normal (con costo). Si ya sabemos que no hay internet, directo al teléfono.
  function iniciarLlamada(p, intento) {
    if (p.confT !== null || p.estado !== "pendiente") { R.llamada = null; return; }
    if (p.sinInternet) { llamarTelefono(p, intento); return; }
    app.llamGratis++;
    linea(`📲 Llamada ${intento} por la app (por internet, sin costo)`);
    R.llamada = app.internet
      ? { p, intento, canal: "app", fase: "sonando", hastaReal: performance.now() + CFG.timbreReal * 1000 }
      : { p, intento, canal: "app", fase: "sin_acuse", hastaT: R.t + CFG.acuseApp };
  }

  function llamarTelefono(p, intento) {
    app.llamPagadas++;
    linea(`📞 Llamada ${intento} telefónica (con costo)`);
    R.llamada = { p, intento, canal: "telefono", fase: "sonando", hastaReal: performance.now() + CFG.timbreReal * 1000 };
  }

  function confirmar(p, como) {
    if (p.confT !== null) return;
    p.confT = R.t; linea(como);
    if (R.llamada && R.llamada.p === p) R.llamada = null;
  }

  function noContesto() {
    const l = R.llamada; if (!l) return;
    const h = hijoDe(l.p);
    if (l.intento === 1) {
      linea("✖️ No contestaste la llamada 1");
      R.llamada = { ...l, fase: "esperando", reintentoT: R.t + CFG.reintento };
    } else {
      linea(`✖️ No contestaste la llamada 2: llamamos a ${h.contactos[1]?.nombre ?? "tu contacto secundario"}`);
      R.llamada = null;
      if (h.contactos[1]) {
        app.llamPagadas++;
        linea(`📞 Llamada telefónica (con costo) a ${h.contactos[1].nombre}, que no tiene la app`);
        confirmar(l.p, `✅ ${h.contactos[1].nombre} contestó y confirmó`);
        notificar({ tipo: "info", hijo: h.id, titulo: `📞 Avisamos a ${h.contactos[1].nombre}`, cuerpo: `No pudimos comunicarnos contigo. ${h.contactos[1].nombre} recibió el aviso de ${h.nombre} y lo confirmó.` });
      }
    }
  }

  function entregar(p) {
    p.estado = "entregado"; p.marcaT = R.t;
    if (R.llamada && R.llamada.p === p) R.llamada = null;
    if (!p.mia) return;
    const h = hijoDe(p);
    linea(`✅ ${h.nombre} llegó a casa`);
    notificar({ tipo: "ok", hijo: h.id, titulo: `✅ ${h.nombre} llegó a casa`, cuerpo: `La tía Marcela marcó a ${h.nombre} ${h.apellido} como entregado/a a las ${hora(R.t)}.` });

  // ---------- Sonido ----------
  let audio = null;
  function sonar() {
    if (!app.alarma) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = audio.currentTime;
      for (let r = 0; r < 3; r++) [880, 1175, 1568].forEach((f, i) => {
        const o = audio.createOscillator(), g = audio.createGain(), t = t0 + r * 0.8 + i * 0.2;
        o.type = "square"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
        o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.2);
      });
    } catch (e) { /* sin audio */ }
  }

        ${verMapa && p.confT === null ? `<button class="btn ok" data-a="recibido" data-id="${h.id}">Recibido, estoy atenta</button>` : ""}
        ${h.asignado ? `<div><span style="font-weight:700; font-size:14px">Hoy no viaja</span>
          ${["ida", "vuelta"].map((t) => {
            const bloqueado = t === "ida" || (R && p && (p.estado === "entregado" || (p.estado === "pendiente" && p.avisoT !== null && Math.abs(p.dRuta - R.d) < 2)));

    return `<div class="llamada ${l.canal === "telefono" ? "tel" : ""}" role="dialog" aria-label="Llamada entrante">
      <div>${l.canal === "app"
        ? `<span class="pildora" style="background:var(--bus);color:var(--bus-ink)">📲 Llamada por internet · sin costo</span><div class="quien" style="margin-top:10px">Furgón Escolar</div><span style="opacity:.8">Llamada de la app · intento ${l.intento}</span>`
        : `<span class="pildora">📞 Llamada telefónica · con costo</span><div class="quien" style="margin-top:10px">Furgón Escolar</div><span class="mono" style="opacity:.8">+56 2 2123 4567 · intento ${l.intento}</span>`}</div>
      <div class="voz">🗣️ “Hola. Le avisamos del furgón escolar. El furgón llegará en aproximadamente ${m} minutos con ${esc(h.nombre)} ${esc(h.apellido)}. Por favor, que alguien esté esperando en casa. Para confirmar, presione 1.”</div>
      <div><div class="teclas"><button class="tecla uno" data-a="uno">1</button><button class="tecla colgar" data-a="colgar">Colgar</button></div>
      <p style="opacity:.8; font-size:13px; margin:12px 0 0">Si no presionas 1 en ${queda} s, cuenta como no contestada.</p></div>
    </div>`;
  }

  function tabs() {
    const t = [["inicio", "🏠", "Inicio"], ["historial", "🕘", "Historial"], ["perfil", "👤", "Perfil"]];
    return `<nav class="tabs" aria-label="Secciones">${t.map(([id, ic, n]) => `<button data-a="tab" data-id="${id}" aria-current="${app.tab === id && !app.sub ? "page" : "false"}"><span>${ic}</span>${n}</button>`).join("")}</nav>`;
  }

  // ---------- Seguimiento en vivo (mapa tipo Uber) ----------
  const cam = { x: null, y: null, s: null };
  const aMundo = (p) => ({ x: (p.lng + 70.62) * mLng, y: (-33.40 - p.lat) * mLat });
  function dSuave() {
    // Posición interpolada entre pasos de la simulación, para que el furgón se deslice.
    if (!R || R.fin || R.detenidoHasta !== null || !app.corriendo || (R.llamada && R.llamada.fase === "sonando")) return R ? R.d : 0;
    const obj = R.paradas.find((p) => p.estado === "pendiente" && p.dRuta >= R.d - 1);
    return Math.min(obj ? obj.dRuta : R.largo, R.d + acc * CFG.kmh / 3.6);
  }
  function rumboEn(d) {
    let i = R.acum.findIndex((a) => a >= d); if (i <= 0) i = 1; if (i >= R.ruta.length) i = R.ruta.length - 1;
    const a = R.ruta[i - 1], b = R.ruta[i];
    return Math.atan2((b.lng - a.lng) * mLng, (b.lat - a.lat) * mLat) * 180 / Math.PI;
  }
  function tramo(d0, d1) {
    const pts = [puntoEn(d0)];
    R.acum.forEach((a, i) => { if (a > d0 && a < d1) pts.push(R.ruta[i]); });
    pts.push(puntoEn(d1));
    return pts;
  }
  const zonaDe = (pt) => ({ lat: Math.round(pt.lat * 100) / 100, lng: Math.round(pt.lng * 100) / 100 });

  function vSeguir() {
    const h = HIJOS.find((x) => x.id === app.hijoId), p = h && parDe(h);
    const arriba = (chip) => `<div class="arriba"><button class="pildora" data-a="atras">‹ Volver</button>${chip}</div>`;
    if (!R || !p) {
      return `<div class="seguir">${arriba("")}<div class="hoja-seg"><div class="asa"></div><span class="eta-grande">Sin recorrido en curso</span>
        <span class="muted">El mapa se activa cuando la tía Marcela inicia el recorrido.</span></div></div>`;
    }
    const exacta = p.avisoT !== null && p.estado === "pendiente";
    let titulo, detalle;
    if (p.estado === "entregado") { titulo = `${h.nombre} llegó a casa`; detalle = `Entregado/a a las ${hora(p.marcaT)} por la tía Marcela.`; }
    else if (p.estado !== "pendiente") { titulo = "Hoy no viaja"; detalle = "El furgón no pasará por tu casa."; }
    else {
      const aqui = Math.abs(p.dRuta - R.d) < 2;
      titulo = aqui ? "El furgón está afuera" : p.eta < 90 ? "Está llegando" : `Llega en ${Math.max(1, Math.round(p.eta / 60))} min`;
      const antes = R.paradas.filter((x) => x.estado === "pendiente" && x.dRuta < p.dRuta).length;
      detalle = exacta ? `Hora estimada ${hora(R.t + p.eta)} · aviso enviado a las ${hora(p.avisoT)}${p.confT !== null ? " · confirmado ✓" : ""}`
        : antes ? `Hora estimada ${hora(R.t + p.eta)} · faltan ${antes} parada${antes === 1 ? "" : "s"} antes de tu casa`
        : `Hora estimada ${hora(R.t + p.eta)} · tu casa es la próxima parada`;
    }
    const chip = p.estado !== "pendiente" ? "" : !app.internet ? `<span class="pildora"><span class="vivo-dot aprox"></span>Sin internet · última posición</span>` : exacta ? `<span class="pildora"><span class="vivo-dot"></span>En vivo</span>`
      : `<span class="pildora"><span class="vivo-dot aprox"></span>Zona aproximada</span>`;
    const paso = (ok, ahora, txt) => `<div><i class="${ok ? "ok" : ahora ? "ahora" : ""}"></i>${txt}</div>`;
    return `<div class="seguir">
      <div class="mapa-vivo"><svg id="mv" role="img" aria-label="Mapa en vivo del furgón y tu casa"></svg></div>
      ${arriba(chip)}
      <div class="hoja-seg">
        <div class="asa"></div>
        <span class="eta-grande">${titulo}</span>
        <span class="muted" style="font-size:14px">${detalle}</span>
        <div class="pasos">${paso(true, false, "Salió del colegio")}${paso(p.avisoT !== null, p.avisoT === null && p.estado === "pendiente", "Aviso")}${paso(p.estado === "entregado", exacta, "En casa")}</div>
        ${exacta && p.confT === null ? `<button class="btn ok" data-a="recibido" data-id="${h.id}">Recibido, estoy atenta</button>` : ""}
        <div class="conductora"><div class="avatar chico">M</div>
          <div style="flex:1; min-width:0"><b>${TIA.nombre}</b><br><span class="muted" style="font-size:13px">Hyundai H1 blanca · lleva a ${esc(h.nombre)}</span></div>
          <span class="patente">DEMO-11</span></div>
        <span class="muted" style="font-size:12px">🔒 Antes del aviso ves una zona aproximada (~1 km). Desde el aviso hasta la entrega, el furgón exacto. Así nadie puede saber dónde viven los otros niños.</span>
      </div>
    </div>`;
  }

  function dibujarMapa() {
    const svg = $tel.querySelector("#mv");
    if (!svg || !R) return;
    const h = HIJOS.find((x) => x.id === app.hijoId), p = h && parDe(h);
    if (!p) return;
    const W = svg.clientWidth || 390, H = svg.clientHeight || 700;
    const hoja = $tel.querySelector(".hoja-seg"), altoHoja = hoja ? hoja.offsetHeight : 300;
    const arriba = 64, abajo = H - altoHoja - 16;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

    const d = !app.internet && R.dCongelado != null ? R.dCongelado : dSuave(), van = puntoEn(d);
    const exacta = p.avisoT !== null && p.estado === "pendiente";
    const casa = aMundo(p);
    const foco = p.estado === "pendiente" ? (exacta ? aMundo(van) : aMundo(zonaDe(van))) : casa;
    const margen = p.estado !== "pendiente" ? 400 : exacta ? 180 : 1050;
    const minX = Math.min(casa.x, foco.x) - margen, maxX = Math.max(casa.x, foco.x) + margen;
    const minY = Math.min(casa.y, foco.y) - margen, maxY = Math.max(casa.y, foco.y) + margen;
    const objS = Math.max(2.2, (maxX - minX) / (W - 40), (maxY - minY) / Math.max(120, abajo - arriba));
    const obj = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: objS };
    if (cam.s === null) Object.assign(cam, obj);
    else { cam.x += (obj.x - cam.x) * 0.08; cam.y += (obj.y - cam.y) * 0.08; cam.s += (obj.s - cam.s) * 0.08; }
    const cyPantalla = (arriba + abajo) / 2;
    const P = (w) => ({ x: W / 2 + (w.x - cam.x) / cam.s, y: cyPantalla + (w.y - cam.y) / cam.s });
    const PG = (g) => P(aMundo(g));

    // Calles genéricas del barrio (no revelan el recorrido).
    const paso = cam.s > 7 ? 440 : 220, x0 = cam.x - (W / 2) * cam.s, x1 = cam.x + (W / 2) * cam.s;
    const y0 = cam.y - cyPantalla * cam.s, y1 = cam.y + (H - cyPantalla) * cam.s;
    let calles = "";
    for (let x = Math.floor(x0 / paso) * paso; x <= x1; x += paso) { const sx = P({ x, y: 0 }).x; calles += `<line x1="${sx}" y1="0" x2="${sx}" y2="${H}" stroke-width="${x % 1320 === 0 ? 9 : 5}"/>`; }
    for (let y = Math.floor(y0 / paso) * paso; y <= y1; y += paso) { const sy = P({ x: 0, y }).y; calles += `<line x1="0" y1="${sy}" x2="${W}" y2="${sy}" stroke-width="${y % 1320 === 0 ? 9 : 5}"/>`; }

    let capa = "";
    if (exacta) {
      const hecho = tramo(p.dAviso ?? d, d).map(PG), falta = tramo(d, p.dRuta).map(PG);
      const linea = (pts) => pts.map((q) => `${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(" ");
      capa += `<polyline points="${linea(hecho)}" fill="none" stroke="var(--muted)" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>`;
      capa += `<polyline points="${linea(falta)}" fill="none" stroke="var(--surface)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>`;
      capa += `<polyline points="${linea(falta)}" fill="none" stroke="var(--navy)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    const c = P(casa);
    capa += `<g transform="translate(${c.x} ${c.y})"><path d="M0 0 C -14 -18 -17 -25 -17 -32 A 17 17 0 1 1 17 -32 C 17 -25 14 -18 0 0 Z" fill="var(--navy)" stroke="var(--surface)" stroke-width="3"/>
      <path d="M-8 -30 L0 -38 L8 -30 L8 -23 L-8 -23 Z" fill="var(--surface)"/>
      <rect x="-24" y="6" width="48" height="20" rx="10" fill="var(--surface)"/><text x="0" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">Casa</text></g>`;
    if (p.estado === "pendiente") {
      if (exacta) {
        const v = PG(van), r = rumboEn(d);
        capa += `<g transform="translate(${v.x} ${v.y}) rotate(${r})">
          <circle r="26" fill="var(--bus)" opacity=".18"/>
          <rect x="-10" y="-17" width="20" height="34" rx="6" fill="var(--bus)" stroke="var(--bus-ink)" stroke-width="2"/>
          <rect x="-7" y="-13" width="14" height="7" rx="2" fill="var(--bus-ink)" opacity=".75"/>
          <rect x="-7" y="6" width="14" height="5" rx="2" fill="var(--bus-ink)" opacity=".45"/></g>`;
      } else {
        const z = PG(zonaDe(van)), rz = 1000 / cam.s;
        capa += `<circle class="zona" cx="${z.x}" cy="${z.y}" r="${rz}" fill="var(--bus)" fill-opacity=".22" stroke="var(--bus)" stroke-width="2.5"/>
          <rect x="${z.x - 52}" y="${z.y - 13}" width="104" height="26" rx="13" fill="var(--surface)"/>
          <text x="${z.x}" y="${z.y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)" font-family="var(--font-body)">🚐 por aquí</text>`;
      }
    }
    svg.innerHTML = `<rect width="${W}" height="${H}" fill="var(--block)"/><g stroke="var(--road)">${calles}</g>${capa}`;
  }

  function construir() {
    let cuerpo;
    if (app.vista === "login") cuerpo = vLogin();
    else if (app.sub === "ficha") cuerpo = vFicha();
    else if (app.sub === "agregar") cuerpo = vAgregar();
    else if (app.sub === "seguir") cuerpo = vSeguir();
    else cuerpo = { inicio: vInicio, historial: vHistorial, perfil: vPerfil }[app.tab]();
    const b = app.banner && app.banner.hasta > performance.now() ? app.banner : null;
    const banner = b && !(R && R.llamada && R.llamada.fase === "sonando") ? `<div class="banner ${b.tipo === "aviso" ? "vibra" : "ok"}" data-a="banner" role="status">
      <span class="app-n">${b.tipo === "aviso" ? "🔊 Furgón Escolar · alarma" : "Furgón Escolar"}</span><b>${esc(b.titulo)}</b><span>${esc(b.cuerpo)}</span></div>` : "";
    return barraSis() + cuerpo + (app.vista === "login" || app.sub === "seguir" ? "" : tabs()) + banner + (app.vista === "login" ? "" : vLlamada());
  }

  function render(forzar = false) {
    const html = construir();
    if (html !== previo && (forzar || !presionando)) {
      const sc = $tel.querySelector(".vista")?.scrollTop ?? 0;
      previo = html; $tel.innerHTML = html;
      const v = $tel.querySelector(".vista"); if (v) v.scrollTop = sc;
    }
    if (app.sub === "seguir") dibujarMapa();
  }

  // ---------- Eventos ----------
  function guardar() {
    const f = app.form, e = {};
    ["nombre", "apellido", "direccion", "c1n"].forEach((k) => { if (!(f[k] || "").trim()) e[k] = "Este dato es obligatorio."; });
    const t1 = normalizarTelefono(f.c1t || "");
    if (!t1) e.c1t = "Revisa el número (ej: 9 1234 5678).";
    const t2 = (f.c2t || "").trim() ? normalizarTelefono(f.c2t) : null;
    if ((f.c2t || "").trim() && !t2) e.c2t = "Revisa el número.";
    if (!f.pin) e.pin = "Marca tu casa en el mapa: así el aviso llega a tiempo.";
    app.errores = e;
    if (Object.keys(e).length) return;
    HIJOS.push({ id: "h" + Date.now(), nombre: f.nombre.trim(), apellido: f.apellido.trim(), curso: f.curso || "—", colegio: f.colegio || "—",
      direccion: f.direccion, indic: f.indic || "—", pin: f.pin, minutos: 5, noViaja: { ida: false, vuelta: false }, asignado: false,
      contactos: [{ nombre: f.c1n, tel: formatear(t1) }, ...(t2 ? [{ nombre: f.c2n || "Secundario", tel: formatear(t2) }] : [])] });
    app.sub = null; app.form = null;
  }

  // Lo escrito ya está en el campo: se guarda en el estado y se marca como dibujado, sin redibujar.
  document.addEventListener("input", (e) => {
    const k = e.target.dataset && e.target.dataset.f;
    if (k && app.form) { app.form[k] = e.target.value; previo = construir(); }
  });
  document.addEventListener("change", (e) => {
    const el = e.target, a = el.dataset && el.dataset.a;
    if (!a) return; // los campos de texto se guardan en "input"
    if (a === "noviaja") {
      const h = HIJOS.find((x) => x.id === el.dataset.id); h.noViaja[el.dataset.t] = el.checked;
      if (R) { const p = parDe(h); if (p && el.dataset.t === "vuelta") { if (el.checked && p.estado === "pendiente") { p.estado = "no_viaja"; linea(`📅 Marcaste que ${h.nombre} no viaja hoy`); if (R.llamada && R.llamada.p === p) R.llamada = null; } else if (!el.checked && p.estado === "no_viaja") p.estado = "pendiente"; } }
    } else if (a === "internet") {
      app.internet = el.checked;
      if (R) {
        linea(app.internet ? "📶 Volvió el internet a tu teléfono" : "📵 Tu teléfono se quedó sin internet");
        if (!app.internet) R.dCongelado = R.d;
        // La llamada por la app que estaba esperando acuse llega apenas vuelve la conexión.
        if (app.internet && R.llamada && R.llamada.fase === "sin_acuse") Object.assign(R.llamada, { fase: "sonando", hastaReal: performance.now() + CFG.timbreReal * 1000 });
      }
      if (app.internet && app.pendientes.length) {
        const pend = app.pendientes; app.pendientes = [];
        pend.forEach((n) => app.notifs.unshift(n));
        app.banner = { ...pend[pend.length - 1], hasta: performance.now() + 6000 };
      }
    } else if (a === "optAlarma") app.alarma = el.checked;
    else if (a === "optLlamada") app.llamadaAuto = el.checked;
    previo = ""; render(true);
  });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-a]"); if (!el || el.tagName === "INPUT") return;
    const a = el.dataset.a;
    if (a === "entrar") { app.vista = "app"; app.tab = "inicio"; }
    else if (a === "tab") { app.tab = el.dataset.id; app.sub = null; }
    else if (a === "simular") { nuevaSimulacion(); app.corriendo = true; app.llamGratis = 0; app.llamPagadas = 0; app.pendientes = []; try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (x) {} }
    else if (a === "reiniciar") { nuevaSimulacion(); app.corriendo = true; app.notifs = []; app.llamGratis = 0; app.llamPagadas = 0; app.pendientes = []; }
    else if (a === "pausa") app.corriendo = !app.corriendo;
    else if (a === "vel") app.vel = Number(el.dataset.v);
    else if (a === "ficha") { app.sub = "ficha"; app.hijoId = el.dataset.id; app.editPin = false; }
    else if (a === "agregar") { app.sub = "agregar"; app.form = { pin: null }; app.errores = {}; }
    else if (a === "atras") { app.sub = null; app.form = null; }
    else if (a === "seguir") { app.sub = "seguir"; app.hijoId = el.dataset.id; cam.s = null; }
    else if (a === "editPin") app.editPin = !app.editPin;
    else if (a === "pin") {
      const r = el.getBoundingClientRect();
      const pin = { x: Math.min(.97, Math.max(.03, (e.clientX - r.left) / r.width)), y: Math.min(.97, Math.max(.2, (e.clientY - r.top) / r.height)) };
      if (app.sub === "agregar") { app.form.pin = pin; delete app.errores.pin; } else { HIJOS.find((x) => x.id === app.hijoId).pin = pin; }
    }
    else if (a === "minutos") HIJOS.find((x) => x.id === app.hijoId).minutos = Number(el.dataset.v);
    else if (a === "guardar") guardar();
    else if (a === "recibido") { const p = R.paradas.find((x) => x.id === el.dataset.id); confirmar(p, "📱 Tocaste “Recibido”: se cancelan las llamadas"); }
    else if (a === "banner") { const b = app.banner; app.banner = null; if (b && b.tipo === "aviso" && R) { const p = R.paradas.find((x) => x.id === b.hijo); if (p && !(R.llamada && R.llamada.fase === "sonando")) confirmar(p, "📱 Abriste la notificación: se cancelan los reintentos"); app.sub = "seguir"; app.hijoId = b.hijo; cam.s = null; } }
    else if (a === "uno") { const l = R.llamada; confirmar(l.p, `✅ Contestaste la llamada ${l.canal === "app" ? "por la app (sin costo)" : "telefónica (con costo)"} y presionaste 1`); }
    else if (a === "colgar") noContesto();
    else if (a === "salir") { app.vista = "login"; app.sub = null; }
    previo = ""; render(true);
  });

  let ult = performance.now(), acc = 0;
  function bucle(ahora) {
    const dt = Math.min(0.25, (ahora - ult) / 1000); ult = ahora;
    const sonando = R && R.llamada && R.llamada.fase === "sonando";
    if (sonando && performance.now() >= R.llamada.hastaReal) noContesto();
    // La simulación espera mientras suena la llamada, para que alcances a contestar.
    if (R && !R.fin && app.corriendo && !sonando) { acc += dt * app.vel; while (acc >= 1 && !R.fin) { paso(); acc--; } }
    render();
    requestAnimationFrame(bucle);
  }
  render(); requestAnimationFrame(bucle);
})();
</script>
</body>
</html>
